/* ---------------- TRANSACTIONS ---------------- */
function txFiltered(){
  const f=ui.txFilter;
  let list=state.transactions.filter(t=>
    (!f.account||t.accountId===f.account)&&
    (!f.category||t.categoryId===f.category)&&
    (!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&
    (!f.tag||(t.tags||[]).some(tg=>tg.toLowerCase()===f.tag.toLowerCase()))&&
    (!f.q||(t.payee+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(f.q.toLowerCase()))
  );
  const k=ui.txSort.key,dir=ui.txSort.dir;
  list.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(k==='amount'){va=a.amount;vb=b.amount}
    if(k==='category'){va=catShort(a.categoryId);vb=catShort(b.categoryId)}
    if(k==='account'){va=acctName(a.accountId);vb=acctName(b.accountId)}
    if(va<vb)return -dir; if(va>vb)return dir;
    return a.id<b.id?-dir:dir;
  });
  return list;
}
VIEWS.transactions=()=>{
  const f=ui.txFilter;
  const list=txFiltered();
  const PAGE=100,pages=Math.max(1,Math.ceil(list.length/PAGE));
  ui.txPage=clamp(ui.txPage,0,pages-1);
  const pageList=list.slice(ui.txPage*PAGE,(ui.txPage+1)*PAGE);
  // linkage badges: which bill/debt already claims each transaction (keyword
  // or explicit link), so covered rows are visible at a glance
  const billByTx={},debtByTx={};
  for(const b of state.bills){
    if(b.active===false||!(b.matchKeyword||'').trim())continue;
    for(const p of ENGINE.billPayments(b))if(!billByTx[p.id])billByTx[p.id]=b.name;
  }
  for(const dd of state.debts){
    for(const p of ENGINE.debtPayments(dd))if(!debtByTx[p.id])debtByTx[p.id]=dd.name;
  }
  // running balance when filtered to one account (compute over date-asc order)
  let running=null;
  if(f.account){
    const acct=byId(state.accounts,f.account);
    running=new Map();
    const asc=state.transactions.filter(t=>t.accountId===f.account).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
    // reconstruct backwards from current balance
    let bal=acct?acct.balance:0;
    for(let i=asc.length-1;i>=0;i--){running.set(asc[i].id,bal);bal-=asc[i].amount}
  }
  const upcoming=ENGINE.recurUpcoming(30);
  let h=`<div class="toolbar">
    <button class="btn primary" data-action="tx-add">+ Add</button>
    <button class="btn" data-action="csv-import">Import CSV</button>
    <button class="btn" data-action="ai-import" title="${state.settings.apiKey?'Extract transactions from a PDF or photographed statement with Claude':'Add your Anthropic API key in Settings first'}">&#10022; AI import statement</button>
    <button class="btn" data-action="ai-categorise" title="${state.settings.apiKey?'Categorise uncategorised transactions with Claude':'Add your Anthropic API key in Settings first'}">&#10022; AI categorise${(c=>c?` (${c})`:'')(state.transactions.filter(t=>!t.categoryId).length)}</button>
    <button class="btn" data-action="tx-export">Export CSV</button>
    <button class="btn" data-action="recur-manage">Recurring${state.recurring.length?` (${state.recurring.length})`:''}</button>
    <span class="spacer"></span>
    ${ui.txSel.size?`<span class="badge or">${ui.txSel.size} selected</span>
      <button class="btn sm" data-action="tx-bulk-cat">Re-categorise</button>
      <button class="btn sm" data-action="tx-bulk-ai" title="Categorise the selected transactions with Claude (re-categorises even if already set)">&#10022; AI categorise selected</button>
      <button class="btn sm" data-action="tx-bulk-bill">Link to bill</button>
      <button class="btn sm" data-action="tx-bulk-debt">Link to debt</button>
      <button class="btn sm" data-action="tx-bulk-move" title="Move the selected transactions to a different account (e.g. a statement imported to the wrong one)">Move to account</button>
      <button class="btn sm danger" data-action="tx-bulk-del">Delete</button>`:''}
  </div>
  <div class="toolbar">
    <select data-change="tx-filter" data-k="account" style="width:170px">${'<option value="">All accounts</option>'+state.accounts.filter(a=>!a.archived||f.account===a.id||state.transactions.some(t=>t.accountId===a.id)).map(a=>`<option value="${a.id}" ${f.account===a.id?'selected':''}>${esc(a.name)}${a.archived?' (archived)':''}</option>`).join('')}</select>
    <select data-change="tx-filter" data-k="category" style="width:190px"><option value="">All categories</option>${[...catGroups()].map(([g,cats])=>`<optgroup label="${esc(g)}">`+cats.map(c=>`<option value="${c.id}" ${f.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')+'</optgroup>').join('')}</select>
    <input type="date" data-change="tx-filter" data-k="from" value="${f.from}" style="width:140px" title="From">
    <input type="date" data-change="tx-filter" data-k="to" value="${f.to}" style="width:140px" title="To">
    <input data-input="tx-filter" data-k="q" value="${esc(f.q)}" placeholder="Search payee / notes / tags..." style="width:220px">
    ${(()=>{const tags=[...new Set(state.transactions.flatMap(t=>t.tags||[]))].sort();
      return tags.length?`<select data-change="tx-filter" data-k="tag" style="width:130px"><option value="">All tags</option>${tags.map(tg=>`<option value="${esc(tg)}" ${f.tag===tg?'selected':''}>${esc(tg)}</option>`).join('')}</select>`:''})()}
    ${(f.account||f.category||f.from||f.to||f.q)?'<button class="btn sm ghost" data-action="tx-clear-filter">clear</button>':''}
  </div>`;
  if(upcoming.length){
    h+=`<div class="card" style="margin-bottom:14px;padding:10px 14px"><span class="sec-label">Upcoming recurring (30d): </span>`+
      upcoming.slice(0,5).map(u=>`<span class="badge ${u.overdue?'rd':''}" style="margin:2px 4px">${esc(u.rec.payee)} ${fmtD(u.date)} <span class="acc" data-action="recur-post" data-id="${u.rec.id}" data-date="${u.date}" style="cursor:pointer">post&nbsp;&rarr;</span></span>`).join('')+`</div>`;
  }
  if(!state.transactions.length)return h+emptyBox('\u21C6','No transactions yet. Add them manually or import your bank CSV - keyword rules will auto-categorise as you go.','<button class="btn" data-action="csv-import">Import a bank CSV</button>');
  if(!list.length)return h+emptyBox('\u2205','Nothing matches the current filters.','<button class="btn sm" data-action="tx-clear-filter">Clear filters</button>');
  const th=(k,label,cls)=>`<th class="sortable ${cls||''}" data-action="tx-sort" data-k="${k}">${label} ${ui.txSort.key===k?(ui.txSort.dir>0?'\u25B4':'\u25BE'):''}</th>`;
  const allSel=pageList.length&&pageList.every(t=>ui.txSel.has(t.id));
  h+=`<div class="card pad0"><table>
    <thead><tr><th style="width:30px"><input type="checkbox" data-change="tx-sel-all" ${allSel?'checked':''}></th>
    ${th('date','Date')}${th('payee','Payee')}${th('account','Account')}${th('category','Category')}${th('amount','Amount','r')}${running?'<th class="r">Balance</th>':''}<th></th></tr></thead><tbody>`;
  for(const t of pageList){
    h+=`<tr>
      <td><input type="checkbox" data-change="tx-sel" data-id="${t.id}" ${ui.txSel.has(t.id)?'checked':''}></td>
      <td class="mut">${fmtD(t.date)}</td>
      <td>${esc(t.payee)}${(t.tags||[]).map(tg=>` <span class="badge tagbtn${ui.txFilter.tag&&ui.txFilter.tag.toLowerCase()===tg.toLowerCase()?' or':''}" data-action="tx-tag" data-tag="${esc(tg)}" title="Filter by tag '${esc(tg)}'">${esc(tg)}</span>`).join('')}
        ${billByTx[t.id]?` <span class="badge bl" title="Matched to bill '${esc(billByTx[t.id])}' - no manual linking needed">&#9878; ${esc(billByTx[t.id])}</span>`:''}
        ${debtByTx[t.id]?` <span class="badge rd" title="Counts as a repayment on debt '${esc(debtByTx[t.id])}'">&#9660; ${esc(debtByTx[t.id])}</span>`:''}</td>
      <td class="mut">${esc(acctName(t.accountId))}</td>
      <td class="mut">${esc(catShort(t.categoryId))}</td>
      <td class="r ${t.amount>=0?'pos':''}">${fmtS(t.amount)}</td>
      ${running?`<td class="r mut">${fmtS(running.get(t.id)??0)}</td>`:''}
      <td><span class="row-act"><button class="iconbtn" data-action="tx-to-bill" data-id="${t.id}" title="Create a bill from this transaction">&#9878;</button><button class="iconbtn" data-action="tx-edit" data-id="${t.id}">&#9998;</button><button class="iconbtn del" data-action="tx-del" data-id="${t.id}">&#10005;</button></span></td>
    </tr>`;
  }
  h+='</tbody></table></div>';
  h+=`<div class="toolbar" style="margin-top:10px"><span class="dim" style="font-family:var(--mono);font-size:12px">${list.length} transactions &middot; net ${fmtS(sum(list.map(t=>t.amount)))}</span><span class="spacer"></span>
    ${pages>1?`<button class="btn sm" data-action="tx-page" data-d="-1" ${ui.txPage===0?'disabled':''}>&larr;</button><span class="num dim" style="font-size:12px">${ui.txPage+1}/${pages}</span><button class="btn sm" data-action="tx-page" data-d="1" ${ui.txPage>=pages-1?'disabled':''}>&rarr;</button>`:''}</div>`;
  return h;
};
function txForm(t={}){
  return`<div class="frow">
    <label class="f"><span class="fl">Date</span><input type="date" name="date" value="${t.date||todayISO()}" required></label>
    <label class="f"><span class="fl">Account</span><select name="accountId">${acctOptions(t.accountId)}</select></label>
  </div>
  <label class="f"><span class="fl">Payee / description</span><input name="payee" value="${esc(t.payee||'')}" required></label>
  <div class="frow">
    <label class="f"><span class="fl">Category</span><select name="categoryId">${catOptions(t.categoryId)}</select></label>
    <label class="f"><span class="fl">Amount $ (negative = expense)</span><input name="amount" value="${t.amount!=null?(t.amount/100).toFixed(2):''}" inputmode="decimal" placeholder="-45.00" required></label>
  </div>
  <div class="frow">
    <label class="f"><span class="fl">Payment of bill</span><select name="billId"><option value="">- none -</option>${state.bills.filter(b2=>b2.active!==false).map(b2=>`<option value="${b2.id}" ${t.billId===b2.id?'selected':''}>${esc(b2.name)}</option>`).join('')}</select></label>
    <label class="f"><span class="fl">Debt repayment of</span><select name="debtId">${debtOptions(t.debtId)}</select></label>
    <label class="f"><span class="fl">Tags (comma separated)</span><input name="tags" value="${esc((t.tags||[]).join(', '))}"></label>
    <label class="f"><span class="fl">Notes</span><input name="notes" value="${esc(t.notes||'')}"></label>
  </div>`;
}

/* ---------------- BILLS (weekly transfer calculator) ---------------- */
VIEWS.bills=()=>{
  const s=ENGINE.billsSummary();
  const proj=ENGINE.billsProjection(12);
  const upcoming=ENGINE.upcomingBills(30);
  const act=state.bills.filter(b=>b.active!==false);
  let h=`<div class="hero" style="margin-bottom:14px">
    <div class="main-fig">
      <div class="l" title="Every bill normalised to a true weekly cost: monthly x 12 / 52, quarterly x 4 / 52, half-yearly x 2 / 52, annual / 52. Transfer this every week and every bill is covered on average; the health check verifies the timing.">Weekly Transfer <span class="dim" style="font-size:10px">&#9432;</span></div>
      <div class="v">${fmt(s.final)}</div>
      ${s.buffer||state.settings.billsRound?`<div class="dim" style="font-family:var(--mono);font-size:12.5px;margin-top:4px">base ${fmt(s.weekly)}${s.buffer?` + ${state.settings.billsBuffer}% buffer ${fmt(s.buffer)}`:''}${state.settings.billsRound?` &middot; rounded up to $${state.settings.billsRound}s`:''}</div>`:''}
    </div>
    <div class="alt"><div class="l">Fortnightly</div><div class="v">${fmt(s.fortnightly)}</div></div>
    <div class="alt"><div class="l">Monthly</div><div class="v">${fmt(s.monthly)}</div></div>
    <div class="alt"><div class="l">Annual Bills</div><div class="v">${fmt0(s.annual)}</div></div>
    ${(()=>{const incWk=Math.round(ENGINE.incomeMonthly()*12/52);
      if(!incWk)return '';
      const left=incWk-Math.round(s.final);
      return`<div class="alt"><div class="l">Left after transfer</div><div class="v" style="color:${left<0?'var(--rd)':'var(--gn)'}">${fmtS(left)}</div></div>`})()}
    ${s.excluded?`<div class="alt"><div class="l">Excluded</div><div class="v" style="color:var(--am)">${s.excluded} bill${s.excluded>1?'s':''}</div></div>`:''}
    <div class="alt" style="min-width:200px">
      <div class="l">Buffer %</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <input data-change="bills-buffer" type="number" min="0" max="50" step="1" value="${state.settings.billsBuffer||0}" style="width:70px">
        <select data-change="bills-round" style="width:110px">
          <option value="0" ${!state.settings.billsRound?'selected':''}>No rounding</option>
          <option value="5" ${state.settings.billsRound===5?'selected':''}>Round to $5</option>
          <option value="10" ${state.settings.billsRound===10?'selected':''}>Round to $10</option>
        </select>
      </div>
    </div>
  </div>`;
  h+=`<div class="toolbar"><button class="btn primary" data-action="bill-add">+ Add Bill</button>
    <span class="spacer"></span>
    <span class="sec-label">Bills account:</span>
    <select data-change="bills-account" style="width:190px">${acctOptions(state.settings.billsAccountId)}</select></div>`;
  if(!state.bills.length)return h+emptyBox('\u2261','No bills yet. Add every regular bill - power, insurance, rego, streaming - and FinanceHub will tell you the exact weekly amount to set aside.','<button class="btn" data-action="bill-add">Add your first bill</button>');
  // health check + category donut stacked on the left, upcoming on the right;
  // align-items:start stops the shorter cards stretching to the tallest one
  h+='<div class="grid g2" style="margin-bottom:14px"><div class="grid" style="gap:14px;align-content:start">';
  h+=`<div class="card"><h3>Bills Account Health <span class="r dim" style="font-family:var(--mono);font-size:11px">12 WEEK PROJECTION</span></h3>`;
  if(!state.settings.billsAccountId)h+=`<p class="dim" style="font-size:12.5px;line-height:1.6">Select your bills account above to project its balance: weekly transfer of ${fmt(s.final)} in, each bill out on its due date.</p>`;
  else{
    h+=chart('bills-proj',el=>CH.line(el,{labels:proj.rows.map(r=>'W'+r.week),series:[{name:'Projected balance',color:proj.shortfalls.length?CONFIG.colors.rd:CONFIG.colors.gn,data:proj.rows.map(r=>r.bal)}],fillFirst:true,height:180}));
    if(proj.shortfalls.length)
      h+=`<div style="margin-top:10px;font-size:12.5px;color:var(--rd);font-family:var(--mono)">&#9888; Balance goes negative in week${proj.shortfalls.length>1?'s':''} ${proj.shortfalls.map(r=>r.week).join(', ')} (timing shortfall).<br><span style="color:var(--tx2)">Minimum opening float so a zero-start never dips below $0: <b class="acc">${fmt(proj.minFloat)}</b>. Current opening: ${fmt(proj.opening)}.</span></div>`;
    else h+=`<div style="margin-top:10px;font-size:12.5px;color:var(--gn);font-family:var(--mono)">&#10003; No shortfall weeks. Min float needed from a zero start: ${fmt(proj.minFloat)} &middot; opening balance ${fmt(proj.opening)}.</div>`;
  }
  h+='</div>';
  // annual cost by category (left column, under health)
  const byCat={};for(const b of act){const k=b.categoryId?catShort(b.categoryId):'Uncategorised';byCat[k]=(byCat[k]||0)+ENGINE.billAnnual(b)}
  const items=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([n,v],i)=>({name:n,value:Math.round(v),color:CONFIG.series[i%CONFIG.series.length]}));
  const per=ui.billCatPeriod||'annual';
  const perCfg={weekly:['PER WEEK',52,'Weekly'],monthly:['PER MONTH',12,'Monthly'],quarterly:['PER QUARTER',4,'Quarterly'],annual:['PER YEAR',1,'Annual']};
  const [perLabel,perDiv,perTitle]=perCfg[per]||perCfg.annual;
  const pitems=items.map(x=>({...x,value:Math.round(x.value/perDiv)}));
  h+=`<div class="card" style="flex:1"><h3>${perTitle} Bill Cost by Category <span class="r pill-row" style="gap:4px">${Object.entries(perCfg).map(([k,v])=>`<button class="btn sm ${per===k?'primary':''}" data-action="bill-cat-period" data-p="${k}" style="padding:2px 8px;font-size:10px">${v[2]}</button>`).join('')}</span></h3>${chart('bills-donut',el=>CH.donut(el,{items:pitems,centerLabel:perLabel,centerValue:fmt0(s.annual/perDiv)}))}</div>`;
  h+='</div>';
  h+=`<div class="card" style="display:flex;flex-direction:column;min-height:0"><h3>Upcoming <span class="r dim" style="font-family:var(--mono);font-size:11px">NEXT 30 DAYS</span></h3>`;
  if(!upcoming.length)h+='<p class="dim" style="font-size:12.5px">Nothing due in the next 30 days.</p>';
  else h+='<div style="flex:1;overflow:auto;min-height:0"><table class="compact fit"><tbody>'+upcoming.map(u=>`<tr><td>${esc(u.bill.name)}</td><td class="mut">${fmtD(u.bill.nextDue)}</td><td class="r">${fmt(u.bill.amount)}</td><td class="r">${dueBadge(u.days)}</td><td class="r"><button class="btn sm" data-action="bill-paid" data-id="${u.bill.id}">Paid &#10003;</button></td></tr>`).join('')+'</tbody></table></div>';
  h+='</div></div>';
  {
    const incWk=Math.round(ENGINE.incomeMonthly()*12/52);
    if(incWk){
      const ps=ENGINE.paySplit();
      const wk=v=>Math.round(v*12/52);
      const rows=[
        ['Income',incWk,'var(--gn)',''],
        ['Bills transfer',-Math.round(s.final),CONFIG.colors.bl,'covers every bill in the register'],
        ['Debt minimums outside the transfer',-wk(ps.mins),CONFIG.colors.rd,ps.minsCovered?`${fmt0(wk(ps.minsCovered))}/wk more is already inside the transfer`:''],
        ['Living spend',-wk(ps.spend),CONFIG.colors.am,'set in Pay Split']
      ];
      let run=0;
      h+=`<div class="card" style="margin-bottom:14px"><h3>What's Left After The Transfer</h3>
      <table class="fit"><tbody>
      ${rows.map(([n,v,c,note],i)=>{run+=v;return`<tr><td>${i?`<span style="display:inline-block;width:9px;height:9px;background:${c};margin-right:8px;border-radius:2px"></span>`:''}${n}</td>
        <td class="r num" style="color:${i?c:'var(--gn)'}">${i?'- '+fmt(Math.abs(v)):fmt(v)}</td>
        <td class="r num dim">${i===0?'':'leaves '+fmtS(run)}</td>
        <td class="mut" style="font-size:11.5px">${note}</td></tr>`}).join('')}
      <tr class="tot"><td><b>Spare per week</b></td><td class="r num" style="color:${run>=0?'var(--gn)':'var(--rd)'}"><b>${fmtS(run)}</b></td><td class="r dim num">${fmtS(Math.round(run*52/12))}/mo</td><td class="mut" style="font-size:11.5px">${run>=0?'uncommitted - allocate it in Pay Split':'committed costs exceed income'}</td></tr>
      </tbody></table></div>`;
    }
  }
  // ---- register: filter / group / sort ----
  const bf=ui.billFilter;
  const freqName=b=>{const f=CONFIG.billFreqs.find(x=>x.id===b.freq);return (f?f.n:b.freq)+(b.freq==='customN'?' ('+(b.everyN||1)+')':'')+(b.freq==='schedule'?' ('+(b.schedule||[]).length+')':'')};
  const gKey=b=>{
    const c=byId(state.categories,b.categoryId);
    switch(ui.billGroup){
      case 'catgroup':return c?c.group:'Uncategorised';
      case 'category':return c?c.name:'Uncategorised';
      case 'frequency':return freqName(b);
      case 'method':return b.method||'No method';
      case 'account':return b.accountId?acctName(b.accountId):'No account';
      case 'transfer':return b.inTransfer===false?'Not in weekly transfer':'In weekly transfer';
      default:return '';
    }
  };
  let list=state.bills.filter(b=>
    (bf.status==='all'||(bf.status==='active'?b.active!==false:bf.status==='cancelled'?!!b.cancelled:(b.active===false&&!b.cancelled)))&&
    (!bf.freq||b.freq===bf.freq)&&
    (!bf.transfer||(bf.transfer==='in'?b.inTransfer!==false:b.inTransfer===false))&&
    (!bf.q||(b.name+' '+(b.notes||'')+' '+(b.method||'')+' '+catName(b.categoryId)).toLowerCase().includes(bf.q.toLowerCase()))
  );
  const cmp={weekly:(a,b)=>ENGINE.billWeekly(b)-ENGINE.billWeekly(a),
    annual:(a,b)=>ENGINE.billAnnual(b)-ENGINE.billAnnual(a),
    amount:(a,b)=>b.amount-a.amount,
    name:(a,b)=>a.name.localeCompare(b.name),
    due:(a,b)=>(a.nextDue||'').localeCompare(b.nextDue||'')}[ui.billSort]||((a,b)=>ENGINE.billWeekly(b)-ENGINE.billWeekly(a));
  const fUsed=[...new Set(state.bills.map(b=>b.freq))];
  h+=`<div class="toolbar">
    <button class="btn primary sm" data-action="bill-add">+ Add Bill</button>
    <span class="sec-label">Group</span>
    <select data-change="bill-group" style="width:150px">${[['catgroup','Category group'],['category','Category'],['frequency','Frequency'],['method','Payment method'],['account','Account'],['transfer','In / out of transfer'],['none','No grouping']].map(([v,n])=>`<option value="${v}" ${ui.billGroup===v?'selected':''}>${n}</option>`).join('')}</select>
    <span class="sec-label">Sort</span>
    <select data-change="bill-sort" style="width:120px">${[['weekly','Weekly cost'],['annual','Annual cost'],['amount','Amount'],['due','Next due'],['name','Name']].map(([v,n])=>`<option value="${v}" ${ui.billSort===v?'selected':''}>${n}</option>`).join('')}</select>
    <select data-change="bill-filter" data-k="freq" style="width:130px"><option value="">All frequencies</option>${fUsed.map(fq=>{const f=CONFIG.billFreqs.find(x=>x.id===fq);return `<option value="${fq}" ${bf.freq===fq?'selected':''}>${f?f.n:fq}</option>`}).join('')}</select>
    <select data-change="bill-filter" data-k="transfer" style="width:150px"><option value="">In and out of transfer</option><option value="in" ${bf.transfer==='in'?'selected':''}>In transfer only</option><option value="out" ${bf.transfer==='out'?'selected':''}>Excluded only</option></select>
    <select data-change="bill-filter" data-k="status" style="width:110px"><option value="active" ${bf.status==='active'?'selected':''}>Active</option><option value="paused" ${bf.status==='paused'?'selected':''}>Paused</option><option value="cancelled" ${bf.status==='cancelled'?'selected':''}>Cancelled</option><option value="all" ${bf.status==='all'?'selected':''}>All</option></select>
    <input data-input="bill-filter" data-k="q" value="${esc(bf.q)}" placeholder="Search bills..." style="width:160px">
    ${(bf.q||bf.freq||bf.transfer||bf.status!=='active')?'<button class="btn sm" data-action="bill-clear-filter">Clear</button>':''}
    ${ui.billGroup!=='none'?`<button class="btn sm" data-action="bill-group-all" data-mode="${Object.keys(ui.billCollapsed||{}).length?'expand':'collapse'}">${Object.keys(ui.billCollapsed||{}).length?'Expand all':'Collapse all'}</button>`:''}
    <span class="spacer"></span>
    <button class="btn sm" data-action="bill-report" title="Print-ready bills register: opens in a new tab, use Print / Save as PDF">&#9113; Report</button>
    <button class="btn sm" data-action="bill-csv">CSV</button>
  </div>`;
  const groups=new Map();
  for(const b of list){const k=gKey(b);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(b)}
  const shownWk=sum(list.filter(b=>b.active!==false&&b.inTransfer!==false).map(b=>ENGINE.billWeekly(b)));
  const shownAn=sum(list.filter(b=>b.active!==false).map(b=>ENGINE.billAnnual(b)));
  h+=`<div class="card pad0"><table><thead><tr><th>Bill</th><th>Frequency</th><th>Method</th><th>Last paid</th><th>Next due</th><th class="r">Amount</th><th class="r" title="Amount normalised to a week: monthly x 12 / 52, quarterly x 4 / 52, annual / 52">Weekly</th><th class="r" title="Annual / 12">Monthly</th><th class="r">Annual</th><th></th></tr></thead><tbody>`;
  if(!list.length)h+=`<tr><td colspan="10" class="dim" style="padding:18px">No bills match these filters.</td></tr>`;
  for(const [g,bills] of [...groups.entries()].sort((a,b)=>{
      if(ui.billGroup==='none')return 0;
      const wa=sum(a[1].map(x=>ENGINE.billWeekly(x))),wb=sum(b[1].map(x=>ENGINE.billWeekly(x)));
      return ui.billSort==='name'?(a[0]<b[0]?-1:1):(wb-wa);
    })){
    const gw=sum(bills.filter(b=>b.active!==false&&b.inTransfer!==false).map(b=>ENGINE.billWeekly(b)));
    const ga=sum(bills.filter(b=>b.active!==false).map(b=>ENGINE.billAnnual(b)));
    const collapsed=!!(ui.billCollapsed&&ui.billCollapsed[g]);
    // header band: name + count only (numbers live on the lines and the subtotal);
    // collapsed groups show the totals on the band so nothing is lost
    if(g!=='')h+=`<tr class="grp" data-action="bill-group-toggle" data-g="${esc(g)}"><td colspan="${collapsed?6:10}"><span class="car">${collapsed?'&#9656;':'&#9662;'}</span><span class="sec-label" style="color:var(--tx)">${esc(g)}</span><span class="cnt">${bills.length} BILL${bills.length>1?'S':''}</span></td>${collapsed?`<td class="r acc num" style="font-weight:700">${fmt(Math.round(gw))}</td><td class="r num" style="font-weight:700">${fmt(Math.round(ga/12))}</td><td class="r num" style="font-weight:700">${fmt0(ga)}</td><td></td>`:''}</tr>`;
    if(collapsed)continue;
    let firstRow=true;
    for(const b of bills.sort(cmp)){
      const f=CONFIG.billFreqs.find(x=>x.id===b.freq);
      h+=`<tr class="ln ${firstRow?'first':''}" style="${b.active===false?'opacity:.45':''}">`;firstRow=false;h+=`
        <td>${esc(b.name)}${b.cancelled?` <span class="badge" title="Cancelled${b.cancelledDate?' '+fmtD(b.cancelledDate):''} - kept for history">CANCELLED</span>`:b.active===false?' <span class="badge">PAUSED</span>':''}${b.inTransfer===false?' <span class="badge am" title="Not funded by the weekly transfer - paid from another account">NOT IN TRANSFER</span>':''}${b.debtId?` <span class="badge rd" title="Funds the repayment of '${esc((byId(state.debts,b.debtId)||{}).name||'')}' - Pay Split counts it once">&#9660; ${esc((byId(state.debts,b.debtId)||{}).name||'debt')}</span>`:''}${b.autoFrom?' <span class="badge" title="Managed by the debt - edit the amount or frequency on the debt itself">AUTO</span>':''}${b.notes?` <span class="dim" title="${esc(b.notes)}">&#9776;</span>`:''}
          ${(dr=>dr?`<div class="num" style="font-size:11px;margin-top:2px;color:${Math.abs(dr.pc)>10?'var(--am)':'var(--tx3)'}">actuals avg ${fmt(dr.avg)}${Math.abs(dr.pc)>10?` (${dr.pc>0?'+':''}${dr.pc.toFixed(0)}% vs registered - update amount to fix the weekly transfer)`:''}</div>`:'')(ENGINE.billDrift(b))}</td>
        <td class="mut">${f?f.n:''}${b.freq==='customN'?' ('+(b.everyN||1)+')':''}${b.freq==='schedule'?(r=>` <span class="dim">(${r.of-r.count}/${r.of} paid)</span>`)(ENGINE.scheduleRemaining(b)):''}</td>
        <td class="mut">${esc(b.method||'')}</td>
        ${(lp=>`<td class="mut num" title="${lp?'From transactions: '+fmt(lp.total)+' on '+fmtD(lp.date):'No matching transaction yet - set a match keyword'}">${lp?fmtD(lp.date):'<span class="dim">\u2014</span>'}</td>`)(ENGINE.billLastPaid(b))}
        <td class="mut">${b.scheduleDone?'<span class="badge gn">COMPLETE</span>':fmtD(b.nextDue)}${b.autoAdvance!==false&&(b.matchKeyword||'').trim()?'':' <span class="dim" title="No keyword or auto-advance off - due date only moves when you press Paid">&#8226;</span>'}${b.freq==='schedule'&&!b.scheduleDone?(r=>`<div class="dim num" style="font-size:11px">${r.count} left &middot; ${fmt(r.total)}</div>`)(ENGINE.scheduleRemaining(b)):''}</td>
        <td class="r">${fmt(b.amount)}</td>
        <td class="r ${b.inTransfer===false?'mut':'acc'}">${b.inTransfer===false?'-':fmt(Math.round(ENGINE.billWeekly(b)))}</td>
        <td class="r">${fmt(Math.round(ENGINE.billAnnual(b)/12))}</td>
        <td class="r">${fmt0(ENGINE.billAnnual(b))}</td>
        <td><span class="row-act"><button class="iconbtn" data-action="bill-edit" data-id="${b.id}">&#9998;</button>${b.cancelled?`<button class="btn sm" data-action="bill-reinstate" data-id="${b.id}">Reinstate</button>`:`<button class="iconbtn" data-action="bill-cancel" data-id="${b.id}" title="Cancelled - keep for history">&#8856;</button>`}<button class="iconbtn del" data-action="bill-del" data-id="${b.id}">&#10005;</button></span></td>
      </tr>`;
    }
    if(g!==''&&bills.length>1)h+=`<tr class="sub"><td colspan="6">Subtotal &middot; ${esc(g)}</td><td class="r num">${fmt(Math.round(gw))}</td><td class="r num">${fmt(Math.round(ga/12))}</td><td class="r num">${fmt0(ga)}</td><td></td></tr>`;
  }
  const filtered=list.length!==state.bills.length;
  h+=`<tr class="tot"><td colspan="5">${filtered?'TOTAL (SHOWN)':'TOTAL (ACTIVE)'}</td><td></td><td class="r acc">${fmt(Math.round(shownWk))}</td><td class="r">${fmt(Math.round(shownAn/12))}</td><td class="r">${fmt0(shownAn)}</td><td></td></tr>`;
  if(filtered)h+=`<tr><td colspan="5" class="dim" style="font-size:11.5px">All active bills: ${fmt(Math.round(s.weekly))}/wk &middot; ${fmt0(s.annual)}/yr</td><td></td><td class="r dim num" style="font-size:11.5px">${fmt(Math.round(s.weekly))}</td><td class="r dim num" style="font-size:11.5px">${fmt(Math.round(s.annual/12))}</td><td class="r dim num" style="font-size:11.5px">${fmt0(s.annual)}</td><td></td></tr>`;
  h+='</tbody></table></div>';
  return h;
};
function billForm(b={}){
  return`${b.autoFrom?`<p style="font-size:12.5px;margin-bottom:12px;color:var(--am)">&#9888; Managed by the debt "${esc((byId(state.debts,b.autoFrom)||{}).name||'')}" - change the amount or frequency on the debt itself, or untick "Fund this repayment from the weekly bills transfer" there. Edits to those fields here are overwritten.</p>`:''}<div class="frow">
    <label class="f"><span class="fl">Bill name</span><input name="name" value="${esc(b.name||'')}" required></label>
    <label class="f"><span class="fl">Category</span><select name="categoryId">${catOptions(b.categoryId)}</select></label>
  </div>
  <div class="frow">
    <label class="f"><span class="fl">Transaction match keyword</span><input name="matchKeyword" value="${esc(b.matchKeyword||'')}" placeholder="e.g. SYNERGY - links actual payments to this bill"></label>
    <label class="f" style="align-self:end"><span class="chk"><input type="checkbox" name="autoAdvance" ${b.autoAdvance!==false?'checked':''}> Auto-advance due date when a matching payment appears</span></label>
  </div>
  <label class="chk" style="margin-bottom:10px"><input type="checkbox" name="inTransfer" ${b.inTransfer!==false?'checked':''}> Include in weekly transfer (this bill is paid FROM the bills account)</label>
  <div class="frow" style="margin-bottom:6px">
    <label class="f"><span class="fl">Funds debt repayment of</span><select name="debtId">${debtOptions(b.debtId,'- none, ordinary bill -')}</select></label>
  </div>
  <p class="dim" style="font-size:12px;margin-top:-2px;margin-bottom:10px">For loan repayments: if the money routes THROUGH the bills account, keep the transfer box ticked AND link the debt here - Pay Split then counts it once (in the bills line, not the minimums line). If it debits another account entirely, untick the transfer box instead.</p>
  <div class="frow3">
    <label class="f"><span class="fl">Amount $</span><input name="amount" value="${b.amount!=null?(b.amount/100).toFixed(2):''}" inputmode="decimal" required></label>
    <label class="f"><span class="fl">Frequency</span><select name="freq" data-change="bill-freq-toggle">${CONFIG.billFreqs.map(f=>`<option value="${f.id}" ${b.freq===f.id?'selected':''}>${f.n}</option>`).join('')}</select></label>
    <label class="f" id="everyN-wrap" style="${b.freq==='customN'?'':'display:none'}"><span class="fl">Every N weeks</span><input name="everyN" type="number" min="1" value="${b.everyN||4}"></label>
  </div>
  <div id="schedule-wrap" style="${b.freq==='schedule'?'':'display:none'};margin-bottom:8px">
    <label class="f"><span class="fl">Instalments - one per line: date, amount (add "paid" to tick one off)</span><textarea name="scheduleText" rows="5" style="font-family:var(--mono);font-size:12.5px" placeholder="15/09/2026 49.26 paid&#10;17/11/2026 619.66&#10;19/01/2027 619.66&#10;23/03/2027 619.66">${esc((b.schedule||[]).map(i=>fmtD(i.date)+' '+(i.amount/100).toFixed(2)+(i.paid?' paid':'')).join('\n'))}</textarea></label>
    <p class="dim" style="font-size:11.5px;line-height:1.6;margin-top:-4px">Amount and Next due below are filled from the next unpaid instalment. Weekly set-aside = total of the schedule &divide; 52, so a notice covering one year is spread evenly. Matched payments tick instalments off in order; when the last one is paid the bill shows complete until you paste next year's notice.</p>
  </div>
  <div class="frow3">
    <label class="f"><span class="fl">Next due date</span><input type="date" name="nextDue" value="${b.nextDue||todayISO()}">${(lp=>lp?`<span class="dim num" style="font-size:11px;margin-top:3px">last paid ${fmtD(lp.date)} (${fmt(lp.total)}) &middot; auto-advance sets next due to last paid + 1 cycle</span>`:'')(b.id?ENGINE.billLastPaid(b):null)}</label>
    <label class="f"><span class="fl">Paid from account</span><select name="accountId">${acctOptions(b.accountId)}</select></label>
    <label class="f"><span class="fl">Payment method</span><select name="method">${['Direct debit','BPAY','Manual'].map(m=>`<option ${b.method===m?'selected':''}>${m}</option>`).join('')}</select></label>
  </div>
  <div class="frow">
    <label class="f"><span class="fl">Notes</span><input name="notes" value="${esc(b.notes||'')}"></label>
    <label class="f" style="align-self:end"><span class="chk"><input type="checkbox" name="active" ${b.active!==false?'checked':''}> Active (counted in weekly transfer)</span></label>
  </div>`;
}

/* ---------------- BUDGET ---------------- */
VIEWS.budget=()=>{
  const mk=ui.budgetMonth;
  const mode=ui.budgetMode||state.settings.payCycle||'monthly'; // display mode
  const perFn=mode==='fortnightly';
  const budget=state.budgets[mk]||{};
  const smooth=ui.budgetSmooth!==false;
  const actuals=smooth?ENGINE.monthActualsSmoothed(mk):ENGINE.monthActuals(mk);
  const billCats=ENGINE.billBackedCats();
  const conv=v=>perFn?v*12/26:v; // monthly cents -> display
  let h=`<div class="toolbar">
    <button class="btn sm" data-action="budget-month" data-d="-1">&larr;</button>
    <span class="num" style="font-size:15px;font-weight:700;min-width:90px;text-align:center">${fmtMY(mk+'-01')}</span>
    <button class="btn sm" data-action="budget-month" data-d="1">&rarr;</button>
    <button class="btn sm" data-action="budget-copy">Copy from previous month</button>
    <button class="btn sm" data-action="budget-prefill">Pre-fill from bills</button>
    <span class="spacer"></span>
    <span class="sec-label">Show per:</span>
    <select data-change="budget-mode" style="width:130px"><option value="monthly" ${!perFn?'selected':''}>Month</option><option value="fortnightly" ${perFn?'selected':''}>Fortnight</option></select>
    <label class="chk" style="margin-left:10px" title="Quarterly and annual bills are budgeted monthly but paid in lumps - spreading each payment across its cycle makes budget vs actual comparable"><input type="checkbox" data-change="budget-smooth" ${smooth?'checked':''}> Spread bill payments across their cycle</label>
  </div>`;
  // summary strip
  let bInc=0,bExp=0,aInc=0,aExp=0;
  for(const c of state.categories){
    const bv=budget[c.id]||0,av=actuals[c.id]||0;
    if(c.group==='Income'){bInc+=bv;aInc+=Math.max(0,av)}
    else{bExp+=bv;aExp+=Math.max(0,-av)}
  }
  h+=`<div class="grid g4" style="margin-bottom:14px">
    ${statCard('Budgeted Income',fmt(conv(bInc)),'pos','actual '+fmt(conv(aInc)))}
    ${statCard('Budgeted Expenses',fmt(conv(bExp)),'','actual '+fmt(conv(aExp)))}
    ${statCard('Budgeted Surplus',fmtS(conv(bInc-bExp)),bInc-bExp>=0?'pos':'neg','')}
    ${statCard('Actual Surplus',fmtS(conv(aInc-aExp)),aInc-aExp>=0?'pos':'neg','')}
  </div>`;
  h+=`<div class="card pad0"><table><thead><tr><th>Category</th><th class="r">Budget / ${perFn?'fn':'mo'}</th><th class="r">${perFn?'Monthly':'Fortnightly'} eq</th><th class="r">Annual</th><th class="r">Actual (mo)</th><th style="width:26%">Progress</th></tr></thead><tbody>`;
  for(const [g,cats] of catGroups()){
    const rows=cats.map(c=>{
      const bv=budget[c.id]||0;const av=actuals[c.id]||0;
      return {c,bv,av};
    }).filter(r=>r.bv||r.av||billCats[r.c.id]);
    if(!rows.length)continue;
    const isInc=g==='Income';
    h+=`<tr><td colspan="6" style="background:#141414"><span class="sec-label">${esc(g)}</span></td></tr>`;
    for(const {c,bv,av} of rows){
      const actual=isInc?Math.max(0,av):Math.max(0,-av);
      const p=bv>0?actual/bv:0;
      const cls=isInc?(p>=1?'':'warn'):(p>1?'over':p>0.85?'warn':'');
      h+=`<tr>
        <td>${esc(c.name)} ${billCats[c.id]?`<span class="badge bl" title="Backed by bills register (${fmt(Math.round(billCats[c.id]))}/mo)">BILLS</span>`:''}${(n=>smooth&&n>1?` <span class="badge" title="Paid every ${n} months - each payment is spread across ${n} months so it compares to the monthly budget">/${n}MO</span>`:'')(Math.max(1,...state.bills.filter(b=>b.active!==false&&b.categoryId===c.id).map(ENGINE.billCycleMonths)))}</td>
        <td class="r"><input data-change="budget-set" data-cat="${c.id}" value="${bv?(conv(bv)/100).toFixed(2):''}" placeholder="0.00" style="width:100px;text-align:right;background:transparent;border-color:#242424"></td>
        <td class="r mut">${bv?fmt(perFn?bv:bv*12/26):''}</td>
        <td class="r mut">${bv?fmt0(bv*12):''}</td>
        <td class="r ${isInc?'pos':(p>1?'neg':'')}">${fmt(actual)}</td>
        <td><div class="pbar"><div class="${cls}" style="width:${clamp(p*100,0,100)}%"></div></div></td>
      </tr>`;
    }
  }
  h+='</tbody></table></div>';
  h+=`<p class="dim" style="font-size:12.5px;margin-top:10px;font-family:var(--mono)">Budgets are entered per ${perFn?'fortnight':'month'} and stored monthly. The BILLS badge marks categories fed by the bills register (quarterly/annual bills spread to a monthly true cost) so they aren't double-counted - use "Pre-fill from bills".</p>`;
  return h;
};

/* ---------------- DEBTS ---------------- */
VIEWS.debts=()=>{
  const list=activeDebts();
  const closedList=state.debts.filter(d=>d.closed);
  let h=`<div class="toolbar"><button class="btn primary" data-action="debt-add">+ Add Debt</button>
  <button class="btn" data-action="debt-import">Pull from liability accounts</button><span class="spacer"></span></div>`;
  if(!list.length)h+=emptyBox('\u25BC',closedList.length?'No open debts - everything is closed or paid off.':'No debts yet - add your first debt to unlock the Payoff Planner.','<button class="btn" data-action="debt-add">Add a debt</button>');
  if(list.length){
  const tot=sum(list.map(d=>d.balance));
  const wavg=tot>0?sum(list.map(d=>d.balance*(d.rate||0)))/tot:0;
  const minMo=sum(list.map(d=>ENGINE.minMonthly(d)));
  const bl=ENGINE.baseline();
  h+=`<div class="grid g4" style="margin-bottom:14px">
    ${statCard('Total Debt',fmt(tot),'neg','')}
    ${statCard('Weighted Avg Rate',wavg.toFixed(2)+'%','','balance-weighted')}
    ${statCard('Min Repayments',fmt(Math.round(minMo))+'/mo','','')}
    ${statCard('Debt-free at Minimums',fmtMY(bl.debtFreeDate),'',bl.totalMonths+' months &middot; '+fmt0(bl.totalInterest)+' interest')}
  </div>`;
  }
  for(const d of list){
    const open=ui.debtOpen[d.id];
    const off=ENGINE.offsetBal(d);
    h+=`<div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <div style="font-family:var(--head);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em">${esc(d.name)}</div>
          <div class="dim" style="font-size:12.5px;font-family:var(--mono)">${esc(d.type||'')} &middot; ${d.rate||0}% ${d.fixed?'fixed':'variable'}${d.fees?` &middot; ${fmt(d.fees)}/mo fees`:''}${d.interestFreeUntil?` &middot; interest-free until ${fmtD(d.interestFreeUntil)}`:''}${off?` &middot; offset ${fmt0(off)}`:''}</div>
        </div>
        <div style="text-align:right"><div class="sec-label">Balance</div><div class="num" style="font-size:20px;font-weight:700;color:var(--rd)">${fmt(d.balance)}</div></div>
        <div style="text-align:right"><div class="sec-label">Minimum</div><div class="num" style="font-size:14px">${fmt(d.minAmount)}/${{weekly:'wk',fortnightly:'fn',monthly:'mo'}[d.minFreq||'monthly']}</div></div>
        ${d.viaBills?`<div style="text-align:right"><div class="sec-label">Funded by</div><div class="num" style="font-size:12px;color:var(--bl)">weekly bills transfer</div></div>`:''}
        ${(ps=>ps.count?`<div style="text-align:right"><div class="sec-label">Actual (3mo avg)</div><div class="num" style="font-size:14px;color:${ps.avgMo>=ps.minMo?'var(--gn)':'var(--am)'}">${fmt(ps.avgMo)}/mo</div></div>`:(d.matchKeyword?`<div style="text-align:right"><div class="sec-label">Keyword</div><div class="num" style="font-size:12px;color:var(--am)">"${esc(d.matchKeyword)}" - 0 matches</div></div>`:''))(ENGINE.debtPayStats(d))}
        <button class="btn sm" data-action="debt-detail" data-id="${d.id}">${open?'Hide':'Detail'}</button>
        <button class="iconbtn" data-action="debt-edit" data-id="${d.id}">&#9998;</button>
        <button class="iconbtn" data-action="debt-close" data-id="${d.id}" title="Paid off / closed - move to the archive">&#10004;</button>
        <button class="iconbtn del" data-action="debt-del" data-id="${d.id}">&#10005;</button>
      </div>`;
    if(open){
      const ps=ENGINE.debtPayStats(d);
      if(ps.count){
        h+=`<div style="margin-top:12px"><span class="sec-label">Repayment history (${ps.count} linked - ${fmt0(ps.total)} total${ps.avgMo<ps.minMo?' - averaging under minimum, check missed payments or the match keyword':''})</span>
        <table class="fit" style="margin-top:6px"><tbody>${ps.pays.slice(0,8).map(p=>`<tr><td class="mut num">${fmtD(p.date)}</td><td>${esc(p.payee)}</td><td class="mut" style="font-size:11px">${p.debtId?'linked':'keyword'}</td><td class="r pos">${fmt(Math.abs(p.amount))}</td></tr>`).join('')}</tbody></table>
        ${ps.count>8?`<span class="dim" style="font-size:11.5px">+ ${ps.count-8} earlier</span>`:''}</div>`;
      }else if(d.matchKeyword){
        h+=`<p class="dim" style="font-size:12px;margin-top:10px">No transactions match "${esc(d.matchKeyword)}" yet.</p>`;
      }
      // negative amortisation guard: if the minimum can't cover interest + fees,
      // a 100-year runaway chart is noise - say it plainly instead
      const minMo=Math.round(ENGINE.minMonthly(d));
      const int0=Math.round(Math.max(0,d.balance-off)*(d.rate||0)/100/12)+(d.fees||0);
      if(minMo<=int0&&!d.interestFreeUntil){
        const gap=int0-minMo;
        h+=`<div style="margin-top:14px;border-top:1px solid var(--bd);padding-top:14px">
          <div class="card" style="border-color:var(--rd);background:#1a1212">
            <h3 style="color:var(--rd)">&#9888; Minimum Does Not Cover Interest</h3>
            <p style="font-size:13px;line-height:1.7;color:var(--tx2)">
              This loan accrues <b class="num">${fmt(int0)}/mo</b> in interest${d.fees?' + fees':''}, but the minimum entered is
              <b class="num">${fmt(minMo)}/mo</b> - the balance would grow <b class="num" style="color:var(--rd)">${fmt(gap)}/mo</b> forever and never be repaid.</p>
            <p style="font-size:12.5px;line-height:1.7;color:var(--tx2);margin-top:8px">
              Most likely the repayment frequency is wrong - <b>${fmt(d.minAmount)} per week</b> is ${fmt(Math.round(d.minAmount*52/12))}/mo, which ${Math.round(d.minAmount*52/12)>int0?'would amortise normally':'still would not cover interest'}.
              Edit the debt and check the minimum amount and frequency against your loan contract.</p>
            <div style="margin-top:10px"><button class="btn sm" data-action="debt-edit" data-id="${d.id}">Edit debt</button></div>
          </div></div></div>`;
        continue;
      }
      const sim=ENGINE.simulate([{id:d.id,name:d.name,balance:d.balance,rate:d.rate||0,minMonthly:ENGINE.minMonthly(d),fees:d.fees||0,interestFreeUntil:d.interestFreeUntil||'',offset:off}],{order:[d.id],extraMonthly:0,startDate:todayISO().slice(0,7)+'-01'});
      h+=`<div style="margin-top:14px;border-top:1px solid var(--bd);padding-top:14px">
        <div class="grid g2">
        <div>${chart('debt-decay-'+d.id,el=>CH.line(el,{labels:sim.months.map(m=>fmtMY(m.date)),series:[{name:'Balance',color:CONFIG.colors.rd,data:sim.months.map(m=>m.perDebt[0].balance)}],fillFirst:true,height:180}))}
        <div class="dim" style="font-family:var(--mono);font-size:12px;margin-top:6px">At minimums: paid off ${fmtMY(sim.debtFreeDate)} (${sim.totalMonths} mo) &middot; total interest ${fmt(sim.totalInterest)}${sim.capped?' &middot; &#9888; minimum never clears this debt (capped at 100y)':''}</div></div>
        <div style="max-height:280px;overflow:auto" class="csv-prev"><table><thead><tr><th>Month</th><th class="r">Payment</th><th class="r">Interest</th><th class="r">Principal</th><th class="r">Closing</th></tr></thead><tbody>`+
        sim.months.slice(0,360).map(m=>{const p=m.perDebt[0];return`<tr><td class="mut">${fmtMY(m.date)}</td><td class="r">${fmt(p.payment)}</td><td class="r" style="color:var(--am)">${fmt(p.interest)}</td><td class="r pos">${fmt(Math.max(0,p.payment-p.interest))}</td><td class="r">${fmt(p.balance)}</td></tr>`}).join('')+
        `</tbody></table></div></div></div>`;
    }
    h+='</div>';
  }
  h+=closedDebtsCard(closedList);
  return h;
};
function closedDebtsCard(list){
  if(!list.length)return '';
  const open=ui.showClosedDebts;
  let h=`<div class="card" style="margin-top:6px"><h3 style="cursor:pointer" data-action="toggle-closed-debts">Closed &amp; Paid Off <span class="badge">${list.length}</span><span class="r dim" style="font-family:var(--mono);font-size:11px">${open?'HIDE':'SHOW'}</span></h3>`;
  if(open){
    h+=`<p class="dim" style="font-size:12px;line-height:1.6;margin-bottom:8px">Kept for history - repayment records, linked transactions and the loan account's balance history all stay. Nothing here feeds Pay Split, the Payoff Planner or Net Worth. Reopen puts a debt straight back.</p>`;
    h+='<table><thead><tr><th>Debt</th><th>Closed</th><th class="r">Balance at close</th><th class="r">Total repaid</th><th></th></tr></thead><tbody>';
    for(const d of list.slice().sort((a,b)=>(b.closedDate||'')<(a.closedDate||'')?-1:1)){

    h+='</tbody></table>';

  return h+'</div>';
}

VIEWS.paysplit=()=>{
  const cyc=state.settings.payCycle||'fortnightly';
  const per={weekly:[52,'week'],fortnightly:[26,'fortnight'],monthly:[12,'month']}[cyc]||[26,'fortnight'];
  const cv=m=>Math.round(m*12/per[0]); // monthly -> per cycle
  let h=`<div class="toolbar"><button class="btn primary" data-action="income-add">+ Add Income</button><span class="spacer"></span><span class="dim" style="font-size:12px;font-family:var(--mono)">shown per ${per[1]} (pay cycle setting)</span></div>`;
  if(!state.incomes.length)return h+emptyBox('\u2696','Add your wage and any other income (business drawings, rent, side income). The app then shows where every pay goes and how much surplus is genuinely uncommitted.','<button class="btn" data-action="income-add">Add your wage</button>');
  // incomes table
  h+=`<div class="card" style="margin-bottom:14px"><h3>Income Sources</h3><table class="fit"><thead><tr><th>Source</th><th>Frequency</th><th class="r">Amount</th><th class="r">Monthly</th><th class="r">Per ${per[1]}</th><th></th></tr></thead><tbody>`;
  for(const inc of state.incomes){
    const mo=ENGINE.freqMonthly(inc.amount,inc.freq);
    h+=`<tr><td>${esc(inc.name)}</td><td class="mut">${esc(inc.freq)}</td><td class="r">${fmt(inc.amount)}</td><td class="r">${fmt(mo)}</td><td class="r">${fmt(cv(mo))}</td>
      <td class="r"><span class="row-act"><button class="iconbtn" data-action="income-edit" data-id="${inc.id}">&#9998;</button><button class="iconbtn del" data-action="income-del" data-id="${inc.id}">&#10005;</button></span></td></tr>`;
  }
  const ps=ENGINE.paySplit();
  h+=`<tr style="border-top:2px solid var(--bd)"><td colspan="2"><b>Total income</b></td><td></td><td class="r"><b>${fmt(ps.income)}</b></td><td class="r"><b>${fmt(cv(ps.income))}</b></td><td></td></tr></tbody></table></div>`;
  // waterfall
  const segs=[
    {n:'Bills transfer',v:ps.bills,c:CONFIG.colors.bl,note:'true weekly cost of every bill incl. buffer/rounding'},
    {n:'Debt minimums',v:ps.mins,c:CONFIG.colors.rd,note:'contractual minimums'+(ps.minsCovered?` (${fmt0(ps.minsCovered)}/mo more is routed inside the bills transfer)`:'')},
    {n:'Living spend',v:ps.spend,c:CONFIG.colors.am,note:'set below'},
    {n:'Surplus',v:Math.max(0,ps.surplus),c:CONFIG.colors.gn,note:'uncommitted - yours to allocate'}
  ];
  const tot=Math.max(1,ps.income);
  h+=`<div class="card hero" style="margin-bottom:14px"><h3>Where Each ${per[1][0].toUpperCase()+per[1].slice(1)} Goes</h3>
    <div class="main-fig"><span class="l">SURPLUS PER ${per[1].toUpperCase()}</span><span class="v" style="color:${ps.surplus<0?'var(--rd)':'var(--gn)'}">${fmtS(cv(ps.surplus))}</span></div>
    <div style="display:flex;height:34px;border-radius:4px;overflow:hidden;margin:14px 0 10px;border:1px solid var(--bd)">
      ${segs.map(s=>`<div data-tip="${esc(s.n)}: ${fmt0(cv(s.v))}/${per[1]}" style="width:${Math.max(0,s.v/tot*100)}%;background:${s.c};opacity:.85"></div>`).join('')}
    </div>
    <table class="fit"><tbody>
      <tr><td><b>Income</b></td><td class="r num"><b>${fmt(cv(ps.income))}</b></td><td class="mut"></td></tr>
      ${segs.map(s=>{
        if(s.n!=='Living spend')return`<tr><td><span style="display:inline-block;width:9px;height:9px;background:${s.c};margin-right:8px;border-radius:2px"></span>${s.n}</td><td class="r num" style="color:${s.c}">${s.n==='Surplus'?'':'- '}${fmt(cv(s.v))}</td><td class="mut" style="font-size:11.5px">${s.note}</td></tr>`;
        const md=state.settings.spendMode||'auto';
        const auto=ENGINE.budgetSpendAuto();
        return`<tr><td><span style="display:inline-block;width:9px;height:9px;background:${s.c};margin-right:8px;border-radius:2px"></span>Living spend</td>
          <td class="r num" style="color:${s.c}">- ${fmt(cv(s.v))}</td>
          <td>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <select data-change="spend-mode" style="width:165px">
                <option value="auto" ${md==='auto'?'selected':''}>Auto (budget, else actuals)</option>
                <option value="budget" ${md==='budget'?'selected':''}>This month's budget</option>
                <option value="actuals" ${md==='actuals'?'selected':''}>Recent actuals average</option>
                <option value="manual" ${md==='manual'?'selected':''}>Manual amount</option>
              </select>
              ${md==='manual'
                ?`<input value="${state.settings.spendManual?(state.settings.spendManual/100).toFixed(2):''}" data-change="spend-manual" placeholder="per month $" style="width:120px" inputmode="decimal"> <span class="dim" style="font-size:11.5px">/month</span>`
                :''}
              ${(md==='actuals'||(md==='auto'&&ps.spendSrc==='actuals'))
                ?`<span class="dim" style="font-size:11.5px">over</span><select data-change="spend-months" style="width:95px">${[1,2,3,6,12].map(n=>`<option value="${n}" ${(state.settings.spendMonths||3)===n?'selected':''}>${n} month${n>1?'s':''}</option>`).join('')}</select>`
                :''}
            </div>
            <div class="dim" style="font-size:11px;margin-top:3px">${
              md==='manual'?`your figure - auto would suggest ${fmt(auto.amount)}/mo (${auto.src==='budget'?'budget':'actuals'})`
              :md==='budget'?`from this month's budget, non-bill categories${ENGINE.budgetSpendFromBudget()?'':' - no budget set for this month'}`
              :`average of the last ${clamp(state.settings.spendMonths||3,1,12)} month(s) actual spend, excluding bills and transfers`}</div>
          </td></tr>`;
      }).join('')}
    </tbody></table>
    ${ps.minsWarns&&ps.minsWarns.length?ps.minsWarns.map(w2=>`<p style="color:var(--am);font-size:12px;margin-top:8px;font-family:var(--mono)">&#9888; The bill funding "${esc(w2.name)}" transfers ${fmt0(w2.billM)}/mo but the debt minimum is ${fmt0(w2.minM)}/mo - the bills account will run short. Fix the bill's amount or frequency.</p>`).join(''):''}
    ${ps.surplus<0?`<p style="color:var(--rd);font-size:12.5px;margin-top:10px;font-family:var(--mono)">Deficit: committed costs exceed income by ${fmt0(cv(-ps.surplus))}/${per[1]}. Bills + minimums + living spend need trimming, or income is missing here.</p>`:''}
  </div>`;
  // allocation
  const a=state.settings.alloc||{debt:70,goals:20,keep:10};
  const amts=ENGINE.allocAmounts();
  const allocRow=(k,label,color,desc)=>`<tr><td style="width:190px">${label}</td>
    <td style="width:140px"><input type="number" min="0" max="100" step="5" value="${a[k]}" data-change="alloc-set" data-k="${k}" style="width:80px"> %</td>
    <td class="r num" style="color:${color};width:130px">${fmt(cv(amts[k]))}/${per[1]}</td><td class="mut" style="font-size:11.5px">${desc}</td></tr>`;
  const asum=(a.debt||0)+(a.goals||0)+(a.keep||0);
  h+=`<div class="card"><h3>Surplus Allocation</h3>
    <p class="dim" style="font-size:12.5px;margin-bottom:10px;line-height:1.6">Split the surplus. The debt share feeds any Payoff scenario set to "My surplus" - change it here and the debt-free date recalculates automatically.</p>
    <table class="fit"><tbody>
    ${allocRow('debt','Extra debt repayments','var(--rd)','goes to Payoff scenarios using surplus mode')}
    ${allocRow('goals','Savings goals','var(--gn)',state.goals.length?`split across ${state.goals.length} goal${state.goals.length>1?'s':''} below`:'no goals yet - add some in Savings Goals')}
    ${allocRow('keep','Keep / buffer','var(--bl)','stays in your accounts')}
    </tbody></table>
    ${asum!==100?`<p style="color:var(--am);font-size:12px;margin-top:8px;font-family:var(--mono)">Allocation totals ${asum}% - adjust to 100%</p>`:''}
    ${state.goals.length&&amts.goals>0?`<table class="fit" style="margin-top:12px"><thead><tr><th>Goal</th><th class="r">Remaining</th><th class="r">Gets /${per[1]}</th><th class="r">Done in</th></tr></thead><tbody>${state.goals.map(g=>{const gs=ENGINE.goalStats(g);const share=Math.round(amts.goals/state.goals.length);const months=share>0?Math.ceil(Math.max(0,gs.remaining)/share):null;return`<tr><td>${esc(g.name)}</td><td class="r">${fmt(Math.max(0,gs.remaining))}</td><td class="r pos">${fmt(cv(share))}</td><td class="r">${months!=null?(months<1?'done':months+' mo ('+fmtMY(addMonths(todayISO(),months))+')'):'-'}</td></tr>`}).join('')}</tbody></table>`:''}
  </div>`;
  return h;
};

function consolCard(){
  let h='';
    const cfg=state.consol;
    const eligible=activeDebts().filter(d=>d.balance>0);
    h+=`<div class="card" style="margin-bottom:14px"><h3>Debt Consolidation Simulator</h3>
      <p class="dim" style="font-size:12.5px;line-height:1.6;margin-bottom:10px">Roll selected debts into one new loan and compare against staying the course. Watch the term-reset trap: a lower rate over a longer term often costs MORE total interest.</p>
      <div class="frow" style="grid-template-columns:1.2fr 1fr">
        <div><span class="sec-label">Debts to consolidate</span>
        ${eligible.map(d=>`<label class="chk" style="display:block;margin-top:6px"><input type="checkbox" data-change="consol-debt" data-id="${d.id}" ${cfg.debtIds.includes(d.id)?'checked':''}> ${esc(d.name)} <span class="dim num" style="font-size:11.5px">${fmt(d.balance)} @ ${d.rate}%</span></label>`).join('')}</div>
        <div>
          <label class="f" style="margin-bottom:8px"><span class="fl">New loan rate % p.a.</span><input type="number" step="0.05" min="0" value="${cfg.rate}" data-change="consol-set" data-k="rate" style="max-width:120px"></label>
          <label class="f" style="margin-bottom:8px"><span class="fl">Term (years)</span><input type="number" step="0.5" min="0.5" value="${cfg.years}" data-change="consol-set" data-k="years" style="max-width:120px"></label>
          <label class="f"><span class="fl">Establishment / exit fees $ (added to loan)</span><input value="${cfg.fees?(cfg.fees/100).toFixed(2):''}" data-change="consol-set" data-k="fees" style="max-width:140px" placeholder="0.00"></label>
        </div>
      </div>`;
    const res=ENGINE.consolidate(cfg);
    if(!res)h+=`<p class="dim" style="font-size:12.5px;margin-top:8px">Tick at least two debts to compare.</p>`;
    else{
      const row=(name,sim,mins,note)=>`<tr><td>${name}${note?`<div class="dim" style="font-size:11px">${note}</div>`:''}</td><td class="r num">${fmt(mins)}/mo</td><td class="r num">${fmtMY(sim.debtFreeDate)}</td><td class="r num">${sim.totalMonths} mo</td><td class="r num">${fmt(sim.totalInterest)}</td></tr>`;
      const dB=res.B.totalInterest-res.A.totalInterest,dC=res.C.totalInterest-res.A.totalInterest;
      h+=`<table class="fit" style="margin-top:12px"><thead><tr><th>Path</th><th class="r">Repayments</th><th class="r">Debt-free</th><th class="r">Duration</th><th class="r">Total interest</th></tr></thead><tbody>
        ${row('Stay the course',res.A,res.curMins,'current debts at minimums')}
        ${row('Consolidate, pay new minimum',res.B,res.newMins,`${res.sel.length} debts &rarr; ${fmt(res.P)} @ ${cfg.rate}% over ${cfg.years}y`)}
        ${res.extraC>0?row('Consolidate, keep paying what you pay now',res.C,res.curMins,`new minimum + ${fmt(res.extraC)}/mo extra to highest rate`):''}
      </tbody></table>
      <p style="font-size:12.5px;margin-top:10px;font-family:var(--mono);color:${dB>0?'var(--am)':'var(--gn)'}">
        ${dB>0?`&#9888; Consolidating at the new minimum costs ${fmt0(dB)} MORE interest than staying the course - the term reset outweighs the rate.`:`Consolidating at the new minimum saves ${fmt0(-dB)} interest vs staying the course.`}
        ${res.extraC>0?`<br>${dC<0?`Keeping repayments unchanged saves ${fmt0(-dC)} and lands ${res.A.totalMonths-res.C.totalMonths} months earlier.`:''}`:''}
      </p>`;
    }
    h+=`</div>`;
    return h;
}
VIEWS.payoff=()=>{
  if(!activeDebts().length)return emptyBox('\u2197','No debts yet - add your first debt to unlock the Payoff Planner.','<button class="btn" data-action="nav" data-view="debts">Open Debts</button>');
  const simDebts=ENGINE.buildSimDebts();
  const baseline=ENGINE.baseline();
  if(!ui.payoffSel.length&&state.scenarios.length)ui.payoffSel=[state.scenarios[0].id];
  ui.payoffSel=ui.payoffSel.filter(id=>byId(state.scenarios,id)).slice(0,3);
  const sims=ui.payoffSel.map(id=>{
    const sc=byId(state.scenarios,id);
    return {sc,sim:ENGINE.simulate(simDebts,ENGINE.scenarioOpts(sc))};
  });
  let h=`<div class="toolbar">
    <button class="btn primary" data-action="scenario-add">+ New Scenario</button>
    <span class="spacer"></span>
    <span class="sec-label">Compare (up to 3):</span>
    ${state.scenarios.map(sc=>`<label class="chk" style="font-family:var(--mono);font-size:12px"><input type="checkbox" data-change="scenario-sel" data-id="${sc.id}" ${ui.payoffSel.includes(sc.id)?'checked':''}>${esc(sc.name)}</label>`).join('')||'<span class="dim" style="font-size:12px">no scenarios yet</span>'}
  </div>`;
  // baseline card + comparison
  h+=`<div class="grid ${sims.length>=2?'g'+Math.min(4,sims.length+1):'g2'}" style="margin-bottom:14px">`;
  h+=`<div class="card"><h3>Baseline &middot; Minimums Only</h3>
    <div class="num big">${fmtMY(baseline.debtFreeDate)}</div>
    <div class="dim num" style="font-size:12px;margin-top:4px">${baseline.totalMonths} months${baseline.capped?' (capped - never clears!)':''}</div>
    <div style="margin-top:10px"><span class="sec-label">Total interest</span><div class="num" style="font-size:17px;color:var(--am)">${fmt(baseline.totalInterest)}</div></div></div>`;
  for(const {sc,sim} of sims){
    const mSaved=baseline.totalMonths-sim.totalMonths,iSaved=baseline.totalInterest-sim.totalInterest;
    h+=`<div class="card" style="border-color:var(--or)">
      <h3 style="color:var(--or)">${esc(sc.name)} <span class="r"><button class="iconbtn" data-action="scenario-edit" data-id="${sc.id}">&#9998;</button><button class="iconbtn del" data-action="scenario-del" data-id="${sc.id}">&#10005;</button></span></h3>
      <div class="num big acc">${fmtMY(sim.debtFreeDate)}</div>
      <div class="dim num" style="font-size:12px;margin-top:4px">${sim.totalMonths} months &middot; ${esc(sc.strategy)} &middot; ${sc.extraMode==='surplus'?`surplus-driven (+${fmt0(ENGINE.allocAmounts().debt)}/mo)`:`+${fmt0(sc.extra||0)}/${{weekly:'wk',fortnightly:'fn',monthly:'mo'}[sc.extraFreq||'monthly']}`}</div>
      <div style="margin-top:10px;display:flex;gap:18px;flex-wrap:wrap">
        <div><span class="sec-label">Interest</span><div class="num" style="font-size:15px;color:var(--am)">${fmt0(sim.totalInterest)}</div></div>
        <div><span class="sec-label">Saved vs min</span><div class="num pos" style="font-size:15px">${fmt0(Math.max(0,iSaved))}</div></div>
        <div><span class="sec-label">Time saved</span><div class="num pos" style="font-size:15px">${Math.max(0,mSaved)} mo</div></div>
      </div></div>`;
  }
  h+='</div>';
  if(!sims.length)return h+emptyBox('\u2197','Create a scenario to simulate extra repayments, lump sums, and avalanche vs snowball ordering against the minimums-only baseline.','<button class="btn" data-action="scenario-add">Create first scenario</button>')+consolCard();
  const primary=sims[0];
  // sensitivity quick buttons
  h+=`<div class="toolbar"><span class="sec-label">Sensitivity on "${esc(primary.sc.name)}":</span>
    ${[10000,25000,50000].map(c=>`<button class="btn sm" data-action="sensitivity" data-c="${c}">+${fmt0(c)}/mo</button>`).join('')}
    ${ui.sensitivity?`<span class="badge or flash" style="font-size:12px;padding:5px 10px">${ui.sensitivity}</span><button class="btn sm ghost" data-action="sensitivity-clear">&times;</button>`:''}
  </div>`;
  // stacked area chart of primary scenario, overlay total lines of others + baseline
  const maxLen=Math.max(baseline.totalMonths,...sims.map(s=>s.sim.totalMonths));
  const labels=[];for(let i=0;i<maxLen;i++)labels.push(fmtMY(addMonths(todayISO().slice(0,7)+'-01',i)));
  const bands=simDebts.map((d,i)=>({name:d.name,color:CONFIG.series[i%CONFIG.series.length],data:primary.sim.months.map(m=>m.perDebt[i].balance)}));
  const overlays=[{name:'Baseline total',color:'#777',dash:true,data:baseline.months.map(m=>m.total)}];
  sims.slice(1).forEach((s,i)=>overlays.push({name:s.sc.name+' total',color:i?'#a855f7':CONFIG.colors.bl,dash:true,data:s.sim.months.map(m=>m.total)}));
  h+=`<div class="card" style="margin-bottom:14px"><h3>Remaining Balance Over Time <span class="r dim" style="font-family:var(--mono);font-size:11px">BANDS: ${esc(primary.sc.name).toUpperCase()} &middot; DASHED: COMPARISONS</span></h3>
    ${chart('payoff-stack',el=>CH.stackedArea(el,{labels,series:bands,overlays,height:280,legendId:'payoff-stack'}))}</div>`;
  // gantt payoff timeline
  h+=`<div class="grid g2" style="margin-bottom:14px"><div class="card"><h3>Payoff Timeline</h3>`;
  const span=Math.max(1,maxLen);
  for(const {sc,sim} of sims){
    h+=`<div class="sec-label" style="margin:8px 0 6px;color:var(--or)">${esc(sc.name)}</div>`;
    simDebts.forEach((d,i)=>{
      const pm=sim.payoffMonth[d.id];
      h+=`<div class="gantt-row"><div class="gl">${esc(d.name)}</div><div class="gantt-track"><div class="gantt-bar" style="left:0;width:${clamp(pm/span*100,1,100)}%;background:${CONFIG.series[i%CONFIG.series.length]}" data-tip="${esc(d.name+'\npaid off '+fmtMY(addMonths(todayISO().slice(0,7)+'-01',Math.max(0,pm-0)))+' ('+pm+' mo)')}"></div></div><div class="num dim" style="font-size:10.5px;min-width:66px;text-align:right">${fmtMY(addMonths(todayISO().slice(0,7)+'-01',Math.max(0,pm)))}</div></div>`;
    });
  }
  h+=`<div class="dim num" style="font-size:11px;margin-top:6px;display:flex;justify-content:space-between"><span>${fmtMY(todayISO().slice(0,7)+'-01')}</span><span>${fmtMY(addMonths(todayISO().slice(0,7)+'-01',span))}</span></div></div>`;
  // cumulative interest
  const cum=arr=>{let c=0;return arr.map(m=>{c+=m.interest;return c})};
  h+=`<div class="card"><h3>Cumulative Interest</h3>${chart('payoff-cum',el=>CH.line(el,{labels,series:[{name:'Baseline',color:'#777',dash:true,data:cum(baseline.months)},...sims.map((s,i)=>({name:s.sc.name,color:[CONFIG.colors.or,CONFIG.colors.bl,'#a855f7'][i],data:cum(s.sim.months)}))],height:230,legendId:'payoff-cum'}))}</div></div>`;
  // milestones
  h+=consolCard();
  h+=`<div class="grid g2"><div class="card"><h3>Milestones &middot; ${esc(primary.sc.name)}</h3>`;
  if(!primary.sim.milestones.length)h+='<p class="dim">No milestones - check the scenario settings.</p>';
  else h+=primary.sim.milestones.map(m=>`<div class="milestone"><span class="d">${fmtMY(m.date)}</span><span>${esc(m.text)}</span></div>`).join('');
  h+='</div>';
  // month-by-month table
  h+=`<div class="card"><h3>Schedule &middot; ${esc(primary.sc.name)} <span class="r"><button class="btn sm" data-action="schedule-csv">Export CSV</button></span></h3>
  <div style="max-height:380px;overflow:auto" class="csv-prev"><table><thead><tr><th></th><th>Month</th><th class="r">Payment</th><th class="r">Interest</th><th class="r">Remaining</th></tr></thead><tbody>`;
  primary.sim.months.forEach((m,i)=>{
    const open=ui.payoffOpen[i];
    h+=`<tr data-action="sched-toggle" data-i="${i}" style="cursor:pointer"><td class="dim">${open?'\u25BE':'\u25B8'}</td><td class="mut">${fmtMY(m.date)}</td><td class="r">${fmt(m.payment)}</td><td class="r" style="color:var(--am)">${fmt(m.interest)}</td><td class="r">${fmt(m.total)}</td></tr>`;
    if(open)simDebts.forEach((d,di)=>{
      const p=m.perDebt[di];if(!p.payment&&!p.balance&&!p.interest)return;
      h+=`<tr style="background:#141414"><td></td><td class="dim" style="padding-left:22px">${esc(d.name)}</td><td class="r dim">${fmt(p.payment)}</td><td class="r dim">${fmt(p.interest)}</td><td class="r dim">${fmt(p.balance)}</td></tr>`;
    });
  });
  h+='</tbody></table></div></div></div>';
  return h;
};

/* ---------------- NET WORTH ---------------- */
function assetPerformanceCard(){
  const list=state.accounts.filter(a=>!a.archived&&a.purchasePrice>0);
  if(!list.length)return '';
  let rows='';
  for(const a of list){
    const ch=a.balance-a.purchasePrice;
    const pc=ch/a.purchasePrice*100;
    let annual='';
    if(a.purchaseDate){
      const days=Math.max(1,daysBetween(a.purchaseDate,todayISO()));
      if(days>=90&&a.balance>0){const r=(Math.pow(a.balance/a.purchasePrice,365/days)-1)*100;annual=`${r>=0?'+':''}${r.toFixed(1)}%/yr`}
    }
    rows+=`<tr><td>${esc(a.name)}<span class="dim" style="font-size:11px;margin-left:6px">${acctType(a).n}</span></td>
      <td class="mut num">${a.purchaseDate?fmtD(a.purchaseDate):'-'}</td>
      <td class="r num">${fmt(a.purchasePrice)}</td>
      <td class="r num">${fmt(a.balance)}</td>
      <td class="r num" style="color:${ch>=0?'var(--gn)':'var(--rd)'}">${ch>=0?'+':''}${fmt(ch)}</td>
      <td class="r num" style="color:${ch>=0?'var(--gn)':'var(--rd)'}">${pc>=0?'+':''}${pc.toFixed(1)}%</td>
      <td class="r num mut">${annual||'-'}</td></tr>`;
  }
  const totP=sum(list.map(a=>a.purchasePrice)),totN=sum(list.map(a=>a.balance)),totC=totN-totP;
  return`<div class="card" style="margin-bottom:14px"><h3>Asset Performance <span class="r dim" style="font-family:var(--mono);font-size:10px">CURRENT VALUE VS PURCHASE PRICE</span></h3>
    <table class="fit"><thead><tr><th>Asset</th><th>Purchased</th><th class="r">Paid</th><th class="r">Now</th><th class="r">Change</th><th class="r">%</th><th class="r">Annualised</th></tr></thead><tbody>${rows}
    <tr style="border-top:2px solid var(--bd)"><td><b>Total</b></td><td></td><td class="r num"><b>${fmt(totP)}</b></td><td class="r num"><b>${fmt(totN)}</b></td><td class="r num" style="color:${totC>=0?'var(--gn)':'var(--rd)'}"><b>${totC>=0?'+':''}${fmt(totC)}</b></td><td></td><td></td></tr></tbody></table>
    <p class="dim" style="font-size:11.5px;margin-top:8px">Depreciating assets (vehicles, equipment) showing red is normal - the useful read is whether the value is still above the matching loan balance. Appreciation here is unrealised until sold.</p>
  </div>`;
}
VIEWS.networth=()=>{
  const series=ENGINE.netWorthSeries();
  const now=ENGINE.netWorthNow();
  let h=`<div class="toolbar">
    <button class="btn primary" data-action="snapshot-now">Snapshot now</button>
    <span class="dim" style="font-family:var(--mono);font-size:12px">Automatic snapshot on the 1st of each month when the app is opened.</span><span class="spacer"></span></div>`;
  h+=assetPerformanceCard();
  h+=`<div class="grid g3" style="margin-bottom:14px">
    ${statCard('Assets',fmt(now.assets),'pos','')}
    ${statCard('Liabilities',fmt(now.liab),'neg','')}
    ${statCard('Net Worth',fmtS(now.net),now.net>=0?'acc':'neg','')}
  </div>`;
  if(series.length<2)h+=`<div class="card" style="margin-bottom:14px">${emptyBox('\u03A3','Only one data point so far. Snapshots build the trend - update balances and snapshot monthly.')}</div>`;
  else{
    h+=`<div class="card" style="margin-bottom:14px"><h3>Assets vs Liabilities</h3>${chart('nw-bars',el=>CH.bars(el,{groups:series.map(s=>({label:fmtMY(s.mk+'-01'),values:[s.assets,-s.liab]})),series:[{name:'Assets',color:CONFIG.colors.gn},{name:'Liabilities',color:CONFIG.colors.rd}],stacked:true,height:250,legendId:'nw-bars'}))}
    ${chart('nw-line',el=>CH.line(el,{labels:series.map(s=>fmtMY(s.mk+'-01')),series:[{name:'Net worth',color:CONFIG.colors.or,data:series.map(s=>s.net)}],height:170,fillFirst:true}))}</div>`;
  }
  h+=`<div class="card pad0"><table><thead><tr><th>Month</th><th class="r">Assets</th><th class="r">Liabilities</th><th class="r">Net Worth</th><th class="r">MoM</th><th class="r">12-month</th></tr></thead><tbody>`;
  series.slice().reverse().forEach((s,i,arr)=>{
    const prev=arr[i+1];
    const yearAgo=series.find(x=>x.mk===((+s.mk.slice(0,4)-1)+s.mk.slice(4)));
    const mom=prev?s.net-prev.net:null,yoy=yearAgo?s.net-yearAgo.net:null;
    h+=`<tr><td class="mut">${fmtMY(s.mk+'-01')}</td><td class="r pos">${fmt(s.assets)}</td><td class="r neg">${fmt(s.liab)}</td><td class="r" style="font-weight:700">${fmtS(s.net)}</td>
      <td class="r ${mom==null?'dim':mom>=0?'pos':'neg'}">${mom==null?'\u2014':fmtS(mom)}</td>
      <td class="r ${yoy==null?'dim':yoy>=0?'pos':'neg'}">${yoy==null?'\u2014':fmtS(yoy)}</td></tr>`;
  });
  h+='</tbody></table></div>';
  return h;
};

/* ---------------- REPORTS ---------------- */
VIEWS.reports=()=>{
  const r=ui.reportRange;
  const inRange=t=>t.date>=r.from&&t.date<=r.to;
  const ptx=personalTx();
  const txs=ptx.filter(inRange);
  let h=`<div class="toolbar"><span class="sec-label">Date range:</span>
    <input type="date" data-change="report-range" data-k="from" value="${r.from}" style="width:140px">
    <input type="date" data-change="report-range" data-k="to" value="${r.to}" style="width:140px">
    ${[['3m',-3],['6m',-6],['12m',-12]].map(([n,m])=>`<button class="btn sm" data-action="report-preset" data-m="${m}">${n}</button>`).join('')}
    <span class="spacer"></span><span class="dim num" style="font-size:12px">${txs.length} transactions in range</span></div>`;
  if(!state.transactions.length)return h+emptyBox('\u2237','No transactions to report on yet. Import a bank CSV or load the sample data in Settings to see the reports in action.');
  // spending by category
  const byCat={},byCatPrev={};
  const spanDays=Math.max(1,daysBetween(r.from,r.to));
  const prevFrom=addDays(r.from,-spanDays-1),prevTo=addDays(r.from,-1);
  for(const t of ptx){
    if(t.amount>=0)continue;
    const c=byId(state.categories,t.categoryId);
    if(c&&(c.group==='Transfers'))continue;
    const key=c?c.group:'Uncategorised';
    if(inRange(t))byCat[key]=(byCat[key]||0)+(-t.amount);
    else if(t.date>=prevFrom&&t.date<=prevTo)byCatPrev[key]=(byCatPrev[key]||0)+(-t.amount);
  }
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const donutItems=catRows.map(([n,v],i)=>({name:n,value:v,color:CONFIG.series[i%CONFIG.series.length]}));
  h+=`<div class="grid g2" style="margin-bottom:14px">
    <div class="card"><h3>Spending by Category <span class="r"><button class="btn sm" data-action="report-cat-csv">CSV</button></span></h3>
    ${chart('rep-donut',el=>CH.donut(el,{items:donutItems,centerLabel:'TOTAL SPEND',centerValue:fmt0(sum(catRows.map(x=>x[1])))}))}
    <table style="margin-top:12px"><thead><tr><th>Group</th><th class="r">This period</th><th class="r">Prev period</th><th class="r">Change</th></tr></thead><tbody>
    ${catRows.map(([n,v])=>{const p=byCatPrev[n]||0,d=v-p;return`<tr><td>${esc(n)}</td><td class="r">${fmt(v)}</td><td class="r mut">${fmt(p)}</td><td class="r ${d>0?'neg':'pos'}">${d>0?'+':''}${fmt0(d)}</td></tr>`}).join('')}
    </tbody></table></div>`;
  // income vs expenses trailing 12 months
  const months=[];for(let i=11;i>=0;i--)months.push(monthKey(addMonths(todayISO(),-i)));
  // income vs expenses: transfers between your own accounts are neither
  const notTransfer=t=>{const c=byId(state.categories,t.categoryId);return !(c&&c.group==='Transfers')};
  const inc=months.map(mk=>sum(ptx.filter(t=>monthKey(t.date)===mk&&t.amount>0&&notTransfer(t)).map(t=>t.amount)));
  const exp=months.map(mk=>sum(ptx.filter(t=>monthKey(t.date)===mk&&t.amount<0&&notTransfer(t)).map(t=>-t.amount)));
  const rate=months.map((mk,i)=>inc[i]>0?(inc[i]-exp[i])/inc[i]*100:null);
  h+=`<div class="card"><h3>Income vs Expenses <span class="r dim" style="font-family:var(--mono);font-size:11px">TRAILING 12 MONTHS</span></h3>
    ${chart('rep-ie',el=>CH.bars(el,{groups:months.map((mk,i)=>({label:fmtMY(mk+'-01').slice(0,3),values:[inc[i],exp[i]]})),series:[{name:'Income',color:CONFIG.colors.gn},{name:'Expenses',color:CONFIG.colors.rd}],height:250,line:{name:'Savings rate',color:CONFIG.colors.or,data:rate},legendId:'rep-ie'}))}</div></div>`;
  // heat map
  const days={};for(const t of txs)if(t.amount<0)days[t.date]=(days[t.date]||0)+(-t.amount);
  h+=`<div class="card" style="margin-bottom:14px"><h3>Cash Flow Heat Map <span class="r dim" style="font-family:var(--mono);font-size:11px">DAILY SPEND INTENSITY</span></h3>${chart('rep-heat',el=>CH.heat(el,{days,from:r.from,to:r.to}))}</div>`;
  // category trend
  const trendCat=ui.reportCat||state.categories[0]?.id;
  const tmonths=[];for(let i=11;i>=0;i--)tmonths.push(monthKey(addMonths(todayISO(),-i)));
  const tdata=tmonths.map(mk=>Math.abs(sum(ptx.filter(t=>monthKey(t.date)===mk&&t.categoryId===trendCat).map(t=>t.amount))));
  h+=`<div class="card"><h3>Category Trend <span class="r"><select data-change="report-cat" style="width:210px">${catOptions(trendCat)}</select></span></h3>
    ${chart('rep-trend',el=>CH.line(el,{labels:tmonths.map(mk=>fmtMY(mk+'-01').slice(0,3)),series:[{name:catShort(trendCat),color:CONFIG.colors.or,data:tdata}],fillFirst:true,height:200}))}</div>`;
  return h;
};
