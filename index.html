<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinanceHub">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0d'/%3E%3Ctext x='16' y='23' font-size='20' font-family='monospace' fill='%23f97316' text-anchor='middle' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"FinanceHub","short_name":"FinanceHub","display":"standalone","background_color":"%230d0d0d","theme_color":"%230d0d0d","start_url":"."}'>
<title>FINANCEHUB</title>
<style>
/* ============ DESIGN SYSTEM - dark industrial ============ */
:root{
  --bg:#0d0d0d; --s1:#161616; --s2:#1c1c1c; --s3:#232323; --bd:#2a2a2a; --bd2:#3a3a3a;
  --or:#f97316; --or-d:#c2590f; --gn:#22c55e; --rd:#ef4444; --bl:#3b82f6; --am:#f59e0b;
  --tx:#e5e5e5; --tx2:#9a9a9a; --tx3:#666;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --head:'Rajdhani','Segoe UI',sans-serif;
  --r:4px; --sh:0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;font-size:14.5px;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:var(--r)}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
h1,h2,h3,h4{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em}
button{font-family:inherit}
a{color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh}
#sidebar{width:210px;min-width:210px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:margin-left .2s}
#sidebar.collapsed{margin-left:-210px}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--bd)}
.logo h1{font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--tx)}
.logo h1 span{color:var(--or)}
.logo .sub{font-size:11px;color:var(--tx3);letter-spacing:.2em;text-transform:uppercase;font-family:var(--mono)}
nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--tx2);font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--s2);color:var(--tx)}
.nav-item.active{background:var(--s2);color:var(--or);border-left-color:var(--or)}
.nav-item .ico{width:18px;text-align:center;font-family:var(--mono);font-size:13px}
.nav-foot{padding:12px 16px;border-top:1px solid var(--bd);font-family:var(--mono);font-size:11px;color:var(--tx3)}
#main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--s1);border-bottom:1px solid var(--bd);min-height:58px}
#topbar h2{font-size:19px;color:var(--tx);letter-spacing:.1em}
#topbar .totals{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.tb-stat{text-align:right}
.tb-stat .l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.15em}
.tb-stat .v{font-family:var(--mono);font-size:15px;font-weight:600}
#burger{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-family:var(--mono)}
#burger:hover{color:var(--or);border-color:var(--or)}
#main{flex:1;overflow-y:auto;padding:22px}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card.pad0{padding:0}
.card h3{font-size:12px;color:var(--tx2);letter-spacing:.18em;margin-bottom:12px;font-weight:600}
.card h3 .r{float:right}
.sec-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.2em;font-family:var(--head);font-weight:600}
.num{font-family:var(--mono)}
.pos{color:var(--gn)}.neg{color:var(--rd)}.acc{color:var(--or)}.mut{color:var(--tx2)}.dim{color:var(--tx3)}
.big{font-size:26px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-size:13px;font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.btn:hover{border-color:var(--or);color:var(--or)}
.btn.primary{background:var(--or);border-color:var(--or);color:#0d0d0d}
.btn.primary:hover{background:#fb8b3c;color:#0d0d0d}
.btn.danger{border-color:var(--rd);color:var(--rd)}
.btn.danger:hover{background:var(--rd);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--or)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:1px 7px;border-radius:var(--r);font-size:11px;font-family:var(--mono);border:1px solid var(--bd2);color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.badge.or{border-color:var(--or);color:var(--or)}
.badge.gn{border-color:var(--gn);color:var(--gn)}
.badge.rd{border-color:var(--rd);color:var(--rd)}
.badge.bl{border-color:var(--bl);color:var(--bl)}
.badge.or{border-color:var(--or);color:var(--or)}
.badge.tagbtn{cursor:pointer}
.badge.tagbtn:hover{border-color:var(--or);color:var(--or)}
.badge.am{border-color:var(--am);color:var(--am)}
.group-head{display:flex;align-items:center;gap:10px;padding:8px 2px 6px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
input,select,textarea{background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:var(--r);padding:7px 10px;font-size:13px;font-family:var(--mono);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
input[type=checkbox]{width:auto;accent-color:var(--or)}
input[type=color]{padding:2px;height:34px}
label.f{display:block;margin-bottom:10px}
label.f .fl{display:block;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px;font-family:var(--head);font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer}

/* tables */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{font-family:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--or)}
td{padding:7px 10px;border-bottom:1px solid #1f1f1f;vertical-align:middle}
table.compact td{padding:4px 8px;font-size:12.5px}table.compact .btn.sm{padding:2px 8px;font-size:10.5px}
/* grouped bills register: header band, indented lines, subtotal rule */
tr.grp td{background:#161616;border-top:2px solid var(--bd2);border-bottom:1px solid #222;padding:9px 10px 6px;cursor:pointer;user-select:none}
tr.grp td:first-child{border-left:3px solid var(--or)}
tr.grp .cnt{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-left:6px}
tr.grp .car{display:inline-block;width:14px;color:var(--tx3);font-size:10px}
tr.ln td{vertical-align:top;white-space:nowrap}tr.ln td:first-child{padding-left:22px;border-left:3px solid transparent;white-space:normal}
tr.ln .meta{font-family:var(--mono);font-size:11px;margin-top:3px;line-height:1.4}
.linkish{cursor:pointer;border-bottom:1px dotted currentColor}.linkish:hover{color:var(--or)}
details.excl{position:relative}details.excl summary{list-style:none;cursor:pointer}details.excl summary::-webkit-details-marker{display:none}
.excl-panel{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:220px;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:8px 10px;display:grid;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.excl-panel .chk{font-size:12.5px;white-space:nowrap}tr.ln .meta .badge{vertical-align:middle}
tr.ln.first td{padding-top:9px}
tr.sub td{background:#121212;font-family:var(--mono);font-size:11.5px;color:var(--tx2);padding:5px 10px 7px;border-bottom:0}
tr.sub td:first-child{border-left:3px solid transparent;padding-left:22px;font-family:var(--head);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
tr.sub .num{font-weight:700;color:var(--tx)}
tr.tot td{border-top:2px solid var(--or)}
.receipt-zone{border:1px dashed var(--bd2);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#111;transition:border-color .15s,background .15s}
.receipt-zone.over{border-color:var(--or);background:#1a150f}.receipt-zone.busy{border-style:solid;border-color:var(--am)}
.rz-body{display:flex;gap:10px;align-items:center;font-size:12.5px}.rz-icon{color:var(--or);font-size:18px}
tr:hover td{background:#191919}
tr.tot td{border-top:1px solid var(--bd2);font-weight:700;color:var(--tx)}
td.r,th.r{text-align:right}
.row-act{opacity:0;display:inline-flex;gap:4px}
tr:hover .row-act{opacity:1}
.iconbtn{background:none;border:none;color:var(--tx3);cursor:pointer;font-family:var(--mono);font-size:13px;padding:2px 5px;border-radius:var(--r)}
.iconbtn:hover{color:var(--or);background:var(--s3)}
.iconbtn.del:hover{color:var(--rd)}

/* progress */
.pbar{height:8px;background:var(--s3);border-radius:var(--r);overflow:hidden}
.pbar>div{height:100%;background:var(--gn);transition:width .4s}
.pbar>div.warn{background:var(--am)}.pbar>div.over{background:var(--rd)}

/* hero */
.hero{background:linear-gradient(135deg,#1c1c1c,#161616);border:1px solid var(--bd2);border-radius:var(--r);padding:22px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.hero .main-fig .l{font-size:12px;color:var(--tx2);letter-spacing:.25em;text-transform:uppercase;font-family:var(--head);font-weight:700}
.hero .main-fig .v{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--or);line-height:1.05}
.hero .alt{border-left:1px solid var(--bd2);padding-left:22px}
.hero .alt .l{font-size:9px;color:var(--tx3);letter-spacing:.2em;text-transform:uppercase}
.hero .alt .v{font-family:var(--mono);font-size:19px;font-weight:600}

/* modal */
#modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:5vh 16px}
#modal-layer.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);width:100%;max-width:560px;box-shadow:var(--sh);margin-bottom:5vh}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.modal-h h3{font-size:14px;letter-spacing:.15em;color:var(--tx)}
.modal-h .x{margin-left:auto;background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer;font-family:var(--mono)}
.modal-h .x:hover{color:var(--rd)}
.modal-b{padding:18px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--bd)}

/* misc */
.empty{padding:44px 20px;text-align:center;color:var(--tx3)}
.empty .big-i{font-size:30px;font-family:var(--mono);color:var(--bd2);margin-bottom:10px}
.empty p{margin-bottom:14px;font-size:13px}
.spark{display:block}
.acct-card{position:relative;overflow:hidden}
.acct-card .tag{position:absolute;top:0;left:0;width:4px;height:100%}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.chart-wrap{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-family:var(--mono);color:var(--tx2);cursor:pointer;user-select:none}
.legend .li.off{opacity:.35;text-decoration:line-through}
.legend .sw{width:10px;height:10px;border-radius:2px}
#tooltip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--bd2);border-radius:var(--r);padding:7px 10px;font-family:var(--mono);font-size:12.5px;z-index:200;display:none;box-shadow:var(--sh);white-space:pre-line;line-height:1.5;max-width:280px}
#toast{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--s2);border:1px solid var(--or);border-left:3px solid var(--or);border-radius:var(--r);padding:10px 16px;font-family:var(--mono);font-size:12.5px;box-shadow:var(--sh);animation:tin .25s}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
svg path.anim{transition:opacity .6s;}
svg .fade{animation:fin .7s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.milestone{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #1f1f1f;font-size:12.5px}
.milestone .d{font-family:var(--mono);color:var(--or);min-width:76px}
.gantt-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.gantt-row .gl{width:130px;min-width:130px;font-size:12.5px;font-family:var(--mono);color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-track{flex:1;height:18px;background:var(--s2);border-radius:var(--r);position:relative}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:var(--r);opacity:.85}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tab{padding:8px 16px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);border-bottom:2px solid transparent}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--or);border-bottom-color:var(--or)}
.ring-wrap{display:flex;gap:16px;align-items:center}
.wizard-step{display:none}.wizard-step.active{display:block}
.csv-prev{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:var(--r)}
.flash{animation:flash 1s}
@keyframes flash{0%{background:rgba(249,115,22,.25)}100%{background:transparent}}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
#backdrop{display:none}
@media(max-width:760px){
  #sidebar{position:fixed;z-index:50;height:100%;transition:margin-left .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top)}
  #sidebar:not(.collapsed)~#backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow,.frow3{grid-template-columns:1fr}
  .hero{gap:14px;padding:16px}
  .hero .main-fig{width:100%}
  .hero .main-fig .v{font-size:30px}
  .hero .alt{border-left:none;border-top:1px solid var(--bd2);padding:8px 0 0;min-width:46%;flex:1 1 46%}
  #main{padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  #topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:40}
  #topbar .totals{display:none}
  #topbar h2{font-size:16px}
  /* touch targets */
  .btn{min-height:42px;padding:10px 14px}
  .btn.sm{min-height:36px}
  .iconbtn{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  #nav .nav-item{padding:13px 18px;font-size:14px}
  input,select,textarea{font-size:16px!important;min-height:42px} /* 16px stops iOS focus zoom */
  .chk input{width:20px;height:20px}
  /* wide tables scroll inside cards */
  .card{overflow-x:auto}
  .card table{min-width:520px}
  .card table.fit{min-width:0}
  /* modals become full sheets */
  #modal-layer{padding:0;align-items:stretch}
  .modal{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:none;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .modal-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .toolbar{gap:8px}
  #toasts{bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px}
  #toasts .toast{width:100%}
}
@supports(-webkit-touch-callout:none){ /* iOS momentum + no rubber-band on app shell */
  #main{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><h1>FINANCE<span>HUB</span></h1><div class="sub">Personal Finance Manager</div><div class="dim" style="font-family:var(--mono);font-size:9.5px;margin-top:3px">build <span id="build-stamp"></span></div><div id="sync-ind" class="dim" style="font-family:var(--mono);font-size:10px;margin-top:6px;display:none"></div></div>
    <nav id="nav"></nav>
    <div class="nav-foot">AUD &middot; LOCAL DATA<br>INDEXEDDB v1</div>
  </aside>
  <div id="backdrop" data-action="toggle-nav"></div>
  <div id="main-wrap">
    <div id="topbar">
      <button id="burger" data-action="toggle-nav" aria-label="Toggle navigation">&#9776;</button>
      <h2 id="view-title">Dashboard</h2>
      <button class="btn sm" id="page-report-btn" data-action="page-report" title="Print-ready report of this page - opens in a new tab, Print / Save as PDF">&#9113; Report</button>
      <div class="totals" id="topbar-totals"></div>
    </div>
    <div id="main"></div>
  </div>
</div>
<div id="modal-layer"></div>
<div id="tooltip"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================================================================
   SECTION: CONFIG
   ================================================================ */
const BUILD='2026-09-17.13';
const CONFIG = {
  dbName:'financehub', dbStore:'app', dbKey:'state',
  colors:{or:'#f97316',gn:'#22c55e',rd:'#ef4444',bl:'#3b82f6',am:'#f59e0b',tx2:'#9a9a9a'},
  series:['#f97316','#3b82f6','#f59e0b','#22c55e','#a855f7','#14b8a6','#ef4444','#eab308','#6366f1','#f472b6'],
  accountTypes:[
    {id:'transaction',n:'Transaction',asset:true},{id:'savings',n:'Savings',asset:true},
    {id:'offset',n:'Offset',asset:true},{id:'term',n:'Term Deposit',asset:true},
    {id:'credit',n:'Credit Card',asset:false,limit:true},{id:'ploan',n:'Personal Loan',asset:false},
    {id:'carloan',n:'Car Loan',asset:false},{id:'mortgage',n:'Mortgage',asset:false},
    {id:'hecs',n:'HECS/HELP',asset:false},{id:'invest',n:'Investment',asset:true},{id:'property',n:'Property',asset:true},{id:'vehicle',n:'Vehicle',asset:true},{id:'equipment',n:'Equipment',asset:true},
    {id:'cash',n:'Cash',asset:true},{id:'other',n:'Other',asset:true}
  ],
  billFreqs:[
    {id:'weekly',n:'Weekly',wk:a=>a},{id:'fortnightly',n:'Fortnightly',wk:a=>a/2},
    {id:'monthly',n:'Monthly',wk:a=>a*12/52},{id:'quarterly',n:'Quarterly',wk:a=>a*4/52},
    {id:'halfyearly',n:'Half-yearly',wk:a=>a*2/52},{id:'annually',n:'Annually',wk:a=>a/52},
    {id:'customN',n:'Custom (weeks)',wk:(a,n)=>a/(n||1)}, // displayed as "Every 8 weeks" via billFreqLabel
    {id:'schedule',n:'Instalment schedule',wk:a=>a/52} // amount = sum of the schedule (one billing year)

/* ---- RFC 4180 CSV ---- */
function csvParse(text){
  const rows=[];let row=[],field='',inQ=false,i=0;
  text=text.replace(/^\uFEFF/,'');
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue} inQ=false;i++;continue }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue}
    if(c===','){row.push(field);field='';i++;continue}
    if(c==='\r'){ if(text[i+1]==='\n')i++; row.push(field);rows.push(row);row=[];field='';i++;continue}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==''));
}
function csvField(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvBuild(rows){return rows.map(r=>r.map(csvField).join(',')).join('\r\n')}
function downloadFile(name,content,type='text/plain'){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},400);
}

const DB={
  _db:null,
  open(){return new Promise((res,rej)=>{
    const rq=indexedDB.open(CONFIG.dbName,1);
    rq.onupgradeneeded=e=>{e.target.result.createObjectStore(CONFIG.dbStore)};
    rq.onsuccess=e=>{DB._db=e.target.result;res()};
    rq.onerror=()=>rej(rq.error);
  })},
  load(){return new Promise(res=>{
    if(!DB._db)return res(null);
    const tx=DB._db.transaction(CONFIG.dbStore,'readonly');
    const rq=tx.objectStore(CONFIG.dbStore).get(CONFIG.dbKey);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
  })},
  put(data){return new Promise(res=>{
    if(!DB._db)return res(false);
    const tx=DB._db.transaction(CONFIG.dbStore,'readwrite');
    tx.objectStore(CONFIG.dbStore).put(data,CONFIG.dbKey);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  })}
};
