/* ================================================================
   SECTION: ENGINE - pure financial calculation functions
   ================================================================ */
const ENGINE={
  /* ---- Bills: exact annualised weekly cost (cents) ---- */
  billWeekly(b){
    if(b.freq==='schedule')return sum((b.schedule||[]).map(i=>i.amount))/52;
    const f=CONFIG.billFreqs.find(x=>x.id===b.freq)||CONFIG.billFreqs[2];
    return f.wk(b.amount,b.everyN);
  },
  /* ---- instalment schedules ----
     A 'schedule' bill is a dated list of instalments (rates notice, school
     fees, a payment plan) with different amounts and fixed dates. The bill's
     nextDue/amount always mirror the next unpaid instalment so every view
     that reads b.nextDue/b.amount keeps working; the annual figure is the
     sum of the whole schedule (a notice covers one billing year). */
  scheduleSync(b){
    const s=(b.schedule||[]).slice().sort((x,y)=>x.date<y.date?-1:1);b.schedule=s;
    const nxt=s.find(i=>!i.paid);
    if(nxt){b.nextDue=nxt.date;b.amount=nxt.amount;b.scheduleDone=false}
    else if(s.length){b.nextDue=s[s.length-1].date;b.amount=0;b.scheduleDone=true}
    return b;
  },
  scheduleRemaining(b){const r=(b.schedule||[]).filter(i=>!i.paid);return{count:r.length,total:sum(r.map(i=>i.amount)),of:(b.schedule||[]).length}},
  /* advance one payment: schedules tick the current instalment off, everything
     else rolls the due date one cycle forward */
  billAdvance(b){
    if(b.freq==='schedule'){const i=(b.schedule||[]).find(x=>!x.paid);if(i)i.paid=true;ENGINE.scheduleSync(b);return}
    b.nextDue=advanceBill(b.nextDue,b.freq,b.everyN);
  },
  billAnnual(b){return ENGINE.billWeekly(b)*52},
  billMonthly(b){return ENGINE.billWeekly(b)*52/12},
  billsSummary(){
    // only bills paid FROM the bills account participate in the transfer.
    // Bills flagged out (mortgage/debt repayments paid from everyday, already
    // costed as debt minimums) stay in the register without inflating it.
    // two transfers: BILLS (commitments, into the bills account) and LIVING
    // (allowances, into the spends account). This summary is the bills one;
    // livingSummary() is its mirror.
    const act=state.bills.filter(b=>b.active!==false&&b.inTransfer!==false&&b.kind!=='living');
    const excluded=state.bills.filter(b=>b.active!==false&&b.inTransfer===false&&b.kind!=='living').length;
    const wk=sum(act.map(ENGINE.billWeekly));
    const livingWk=ENGINE.livingSummary().weekly;
    const buf=wk*(state.settings.billsBuffer||0)/100;
    let final=wk+buf;
    const r=state.settings.billsRound*100;
    if(r>0)final=Math.ceil(final/r)*r;
    return {weekly:wk,billsWeekly:wk,livingWeekly:livingWk,buffer:buf,final,fortnightly:final*2,monthly:final*52/12,annual:wk*52,count:act.length,excluded};
  },
  /* Bills account: project 12 weeks -> weekly transfer in, bills out on due dates.
     Also computes min opening float needed so a zero-start never dips negative. */
  billsProjection(weeks=12){
    const s=ENGINE.billsSummary();
    const opening=sum(billsAccountIds().map(id=>(byId(state.accounts,id)||{balance:0}).balance));
    const start=todayISO();
    const events=[]; // due bills in horizon
    for(const b of state.bills.filter(b=>b.active!==false&&b.inTransfer!==false&&b.kind!=='living')){
      if(b.freq==='schedule'){
        for(const i of (b.schedule||[]))if(!i.paid){const d=daysBetween(start,i.date);if(d>=0&&d<weeks*7)events.push({day:d,name:b.name,amount:i.amount})}
        continue;
      }
      let due=b.nextDue||start;
      let guard=0;
      while(daysBetween(start,due)<0&&guard++<400)due=advanceBill(due,b.freq,b.everyN); // catch up overdue for projection
      guard=0;
      while(daysBetween(start,due)<weeks*7&&guard++<400){
        events.push({day:daysBetween(start,due),name:b.name,amount:b.amount});
        due=advanceBill(due,b.freq,b.everyN);
      }
    }
    const rows=[];let bal=opening,zeroBal=0,minZero=0;
    for(let w=0;w<weeks;w++){
      bal+=s.final; zeroBal+=s.final;
      const wkEvents=events.filter(e=>e.day>=w*7&&e.day<(w+1)*7);
      const out=sum(wkEvents.map(e=>e.amount));
      bal-=out; zeroBal-=out; minZero=Math.min(minZero,zeroBal);
      rows.push({week:w+1,date:addDays(start,(w+1)*7-1),in:s.final,out,bal,events:wkEvents});
    }
    return {rows,opening,minFloat:Math.max(0,-minZero),shortfalls:rows.filter(r=>r.bal<0)};
  },
  upcomingBills(days=30){
    const start=todayISO(),out=[];
    for(const b of state.bills.filter(b=>b.active!==false)){
      if(!b.nextDue||(b.freq==='schedule'&&b.scheduleDone)||b.kind==='living')continue;
      const d=daysBetween(start,b.nextDue);
      if(d<=days)out.push({bill:b,days:d});
    }
    return out.sort((a,b)=>a.days-b.days);
  },
  /* ---- Budget ---- */
  monthActuals(mk){
    const out={};
    for(const t of personalTx()){
      if(monthKey(t.date)!==mk)continue;
      out[t.categoryId||'_u']=(out[t.categoryId||'_u']||0)+t.amount;
    }
    return out;
  },
  /* Bill-backed categories are billed in lumps (quarterly water, annual rego)
     but budgeted at true monthly cost. Comparing a lump to one month's budget
     always reads as a blowout, so each payment in such a category is amortised
     across its bill's cycle from the month it landed. Others are untouched. */
  billCycleMonths(b){
    const m={weekly:1,fortnightly:1,monthly:1,quarterly:3,halfyearly:6,annually:12}[b.freq];
    if(m)return m;
    if(b.freq==='customN')return Math.max(1,Math.round((b.everyN||1)*7/30.44));
    if(b.freq==='schedule'){const s=b.schedule||[];if(s.length<2)return 3;const span=daysBetween(s[0].date,s[s.length-1].date);return clamp(Math.round(span/(s.length-1)/30.44)||3,1,12)}
    return 1;
  },
  monthActualsSmoothed(mk){
    const cycle={};
    for(const b of state.bills.filter(b=>b.active!==false)){
      if(!b.categoryId)continue;
      cycle[b.categoryId]=Math.max(cycle[b.categoryId]||1,ENGINE.billCycleMonths(b));
    }
    const out={};
    for(const t of personalTx()){
      const cid=t.categoryId||'_u';
      const n=cycle[cid]||1;
      if(n<=1){if(monthKey(t.date)===mk)out[cid]=(out[cid]||0)+t.amount;continue}
      const idx=monthsBetweenKeys(monthKey(t.date),mk);
      if(idx>=0&&idx<n)out[cid]=(out[cid]||0)+t.amount/n;
    }
    for(const k in out)out[k]=Math.round(out[k]);
    return out;
  },
  /* ---- Health Check ----
     Deterministic setup review: every rule is something the numbers can
     prove, so the list is the same each time and each item says what to do.
     Returns [{sev:'high'|'med'|'low', area, title, detail, view, count}]. */
  healthCheck(){
    const out=[];const add=(sev,area,title,detail,view,count,ids)=>out.push({sev,area,title,detail,view,count,ids:ids||null});
    const today=todayISO(),cat=id=>byId(state.categories,id),acct=id=>byId(state.accounts,id);
    const act=state.bills.filter(b=>b.active!==false),debts=activeDebts();
    const cashAcct=a=>a&&acctType(a).asset&&!a.noTx&&!a.archived;
    // 1. living spend counted twice: a Transfers-group bill in the weekly transfer while living spend comes from actuals
    if((state.settings.spendMode||'auto')!=='manual'){
      const dbl=act.filter(b=>b.inTransfer!==false&&cat(b.categoryId)?.group==='Transfers'&&!b.debtId&&!b.autoFrom);
      const dbl2=dbl.filter(b=>b.kind!=='living');
      if(dbl2.length)add('high','Pay Split','Spending allowance filed as a bill',`${dbl2.map(b=>b.name).join(', ')} ${dbl2.length>1?'are':'is'} an internal transfer inside the weekly transfer, and Living spend is taken from actuals, which already counts what that money is spent on. Edit the bill and tick "living allowance" - it moves to the Living tab and becomes the living-spend line instead of being counted twice.`,'bills',dbl2.length,dbl2.map(b=>b.id));
    }
    // 2. debt funded twice: viaBills auto bill AND a manual bill in the transfer linked to the same debt
    for(const d of debts){
      const manual=act.filter(b=>b.debtId===d.id&&!b.autoFrom&&b.inTransfer!==false);
      if(d.viaBills&&manual.length)add('high','Debts',`${d.name} repayment counted twice`,`It is set to fund via bills (AUTO bill) and also has a manual bill in the transfer (${manual.map(b=>b.name).join(', ')}). Keep one.`,'bills',1,manual.map(b=>b.id).concat(state.bills.filter(b=>b.autoFrom===d.id).map(b=>b.id)));
    }
    // 3. debt minimum vs what is actually paid
    for(const d of debts){
      const ps=ENGINE.debtPayStats(d);
      if(ps.count>=2&&d.minAmount){const min=Math.round(ENGINE.minMonthly(d));const avg=Math.round(ps.avgMo||0);if(avg&&Math.abs(avg-min)/min>0.03)add('med','Debts',`${d.name} minimum is ${fmt(min)}/mo but actuals average ${fmt(avg)}/mo`,`Update the minimum on the debt so Pay Split and the Payoff Planner use the real repayment${d.viaBills?' - the AUTO bill follows it':''}.`,'debts',1)}
    }
    // 4. bills drifting
    const drift=act.map(b=>({b,dr:ENGINE.billDrift(b)})).filter(x=>x.dr&&Math.abs(x.dr.pc)>10);
    if(drift.length)add('med','Bills','Registered amounts out of step with actuals',drift.map(x=>`${x.b.name} ${x.dr.pc>0?'+':''}${x.dr.pc.toFixed(0)}% (avg ${fmt(x.dr.avg)})`).join('; ')+'. Fix the amounts so the weekly transfer is right.','bills',drift.length,drift.map(x=>x.b.id));
    // 5. bills with no keyword
    const nokw=act.filter(b=>!(b.matchKeyword||'').trim()&&!b.autoFrom&&b.freq!=='schedule'||(b.freq==='schedule'&&!(b.matchKeyword||'').trim()));
    if(nokw.length)add('low','Bills',`${nokw.length} bill${nokw.length>1?'s have':' has'} no match keyword`,`${nokw.map(b=>b.name).join(', ')}. Without one, Last paid stays blank and the due date only moves when you press Paid.`,'bills',nokw.length,nokw.map(b=>b.id));
    // 6. stale due dates: overdue > 14 days with a keyword (a payment should have matched)
    const stale=act.filter(b=>b.nextDue&&daysBetween(b.nextDue,today)>14&&!b.scheduleDone);
    if(stale.length)add('med','Bills',`${stale.length} bill${stale.length>1?'s':''} overdue by more than two weeks`,`${stale.map(b=>`${b.name} (${fmtD(b.nextDue)})`).join(', ')}. Either the payment has not been imported, the keyword does not match the bank description, or the bill was cancelled - fix or press Paid.`,'bills',stale.length,stale.map(b=>b.id));
    // 7. bills account not set
    if(!billsAccountIds().length)add('med','Settings','No bills account selected','The 12-week projection and the transfer health check need to know which account the weekly transfer goes into. Settings > Bills account.','settings',1);
    // 8. no income
    if(!state.incomes.length)add('high','Pay Split','No income entered','Pay Split cannot compute a surplus without at least one income source.','paysplit',1);
    // 9. uncategorised recent transactions
    const since=addMonths(today,-3);
    const unc=personalTx().filter(t=>!t.categoryId&&t.date>=since&&t.amount<0&&cashAcct(acct(t.accountId)));
    if(unc.length){const big=unc.filter(t=>Math.abs(t.amount)>=100000);add(big.length?'high':'low','Transactions',`${unc.length} uncategorised expense${unc.length>1?'s':''} in the last 3 months${big.length?` including ${big.length} over $1,000`:''}`,`Uncategorised rows count as living spend in Pay Split and as "Uncategorised" in Reports. ${big.length?`Large ones (${big.slice(0,3).map(t=>`${fmt(Math.abs(t.amount))} ${t.payee}`).join('; ')}) are often loan payouts or transfers - categorise those first.`:'Run AI categorise or apply keyword rules.'}`,'transactions',unc.length,unc.map(t=>t.id));}
    // 10. big non-transfer movements on cash accounts (refinance / drawdown miscategorised)
    const bigCash=personalTx().filter(t=>t.date>=since&&Math.abs(t.amount)>=1000000&&cashAcct(acct(t.accountId))&&cat(t.categoryId)&&cat(t.categoryId).group!=='Transfers'&&cat(t.categoryId).group!=='Income');
    if(bigCash.length)add('med','Transactions',`${bigCash.length} transaction${bigCash.length>1?'s':''} over $10,000 categorised as spending`,`${bigCash.slice(0,4).map(t=>`${fmtD(t.date)} ${fmt(Math.abs(t.amount))} ${t.payee}`).join('; ')}. If these are loan drawdowns, payouts or moves between your own accounts they should be Transfers > Internal Transfer.`,'transactions',bigCash.length,bigCash.map(t=>t.id));
    // 11. loan-account credits not marked transfer (repayments read as income)
    const loanInc=state.transactions.filter(t=>{const a=acct(t.accountId);return a&&!acctType(a).asset&&t.amount>0&&t.date>=since&&cat(t.categoryId)&&cat(t.categoryId).group!=='Transfers'});
    if(loanInc.length)add('med','Transactions',`${loanInc.length} loan-account credit${loanInc.length>1?'s':''} not categorised as Internal Transfer`,'Repayments arriving on a loan account are the mirror of money that left another account; categorise them Transfers > Internal Transfer so Reports do not double count.','transactions',loanInc.length,loanInc.map(t=>t.id));
    // 11b. the same payment categorised as spending on two accounts (bills account -> everyday -> lender,
    //      both legs given the expense category) - shows as ~200% in Budget
    {const recent=personalTx().filter(t=>t.amount<=-10000&&t.date>=since&&cashAcct(acct(t.accountId))&&cat(t.categoryId)&&!['Transfers','Income'].includes(cat(t.categoryId).group)).sort((x,y)=>x.date<y.date?-1:1);
     const pairs=[];const used=new Set();
     // a pass-through starts with a transfer between your own accounts; a card
     // purchase (Card xx1234, Value Date, SQ *, EFTPOS, Apple Pay) paid a merchant
     // directly, so it can never be the feeder leg - two card rows on two cards
     // are two purchases, whatever the amounts
     const looksLikeCard=t=>/\bcard\b|\bxx\d{3,4}\b|value date|\bsq \*|\bsq\*|eftpos|apple pay|google pay|paywave|paypass|tap ?and ?go/i.test(t.payee||'');
     for(let i=0;i<recent.length;i++){const t=recent[i];if(used.has(t.id)||looksLikeCard(t))continue;for(let j=i+1;j<recent.length;j++){const u=recent[j];if(daysBetween(t.date,u.date)>3)break;if(used.has(u.id)||u.accountId===t.accountId||u.categoryId!==t.categoryId)continue;if(Math.abs(Math.abs(u.amount)-Math.abs(t.amount))<=Math.abs(t.amount)*0.01){pairs.push([t,u]);used.add(t.id);used.add(u.id);break}}}
     if(pairs.length)add('high','Transactions',`${pairs.length} payment${pairs.length>1?'s':''} categorised as spending on two accounts`,`Same amount, same category, different accounts within 3 days - the money passing through (e.g. bills account to Everyday to the lender) has been given the expense category on both legs, so Budget and Reports count it twice. First few: ${pairs.slice(0,3).map(([t,u])=>`${fmt(Math.abs(t.amount))} ${catShort(t.categoryId)} on ${acctName(t.accountId)} and ${acctName(u.accountId)}`).join('; ')}. Keep the category on the leg that reaches the payee; the other leg is Transfers > Internal Transfer.`,'transactions',pairs.length,pairs.flatMap(([t,u])=>[t.id,u.id]));}
    // 12. income category on negative amounts
    const negInc=personalTx().filter(t=>t.amount<0&&t.date>=since&&cat(t.categoryId)?.group==='Income');
    if(negInc.length)add('low','Transactions',`${negInc.length} expense${negInc.length>1?'s':''} filed under an Income category`,'These show up as "Income" in the spending donut. Recategorise to what they actually were (a reversal goes to the category it refunded).','transactions',negInc.length,negInc.map(t=>t.id));
    // 13. stale balances
    const staleBal=state.accounts.filter(a=>!a.archived&&!a.noTx&&a.history&&a.history.length&&daysBetween(a.history[a.history.length-1].date,today)>45);
    if(staleBal.length)add('low','Accounts',`${staleBal.length} account balance${staleBal.length>1?'s':''} not updated in 45+ days`,`${staleBal.map(a=>a.name).join(', ')}. Net Worth and the running-balance column read from the card balance - update via the $ button after importing.`,'accounts',staleBal.length);
    // 14. likely business account not flagged
    const biz=state.accounts.filter(a=>!a.archived&&!a.excludeReports&&/business|pty|ltd|concepts|trading/i.test((a.name||'')+' '+(a.institution||'')));
    if(biz.length)add('med','Accounts',`${biz.map(a=>a.name).join(', ')} look${biz.length>1?'':'s'} like a business account but counts as household spending`,'Tick "Business / not household" on the account so its activity stays out of Reports, Budget and Pay Split while the balance still counts in Net Worth.','accounts',biz.length);
    // 15. closed-looking debts still open
    const zero=debts.filter(d=>d.balance===0&&ENGINE.debtPayStats(d).count>0);
    if(zero.length)add('low','Debts',`${zero.map(d=>d.name).join(', ')} at $0 but still open`,'If paid out, close it with the tick so it leaves Pay Split and the Payoff Planner and its bill leaves the transfer.','debts',zero.length);
    // 15b. financed assets: a vehicle/property with no loan link leaves reviews guessing
    const unlinked=state.accounts.filter(a=>!a.archived&&['property','vehicle'].includes(a.type)&&!a.securedDebtId);
    if(unlinked.length)add('low','Accounts',`${unlinked.map(a=>a.name).join(', ')}: loan not set`,'Edit the account and set "Loan against it" - either the debt that secures it, or Owned outright. The card then shows equity and the review stops asking.','accounts',unlinked.length);
    // 16. backup age
    const lastB=BACKUP.last('file');
    if(!lastB||daysBetween(lastB.date,today)>35)add('low','Settings',lastB?`Last file backup ${daysBetween(lastB.date,today)} days ago`:'No file backup ever saved','Gist sync is a mirror, not a backup. Settings > Save file backup now.','settings',1);
    // 17. duplicate bills (same keyword or same name)
    const seen={};for(const b of act){const k=((b.matchKeyword||'').trim()||b.name).toUpperCase();if(!k)continue;(seen[k]=seen[k]||[]).push(b.name)}
    const dupB=Object.values(seen).filter(v=>v.length>1);
    if(dupB.length)add('med','Bills','Bills that look like duplicates',dupB.map(v=>v.join(' / ')).join('; ')+'. Two bills matching the same payment both count in the transfer and both try to advance.','bills',dupB.length,act.filter(b=>{const k=((b.matchKeyword||'').trim()||b.name).toUpperCase();return seen[k]&&seen[k].length>1}).map(b=>b.id));
    const rank={high:0,med:1,low:2};
    return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
  },
  billBackedCats(){
    const m={};
    for(const b of state.bills.filter(b=>b.active!==false&&b.kind!=='living')){
      if(b.categoryId)m[b.categoryId]=(m[b.categoryId]||0)+ENGINE.billMonthly(b);
    }
    return m;
  },
  allowanceCats(){
    const m={};
    for(const b of state.bills.filter(b=>b.active!==false&&b.kind==='living')){
      const c=byId(state.categories,b.categoryId);
      if(b.categoryId&&c&&c.group!=='Transfers')m[b.categoryId]=(m[b.categoryId]||0)+ENGINE.billMonthly(b);
    }
    return m;
  },
  /* ---- Debts: normalise minimum repayment to monthly cents ---- */
  minMonthly(d){
    const f={weekly:52/12,fortnightly:26/12,monthly:1}[d.minFreq||'monthly']||1;
    return d.minAmount*f;
  },
  offsetBal(d){
    if(!d.offsetAccountId)return 0;
    const a=byId(state.accounts,d.offsetAccountId);
    return a?Math.max(0,a.balance):0;
  },
  /* ---- PAYOFF SIMULATOR (pure, monthly periods, integer cents) ----
     debts: [{id,name,balance,rate,minMonthly,fees,interestFreeUntil,offset}]
     opts: {order:[ids priority first], extraMonthly, lumps:[{month,amount}], escalation(%/yr), startDate}
     Returns per-month series, totals, milestones, per-debt payoff month.   */
  simulate(debts,opts){
    const N=debts.length;
    const bal=debts.map(d=>Math.max(0,d.balance));
    const startDate=opts.startDate||todayISO().slice(0,7)+'-01';
    const order=opts.order&&opts.order.length?opts.order.slice():debts.map(d=>d.id);
    const prio=id=>{const i=order.indexOf(id);return i<0?999:i};
    const idx=Object.fromEntries(debts.map((d,i)=>[d.id,i]));
    const paidOff=debts.map(()=>false);
    const months=[];const milestones=[];
    let totalInterest=0,month=0,extra=opts.extraMonthly||0;
    const lumpsByMonth={};(opts.lumps||[]).forEach(l=>{lumpsByMonth[l.month]=(lumpsByMonth[l.month]||0)+l.amount});
    const MAXM=1200;
    while(bal.some(b=>b>0)&&month<MAXM){
      const date=addMonths(startDate,month);
      if(month>0&&month%12===0&&opts.escalation)extra=Math.round(extra*(1+opts.escalation/100));
      const rec={date,perDebt:new Array(N),total:0,interest:0,principal:0,payment:0};
      // 1. interest
      for(let i=0;i<N;i++){
        if(bal[i]<=0){rec.perDebt[i]={balance:0,interest:0,principal:0,payment:0};continue}
        const d=debts[i];
        let intBase=bal[i];
        if(d.offset)intBase=Math.max(0,intBase-d.offset);
        let interest=0;
        const free=d.interestFreeUntil&&date<=d.interestFreeUntil;
        if(!free&&d.rate>0)interest=Math.round(intBase*(d.rate/100/12));
        const fees=d.fees||0;
        bal[i]+=interest+fees;
        totalInterest+=interest+fees;
        rec.interest+=interest+fees;
        rec.perDebt[i]={balance:0,interest:interest+fees,principal:0,payment:0};
      }
      // 2. minimums
      let pool=0;
      for(let i=0;i<N;i++){
        if(bal[i]<=0)continue;
        const pay=Math.min(bal[i],Math.round(debts[i].minMonthly));
        bal[i]-=pay;rec.perDebt[i].payment+=pay;rec.perDebt[i].principal+=pay-0;rec.payment+=pay;
      }
      // 3. freed minimums of already-paid-off debts roll into pool
      for(let i=0;i<N;i++)if(paidOff[i])pool+=Math.round(debts[i].minMonthly);
      // 4. extra + lumps + rolled minimums to priority debts
      pool+=extra+(lumpsByMonth[month]||0);
      const alive=()=>debts.map((d,i)=>i).filter(i=>bal[i]>0).sort((a,b)=>prio(debts[a].id)-prio(debts[b].id));
      let targets=alive();
      while(pool>0&&targets.length){
        const i=targets[0];
        const pay=Math.min(bal[i],pool);
        bal[i]-=pay;pool-=pay;rec.perDebt[i].payment+=pay;rec.payment+=pay;
        targets=alive();
      }
      // 5. record + milestones
      for(let i=0;i<N;i++){
        rec.perDebt[i].balance=bal[i];
        rec.perDebt[i].principal=rec.perDebt[i].payment-  (bal[i]<=0&&!paidOff[i]?0:0);
        if(bal[i]<=0&&!paidOff[i]){
          paidOff[i]=true;
          const rolls=Math.round(debts[i].minMonthly);
          milestones.push({date,text:`${debts[i].name} paid off`+(bal.some(b=>b>0)&&rolls>0?`, ${fmt0(rolls)}/mo rolls into next debt`:''),debtId:debts[i].id});
        }
      }
      rec.total=sum(bal.map(b=>Math.max(0,b)));
      months.push(rec);
      month++;
    }
    const payoffMonth={};debts.forEach((d,i)=>{
      const m=months.findIndex(r=>r.perDebt[i].balance<=0);
      payoffMonth[d.id]=m<0?months.length:m;
    });
    return {months,totalInterest,debtFreeDate:months.length?months[months.length-1].date:startDate,
            totalMonths:months.length,payoffMonth,milestones,capped:month>=MAXM,idx};
  },
  buildSimDebts(){
    return activeDebts().map(d=>({
      id:d.id,name:d.name,balance:d.balance,rate:d.rate||0,
      minMonthly:ENGINE.minMonthly(d),fees:d.fees||0,
      interestFreeUntil:d.interestFreeUntil||'',offset:ENGINE.offsetBal(d)
    }));
  },
  freqMonthly(amount,freq){return Math.round(amount*({weekly:52,fortnightly:26,monthly:12,annually:1}[freq]||12)/12)},
  incomeMonthly(){return sum(state.incomes.map(i=>ENGINE.freqMonthly(i.amount,i.freq)))},
  billsMonthly(){return Math.round(ENGINE.billsSummary().final*52/12)},
  /* Pay Split's bills line: commitments only - the living allowances inside
     the transfer are reported on the living-spend line instead */
  billsCommitMonthly(){return Math.round(ENGINE.billsSummary().final*52/12)},
  /* spends-account projection: pots start at their combined balance, the
     living transfer lands each week, spend leaves at the 3-month average rate */
  livingProjection(weeks=12){
    const ls=ENGINE.livingSummary();
    const pots=ENGINE.livingPotIds();
    const opening=sum(pots.map(id=>(byId(state.accounts,id)||{balance:0}).balance));
    const outWk=Math.round(ENGINE.livingActualMonthly()*12/52);
    // two points per week so the transfer is visible: balance right after the
    // top-up lands, then after the week's spend - a sawtooth like the bills chart
    const rows=[],pts=[];let bal=opening;
    for(let w=1;w<=weeks;w++){
      bal+=Math.round(ls.final);pts.push({label:'W'+w,bal,phase:'in'});
      bal-=outWk;pts.push({label:'',bal,phase:'out'});
      rows.push({week:w,bal,inn:Math.round(ls.final),out:outWk});
    }
    return{rows,pts,opening,inWk:Math.round(ls.final),outWk,net:Math.round(ls.final)-outWk,shortfalls:rows.filter(r=>r.bal<0)};
  },
  /* the living transfer: every active allowance normalised to a week, into
     the spends account (settings.spendsAccountId) */
  livingSummary(){
    const act=state.bills.filter(b=>b.active!==false&&b.kind==='living');
    const wk=sum(act.map(ENGINE.billWeekly));
    const r=state.settings.livingRound*100;
    let final=wk;if(r>0)final=Math.ceil(final/r)*r;
    return{weekly:wk,final,fortnightly:final*2,monthly:final*52/12,annual:wk*52,count:act.length,accountId:state.settings.spendsAccountId||''};
  },
  livingAllowanceMonthly(){return Math.round(sum(state.bills.filter(b=>b.active!==false&&b.kind==='living').map(ENGINE.billWeekly))*52/12)},
  /* actual living spend on the accounts the allowances land in (3-mo avg):
     everything that is not a transfer, income or a bill-backed category */
  livingPotIds(){return [...new Set([state.settings.spendsAccountId||'',...(state.settings.livingAccountIds||[]),...state.bills.filter(b=>b.active!==false&&b.kind==='living'&&b.toAccountId).map(b=>b.toAccountId)].filter(id=>id&&byId(state.accounts,id)))]},
  livingActualMonthly(){
    const acctIds=new Set(ENGINE.livingPotIds());
    const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
    let t=0;
    for(let m=1;m<=3;m++){const mk=monthKey(addMonths(todayISO(),-m));
      for(const tx of state.transactions){if(tx.amount>=0||monthKey(tx.date)!==mk||!acctIds.has(tx.accountId))continue;const c=byId(state.categories,tx.categoryId);if(c&&(c.group==='Income'||c.group==='Transfers'||billCats.has(tx.categoryId)))continue;t+=-tx.amount}}
    return Math.round(t/3);
  },
  minimumsMonthly(){return sum(activeDebts().map(d=>Math.round(ENGINE.minMonthly(d))))},
  budgetSpendMonthly(){
    if(state.settings.spendMode==='manual')return{amount:state.settings.spendManual||0,src:'manual'};
    if(state.settings.spendMode==='allowance')return{amount:ENGINE.livingAllowanceMonthly(),src:'allowances'};
    if(state.settings.spendMode==='budget'){
      const t=ENGINE.budgetSpendFromBudget();
      return{amount:t,src:'budget'};
    }
    if(state.settings.spendMode==='actuals')return{amount:ENGINE.budgetSpendFromActuals(),src:'actuals'};
    return ENGINE.budgetSpendAuto();
  },
  budgetSpendFromBudget(){
    const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
    const bud=state.budgets[monthKey(todayISO())];
    let t=0;
    for(const cid in (bud||{})){
      const c=byId(state.categories,cid);
      if(!c||c.group==='Income'||c.group==='Transfers'||billCats.has(cid))continue;
      t+=bud[cid];
    }
    return t;
  },
  budgetSpendFromActuals(){
    const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
    const n=clamp(state.settings.spendMonths||3,1,12);
    let t=0;
    for(let m=1;m<=n;m++){
      const mk=monthKey(addMonths(todayISO(),-m));
      for(const tx of state.transactions){
        if(tx.amount>=0||monthKey(tx.date)!==mk)continue;
        const acct=byId(state.accounts,tx.accountId);
        if(acct&&(!acctType(acct).asset||acct.excludeReports))continue;
        const c=byId(state.categories,tx.categoryId);
        if(!c||c.group==='Income'||c.group==='Transfers'||billCats.has(tx.categoryId))continue;
        t+=-tx.amount;
      }
    }
    return Math.round(t/n);
  },
  budgetSpendAuto(){
    const la=ENGINE.livingAllowanceMonthly();
    if(la>0)return{amount:la,src:'allowances'};
    const b=ENGINE.budgetSpendFromBudget();
    if(b>0)return{amount:b,src:'budget'};
    return{amount:ENGINE.budgetSpendFromActuals(),src:'actuals'};
  },
  /* A debt ticked "fund from the weekly bills transfer" owns an auto-managed
     bill: amount, frequency and account are derived from the debt and kept in
     step with it. An existing hand-made bill already linked to the debt is
     adopted rather than duplicated. Unticking removes only the auto-managed
     bill - a hand-made one is left alone. */
  syncDebtBills(){
    let changed=false;
    for(const d of state.debts){
      let bill=state.bills.find(b=>b.autoFrom===d.id)||state.bills.find(b=>b.debtId===d.id);
      if(d.viaBills&&!d.closed){
        const derived={name:d.name+' repayment',amount:d.minAmount||0,freq:d.minFreq||'monthly',
          everyN:1,debtId:d.id,inTransfer:true,autoFrom:d.id,active:true,
          accountId:state.settings.billsAccountId||''};
        if(d.categoryId)derived.categoryId=d.categoryId;
        if(bill){
          const before=JSON.stringify([bill.name,bill.amount,bill.freq,bill.debtId,bill.inTransfer,bill.autoFrom,bill.active]);
          Object.assign(bill,derived);
          if(!bill.nextDue)bill.nextDue=addDays(todayISO(),7);
          if(JSON.stringify([bill.name,bill.amount,bill.freq,bill.debtId,bill.inTransfer,bill.autoFrom,bill.active])!==before)changed=true;
        }else{
          state.bills.push({id:uid(),categoryId:d.categoryId||'',method:'',notes:'',matchKeyword:d.matchKeyword||'',
            autoAdvance:true,nextDue:addDays(todayISO(),7),...derived});
          changed=true;
        }
      }else if(bill&&bill.autoFrom===d.id){
        state.bills=state.bills.filter(b=>b.id!==bill.id);changed=true;
      }
    }
    const ids=new Set(state.debts.map(d=>d.id));
    const n=state.bills.length;
    state.bills=state.bills.filter(b=>!b.autoFrom||ids.has(b.autoFrom));
    if(state.bills.length!==n)changed=true;
    return changed;
  },
  paySplit(){
    const income=ENGINE.incomeMonthly();
    const bills=ENGINE.billsCommitMonthly();
    // a debt whose repayment is routed through the bills account (bill linked
    // via "Funds debt repayment of", still in the transfer) is already inside
    // the bills line - excluding its minimum here prevents the double count
    const funding={};
    for(const b of state.bills)if(b.active!==false&&b.inTransfer!==false&&b.debtId&&!funding[b.debtId])funding[b.debtId]=b;
    let mins=0,minsCovered=0;const minsWarns=[];
    for(const d of activeDebts()){
      const m=Math.round(ENGINE.minMonthly(d));
      const b=funding[d.id];
      if(b){
        minsCovered+=m;
        const bm=Math.round(ENGINE.billWeekly(b)*52/12);
        if(bm<m*0.95)minsWarns.push({name:d.name,billM:bm,minM:m});
      }else mins+=m;
    }
    const spend=ENGINE.budgetSpendMonthly();
    const surplus=income-bills-mins-spend.amount;
    return{income,bills,mins,minsCovered,minsWarns,spend:spend.amount,spendSrc:spend.src,surplus};
  },
  surplusMonthly(){return ENGINE.paySplit().surplus},
  allocAmounts(){
    const s=Math.max(0,ENGINE.surplusMonthly());
    const a=state.settings.alloc||{debt:70,goals:20,keep:10};
    return{debt:Math.round(s*a.debt/100),goals:Math.round(s*a.goals/100),keep:Math.round(s*a.keep/100),surplus:s};
  },
  billPayments(b){
    // comma-separated keywords ("TRANSPORT WA, BPAY REGO") - any match counts.
    // Manually linked transactions (t.billId) count regardless of description.
    const kws=(b.matchKeyword||'').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    return state.transactions.filter(t=>t.amount<0&&(t.billId===b.id||kws.some(k=>t.payee.toUpperCase().includes(k)))).sort((a,b2)=>a.date<b2.date?1:-1);
  },
  /* payments within 3 days of each other are ONE payment event - a rego paid
     as two part-payments by different methods sums to a single event */
  billPaymentEvents(b){
    // clustering rules: manual links always participate; keyword matches under
    // 10% of the bill are incidental noise and never join; >=90% is a full
    // payment standing alone; 10-90% are part-payments that merge with
    // neighbours within 3 days (a rego paid two ways sums to one event)
    const pays=ENGINE.billPayments(b); // desc by date
    const events=[];
    for(const p of pays){
      const manual=p.billId===b.id;
      const a=Math.abs(p.amount);
      if(!manual&&b.amount&&a<b.amount*0.1)continue;   // noise
      const partial=manual||!b.amount||a<b.amount*0.9; // can this merge?
      const ev=events[events.length-1];
      if(partial&&ev&&ev.open&&Math.abs(daysBetween(p.date,ev.date))<=3){ev.total+=a;ev.txs.push(p);if(manual)ev.manual=true}
      else events.push({date:p.date,total:a,txs:[p],manual,open:partial});
    }
    events.forEach(e=>delete e.open);
    return events;
  },
  billCycleDays(b){
    switch(b.freq){case 'weekly':return 7;case 'fortnightly':return 14;case 'monthly':return 30.44;case 'quarterly':return 91.3;case 'halfyearly':return 182.6;case 'annual':return 365;case 'customN':return 7*(b.everyN||1);case 'schedule':return ENGINE.billCycleMonths(b)*30.44;default:return 30.44}
  },
  billDrift(b){
    // events feed the drift average. Plausibility filter (50%-200% of the
    // registered amount) keeps incidental keyword matches out, but manually
    // linked events are always trusted.
    const evs=ENGINE.billPaymentEvents(b).filter(e=>e.manual||(e.total>=b.amount*0.5&&e.total<=b.amount*2)).slice(0,3);
    if(evs.length>=2){
      const avg=Math.round(sum(evs.map(e=>e.total))/evs.length);
      const pc=b.amount?((avg-b.amount)/b.amount*100):0;
      return{avg,pc,n:evs.length,last:evs[0]};
    }
    // Rate fallback for smoothing plans: a bill registered as "$1,000 every
    // 8 weeks" but paid as $60 weekly debits plus a true-up. No single payment
    // resembles the registered amount, so compare the RATE instead - everything
    // the keyword matched over the last two cycles, expressed per cycle.
    const pays=ENGINE.billPayments(b);
    if(pays.length<2||!b.amount)return null;
    const cyc=ENGINE.billCycleDays(b),today=todayISO(),start=addDays(today,-Math.round(cyc*2));
    const win=pays.filter(p=>p.date>=start);
    if(win.length<2)return null;
    const span=Math.max(cyc,daysBetween(win[win.length-1].date,today));
    const perCycle=Math.round(sum(win.map(p=>Math.abs(p.amount)))*cyc/span);
    const pc=(perCycle-b.amount)/b.amount*100;
    return{avg:perCycle,pc,n:win.length,last:{date:win[0].date,total:Math.abs(win[0].amount)},rate:true};
  },
  autoAdvanceBills(){
    // a matched payment near the due date marks the bill paid automatically.
    // Guards: keyword + auto-advance enabled, amount within 30% of the
    // registered amount, dated within [due-10d, due+14d], each transaction
    // consumed at most once, max 12 advances per bill per pass.
    let advanced=0;
    for(const b of state.bills){
      if(b.active===false||!b.autoAdvance||!(b.matchKeyword||'').trim())continue;
      b.consumedTx=b.consumedTx||[];
      const used=new Set(b.consumedTx);
      for(let i=0;i<12;i++){
        const lo=addDays(b.nextDue,-10),hi=addDays(b.nextDue,14);
        if(lo>todayISO())break; // due window entirely in the future
        const m=ENGINE.billPaymentEvents(b).find(e=>e.txs.every(t=>!used.has(t.id))&&e.date>=lo&&e.date<=hi&&(e.manual||Math.abs(e.total-b.amount)<=Math.round(b.amount*0.3)));
        if(!m)break;
        for(const t of m.txs){used.add(t.id);b.consumedTx.push(t.id)}
        if(b.consumedTx.length>50)b.consumedTx=b.consumedTx.slice(-50);
        ENGINE.billAdvance(b);
        if(b.scheduleDone)break;
        advanced++;
      }
      if(b.freq==='schedule')continue; // fixed dates: never re-anchor
      // anchor to the last real payment: next due = last paid + one cycle.
      // Catches a stale due date (bill paid early, or the register set up
      // after the fact) that the due-window match above cannot reach.
      const last=ENGINE.billLastPaid(b);
      if(last){
        const nd=advanceBill(last.date,b.freq,b.everyN);
        if(nd>b.nextDue){b.nextDue=nd;advanced++}
      }
    }
    return advanced;
  },
  /* most recent payment event that looks like this bill: a manual link, or a
     keyword match within 30% of the registered amount (a keyword like
     "GOVERNMENT OF WESTERN" can catch unrelated charges - the amount guard
     keeps those from moving the due date) */
  billLastPaid(b){
    if(!(b.matchKeyword||'').trim()&&!state.transactions.some(t=>t.billId===b.id))return null;
    const guarded=ENGINE.billPaymentEvents(b).find(e=>e.manual||Math.abs(e.total-b.amount)<=Math.round(b.amount*0.3));
    if(guarded)return guarded;
    // smoothing plan: no payment resembles the registered amount, but the
    // keyword is matching real debits - the latest one is still "last paid"
    const dr=ENGINE.billDrift(b);
    if(dr&&dr.rate)return{date:dr.last.date,total:dr.last.total,loose:true};
    return null;
  },
  debtBalance(d){
    if(d.linkedAccountId){
      const a=byId(state.accounts,d.linkedAccountId);
      if(a)return Math.abs(a.balance);
    }
    return d.balance;
  },
  debtPayments(d){
    const kw=(d.matchKeyword||'').trim().toUpperCase();
    const isLiab=t=>{const a=byId(state.accounts,t.accountId);return a&&!acctType(a).asset};
    const onLoanAcct=t=>!!d.linkedAccountId&&t.accountId===d.linkedAccountId;
    const isPayment=t=>{
      if(!(t.debtId===d.id||(kw&&t.payee.toUpperCase().includes(kw))))return false;
      // credits count as repayments ONLY on this debt's explicitly linked loan
      // account (set in the debt form). Credits on any other liability account
      // (e.g. a matching description on a credit card) are ignored. Debits on
      // liability accounts (interest, fees) never count. Otherwise: outgoing
      // debits from spending accounts are repayments.
      if(onLoanAcct(t))return t.amount>0;
      if(isLiab(t))return false;
      return t.amount<0;
    };
    let list=state.transactions.filter(isPayment);
    // both-sides dedupe: when the SAME repayment is imported twice (debit out
    // of the everyday account AND credit onto the linked loan account), keep
    // the spending-side debit and drop the loan-side credit. Pairing = equal
    // absolute amount within 5 days, each debit consuming at most one credit.
    const debits=list.filter(t=>!isLiab(t));
    const credits=list.filter(t=>onLoanAcct(t));
    const used=new Set();
    for(const db of debits){
      const m=credits.find(cr=>!used.has(cr.id)&&Math.abs(cr.amount)===Math.abs(db.amount)&&Math.abs(daysBetween(db.date,cr.date))<=5);
      if(m)used.add(m.id);
    }
    list=list.filter(t=>!used.has(t.id));
    return list.sort((a,b)=>a.date<b.date?1:-1);
  },
  debtPayStats(d){
    const pays=ENGINE.debtPayments(d);
    const cut=addMonths(todayISO(),-3);
    const recent=pays.filter(p=>p.date>=cut);
    const avgMo=recent.length?Math.round(sum(recent.map(p=>Math.abs(p.amount)))/3):0;
    const minMo=Math.round(ENGINE.minMonthly(d));
    return{pays,count:pays.length,total:sum(pays.map(p=>Math.abs(p.amount))),last:pays[0]||null,avgMo,minMo};
  },
  scenarioOpts(sc){
    const perYear={weekly:52,fortnightly:26,monthly:12}[sc.extraFreq||'monthly']||12;
    const start=todayISO().slice(0,7)+'-01';
    return {
      order:ENGINE.orderFor(sc),
      extraMonthly:sc.extraMode==='surplus'?ENGINE.allocAmounts().debt:Math.round((sc.extra||0)*perYear/12),
      lumps:(sc.lumps||[]).map(l=>({month:Math.max(0,Math.round(daysBetween(start,l.date)/30.44)),amount:l.amount})),
      escalation:sc.escalation||0,startDate:start
    };
  },
  orderFor(sc){
    const ds=activeDebts();
    if(sc.strategy==='avalanche')ds.sort((a,b)=>(b.rate||0)-(a.rate||0));
    else if(sc.strategy==='snowball')ds.sort((a,b)=>a.balance-b.balance);
    else if(sc.order&&sc.order.length)return sc.order.filter(id=>byId(state.debts,id)).concat(ds.map(d=>d.id).filter(id=>!sc.order.includes(id)));
    return ds.map(d=>d.id);
  },
  baseline(){return ENGINE.simulate(ENGINE.buildSimDebts(),{order:activeDebts().map(d=>d.id),extraMonthly:0,lumps:[],startDate:todayISO().slice(0,7)+'-01'})},
  amortPayment(P,ratePct,years){
    const r=ratePct/100/12,n=Math.max(1,Math.round(years*12));
    return r>0?Math.round(P*r/(1-Math.pow(1+r,-n))):Math.round(P/n);
  },
  consolidate(cfg){
    const sel=activeDebts().filter(d=>cfg.debtIds.includes(d.id)&&d.balance>0);
    if(sel.length<2)return null;
    const others=ENGINE.buildSimDebts().filter(sd=>!cfg.debtIds.includes(sd.id));
    const P=sum(sel.map(d=>d.balance))+(cfg.fees||0);
    const pay=ENGINE.amortPayment(P,cfg.rate,cfg.years);
    const newDebt={id:'__consol',name:'Consolidated loan',balance:P,rate:cfg.rate,minMonthly:pay,fees:0,interestFreeUntil:'',offset:0};
    const start=todayISO().slice(0,7)+'-01';
    const setB=[newDebt,...others];
    const orderB=setB.slice().sort((a,b)=>b.rate-a.rate).map(d=>d.id);
    const A=ENGINE.baseline();
    const B=ENGINE.simulate(setB.map(d=>({...d})),{order:orderB,extraMonthly:0,lumps:[],startDate:start});
    const curMins=sum(ENGINE.buildSimDebts().map(d=>Math.round(d.minMonthly)));
    const newMins=pay+sum(others.map(d=>Math.round(d.minMonthly)));
    const extraC=Math.max(0,curMins-newMins);
    const C=ENGINE.simulate(setB.map(d=>({...d})),{order:orderB,extraMonthly:extraC,lumps:[],startDate:start});
    return{sel,P,pay,curMins,newMins,extraC,A,B,C};
  },
  /* ---- Net worth ---- */
  netWorthSeries(){
    // combine monthly snapshots with per-account history
    const map=new Map(); // monthKey -> {assets, liab}
    for(const s of state.snapshots)map.set(monthKey(s.date),{assets:s.assets,liab:s.liabilities,date:s.date});
    // current
    const cur=ENGINE.netWorthNow();
    map.set(monthKey(todayISO()),{assets:cur.assets,liab:cur.liab,date:todayISO()});
    return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([mk,v])=>({mk,...v,net:v.assets-v.liab}));
  },
  netWorthNow(){
    let assets=0,liab=0;
    for(const a of activeAccounts()){
      if(isAsset(a))assets+=Math.max(0,a.balance);else liab+=Math.abs(a.balance);
    }
    return {assets,liab,net:assets-liab};
  },
  /* ---- Goals ---- */
  goalStats(g){
    const a=byId(state.accounts,g.accountId);
    const current=a?a.balance:(g.starting||0);
    const remaining=Math.max(0,g.target-current);
    const days=Math.max(1,daysBetween(todayISO(),g.targetDate||todayISO()));
    const perMonth=remaining/(days/30.44);
    const perFn=remaining/(days/14);
    // avg contribution from linked account history (last 90 days)
    let projDate=null;
    if(a&&a.history&&a.history.length>1){
      const hist=a.history.slice(-10);
      const first=hist[0],last=hist[hist.length-1];
      const dd=Math.max(1,daysBetween(first.date,last.date));
      const rate=(last.balance-first.balance)/dd; // cents/day
      if(rate>0&&remaining>0)projDate=addDays(todayISO(),Math.ceil(remaining/rate));
      else if(remaining<=0)projDate=todayISO();
    }
    return {current,remaining,perMonth,perFn,projDate,pct:g.target>0?clamp(current/g.target,0,1):0};
  },
  /* ---- Recurring transactions ---- */
  recurUpcoming(days=30){
    const out=[],start=todayISO();
    for(const r of state.recurring){
      let d=r.nextDate,guard=0;
      while(d&&daysBetween(start,d)<=days&&guard++<40){
        out.push({rec:r,date:d,overdue:daysBetween(start,d)<0});
        d=advanceBill(d,r.freq);
      }
    }
    return out.sort((a,b)=>a.date<b.date?-1:1);
  },
  applyRules(desc){
    const D=String(desc).toUpperCase();
    for(const r of state.rules){if(r.keyword&&D.includes(r.keyword.toUpperCase()))return r.categoryId}
    return '';
  }
};

/* ================================================================
   SECTION: CHARTS - hand-rolled SVG (no libraries)
   ================================================================ */
let chartQueue=[];
function chart(id,fn){chartQueue.push({id,fn});return`<div class="chart-slot chart-wrap" data-chart-id="${id}"></div>`}
function drawCharts(){
  for(const {id,fn} of chartQueue){
    const el=$(`[data-chart-id="${id}"]`);
    if(el)try{fn(el)}catch(e){console.warn('chart fail',id,e);el.innerHTML='<div class="dim" style="padding:20px;font-family:var(--mono);font-size:12px">chart unavailable</div>'}
  }
}
const CH={
  ticks(min,max,n=5){
    if(min===max){max=min+1}
    const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
    const norm=step0/mag;let step=mag*(norm<1.5?1:norm<3?2:norm<7?5:10);
    const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
    for(let v=lo;v<=hi+step/2;v+=step)out.push(v);
    return out;
  },
  money(v){
    const a=Math.abs(v);
    if(a>=100000000)return (v<0?'-':'')+'$'+(a/100000000).toFixed(1)+'M';
    if(a>=100000)return (v<0?'-':'')+'$'+Math.round(a/100000)+'k';
    return fmt0(v);
  },
  hiddenSet(id){if(!ui.chartHidden[id])ui.chartHidden[id]=new Set();return ui.chartHidden[id]},
  legend(chartId,items){
    const hid=CH.hiddenSet(chartId);
    return '<div class="legend">'+items.map((it,i)=>
      `<span class="li ${hid.has(i)?'off':''}" data-action="toggle-series" data-chart="${chartId}" data-idx="${i}"><span class="sw" style="background:${it.color}"></span>${esc(it.name)}</span>`).join('')+'</div>';
  },
  /* Generic xy line/area chart. cfg:{series:[{name,color,data:[y cents|null],dash?}],labels:[x],height,fillFirst,stacked:false,legendId} */
  line(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||220,P={l:56,r:10,t:12,b:26};
    const hid=cfg.legendId?CH.hiddenSet(cfg.legendId):new Set();
    const series=cfg.series.filter((s,i)=>!hid.has(i));
    const all=series.flatMap(s=>s.data.filter(v=>v!=null));
    if(!all.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    let min=Math.min(0,...all),max=Math.max(...all);
    const tks=CH.ticks(min,max,5);min=tks[0];max=tks[tks.length-1];
    const n=Math.max(...series.map(s=>s.data.length));
    const x=i=>P.l+(n<2?0.5:(i/(n-1)))*(W-P.l-P.r);
    const y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222" stroke-width="1"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" font-family="var(--mono)" text-anchor="end">${CH.money(t)}</text>`;
    if(min<0&&max>0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#3a3a3a"/>`;
    const lbls=cfg.labels||[],lstep=Math.ceil(lbls.length/Math.max(2,Math.floor((W-P.l)/62)));
    lbls.forEach((L,i)=>{if(i%lstep===0)g+=`<text x="${x(i)}" y="${H-8}" fill="#666" font-size="9.5" font-family="var(--mono)" text-anchor="middle">${esc(L)}</text>`});
    series.forEach((s,si)=>{
      const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
      if(!pts.length)return;
      const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      if(cfg.fillFirst&&si===0)g+=`<path d="${path} L ${pts[pts.length-1][0]} ${y(Math.max(min,0))} L ${pts[0][0]} ${y(Math.max(min,0))} Z" fill="${s.color}" opacity="0.10"/>`;
      g+=`<path class="anim" d="${path}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      s.data.forEach((v,i)=>{if(v==null)return;
        g+=`<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent" data-tip="${esc((lbls[i]?lbls[i]+'\n':'')+s.name+': '+fmt(v))}"/><circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${s.color}"/>`;
      });
    });
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series):'');
  },
  /* Stacked area: cfg{series:[{name,color,data[]}],labels,overlays:[{name,color,data,dash}],height,legendId} */
  stackedArea(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||260,P={l:60,r:10,t:12,b:26};
    const hid=cfg.legendId?CH.hiddenSet(cfg.legendId):new Set();
    const series=cfg.series.filter((s,i)=>!hid.has(i));
    const n=Math.max(0,...series.map(s=>s.data.length),...(cfg.overlays||[]).map(o=>o.data.length));
    if(!n){el.innerHTML='<div class="empty">No data yet</div>';return}
    const stackTops=[];let base=new Array(n).fill(0);
    for(const s of series){const top=s.data.map((v,i)=>(base[i]||0)+(v||0));stackTops.push({s,lo:base.slice(),hi:top});base=top}
    const overlayMax=Math.max(0,...(cfg.overlays||[]).flatMap(o=>o.data.filter(v=>v!=null)));
    const max=Math.max(overlayMax,...base,1);
    const tks=CH.ticks(0,max,5),top=tks[tks.length-1];
    const x=i=>P.l+(n<2?0.5:(i/(n-1)))*(W-P.l-P.r);
    const y=v=>P.t+(1-v/top)*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" text-anchor="end" font-family="var(--mono)">${CH.money(t)}</text>`;
    const lbls=cfg.labels||[],lstep=Math.ceil(lbls.length/Math.max(2,Math.floor((W-P.l)/62)));
    lbls.forEach((L,i)=>{if(i%lstep===0)g+=`<text x="${x(i)}" y="${H-8}" fill="#666" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${esc(L)}</text>`});
    for(const st of stackTops){
      const up=st.hi.map((v,i)=>[x(i),y(v)]),down=st.lo.map((v,i)=>[x(i),y(v)]).reverse();
      const d='M'+up.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+' L '+down.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+' Z';
      g+=`<path class="anim" d="${d}" fill="${st.s.color}" opacity="0.55" stroke="${st.s.color}" stroke-width="1"><title>${esc(st.s.name)}</title></path>`;
    }
    for(const o of cfg.overlays||[]){
      const pts=o.data.map((v,i)=>v==null?null:[x(i),y(Math.min(v,top))]).filter(Boolean);
      if(pts.length)g+=`<path class="anim" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${o.color}" stroke-width="2" ${o.dash?'stroke-dasharray="5 4"':''}/>`;
    }
    // hover columns
    for(let i=0;i<n;i++){
      const tot=base[i]||0;
      let tip=(lbls[i]||'')+'\nTotal: '+fmt(tot);
      series.forEach(s=>{if(s.data[i])tip+='\n'+s.name+': '+fmt(s.data[i])});
      g+=`<rect x="${x(i)-((W-P.l-P.r)/Math.max(1,n-1))/2}" y="${P.t}" width="${(W-P.l-P.r)/Math.max(1,n-1)}" height="${H-P.t-P.b}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series.concat(cfg.overlays||[])):'');
  },
  /* Bars: cfg{groups:[{label,values:[cents]}],series:[{name,color}],stacked,height,line:{name,color,data,rightPct},legendId} */
  bars(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||240,P={l:60,r:cfg.line?46:10,t:12,b:26};
    const groups=cfg.groups||[];
    if(!groups.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    let min=0,max=1;
    for(const gr of groups){
      if(cfg.stacked){const pos=sum(gr.values.filter(v=>v>0)),neg=sum(gr.values.filter(v=>v<0));max=Math.max(max,pos);min=Math.min(min,neg)}
      else{max=Math.max(max,...gr.values);min=Math.min(min,...gr.values,0)}
    }
    const tks=CH.ticks(min,max,5);min=tks[0];max=tks[tks.length-1];
    const x0=i=>P.l+i*((W-P.l-P.r)/groups.length);
    const bw=(W-P.l-P.r)/groups.length;
    const y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" text-anchor="end" font-family="var(--mono)">${CH.money(t)}</text>`;
    const lstep=Math.ceil(groups.length/Math.max(2,Math.floor((W-P.l)/58)));
    groups.forEach((gr,i)=>{
      if(i%lstep===0)g+=`<text x="${x0(i)+bw/2}" y="${H-8}" fill="#666" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${esc(gr.label)}</text>`;
      const nS=gr.values.length;
      if(cfg.stacked){
        let up=0,dn=0;
        gr.values.forEach((v,si)=>{
          if(!v)return;const col=cfg.series[si].color;
          let yA,hA;
          if(v>0){yA=y(up+v);hA=y(up)-y(up+v);up+=v}else{yA=y(dn);hA=y(dn+v)-y(dn);dn+=v}
          g+=`<rect class="anim" x="${x0(i)+bw*0.12}" y="${yA}" width="${bw*0.76}" height="${Math.max(0.5,hA)}" fill="${col}" opacity="0.85" data-tip="${esc(gr.label+'\n'+cfg.series[si].name+': '+fmt(v))}"/>`;
        });
      }else{
        const sw=bw*0.76/nS;
        gr.values.forEach((v,si)=>{
          const col=cfg.series[si].color,yy=Math.min(y(0),y(v)),hh=Math.abs(y(v)-y(0));
          g+=`<rect class="anim" x="${x0(i)+bw*0.12+si*sw}" y="${yy}" width="${sw*0.9}" height="${Math.max(0.5,hh)}" fill="${col}" opacity="0.9" data-tip="${esc(gr.label+'\n'+cfg.series[si].name+': '+fmt(v))}"/>`;
        });
      }
    });
    if(min<0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#3a3a3a"/>`;
    if(cfg.line){
      const yr=v=>P.t+(1-v/100)*(H-P.t-P.b);
      const pts=cfg.line.data.map((v,i)=>v==null?null:[x0(i)+bw/2,yr(clamp(v,-10,100))]).filter(Boolean);
      if(pts.length)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${cfg.line.color}" stroke-width="2" stroke-dasharray="4 3"/>`;
      cfg.line.data.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${x0(i)+bw/2}" cy="${yr(clamp(v,-10,100))}" r="6" fill="transparent" data-tip="${esc(groups[i].label+'\n'+cfg.line.name+': '+v.toFixed(1)+'%')}"/><circle cx="${x0(i)+bw/2}" cy="${yr(clamp(v,-10,100))}" r="2" fill="${cfg.line.color}"/>`});
      for(const p of [0,25,50,75,100])g+=`<text x="${W-P.r+6}" y="${yr(p)+3.5}" fill="#555" font-size="9" font-family="var(--mono)">${p}%</text>`;
    }
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series.concat(cfg.line?[cfg.line]:[])):'');
  },
  /* Donut: cfg{items:[{name,value,color}],size,centerLabel,centerValue} */
  donut(el,cfg){
    const items=(cfg.items||[]).filter(i=>i.value>0);
    if(!items.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    const size=cfg.size||190,R=size/2-6,r=R*0.62,cx=size/2,cy=size/2,total=sum(items.map(i=>i.value));
    let a0=-Math.PI/2,g=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="fade" style="flex:none">`;
    for(const it of items){
      const frac=it.value/total,a1=a0+frac*Math.PI*2;
      const large=frac>0.5?1:0;
      const p=(ang,rad)=>[cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad];
      const [x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);
      g+=`<path class="anim" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r} ${r} 0 ${large} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${it.color}" opacity="0.88" stroke="#0d0d0d" stroke-width="1.5" data-tip="${esc(it.name+'\n'+fmt(it.value)+' ('+(frac*100).toFixed(1)+'%)')}"/>`;
      a0=a1;
    }
    if(cfg.centerLabel)g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#9a9a9a" font-size="9" font-family="Rajdhani,'Segoe UI'" letter-spacing="2" text-transform="uppercase">${esc(cfg.centerLabel)}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" fill="#e5e5e5" font-size="13" font-weight="700" font-family="var(--mono)">${esc(cfg.centerValue||'')}</text>`;
    g+='</svg>';
    const leg='<div>'+items.map(it=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;font-family:var(--mono);font-size:12.5px"><span class="sw" style="width:10px;height:10px;border-radius:2px;background:${it.color};flex:none"></span><span style="color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</span><span style="margin-left:auto">${fmt0(it.value)}</span></div>`).join('')+'</div>';
    el.innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${g}<div style="flex:1;min-width:170px">${leg}</div></div>`;
  },
  spark(points,w=110,h=30,color){
    if(!points||!points.length)return`<svg width="${w}" height="${h}" class="spark"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="#2a2a2a"/></svg>`;
    if(points.length===1)return`<svg width="${w}" height="${h}" class="spark"><line x1="1" x2="${w-1}" y1="${h/2}" y2="${h/2}" stroke="${color||CONFIG.colors.or}" stroke-width="1.5"/><circle cx="${w-3}" cy="${h/2}" r="2.5" fill="${color||CONFIG.colors.or}"/></svg>`;
    const min=Math.min(...points),max=Math.max(...points);
    const x=i=>(i/(points.length-1))*(w-2)+1;
    const y=v=>1+(1-(v-min)/(max-min||1))*(h-2);
    const d=points.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    return`<svg width="${w}" height="${h}" class="spark"><path d="${d}" fill="none" stroke="${color||CONFIG.colors.or}" stroke-width="1.5"/></svg>`;
  },
  ring(pctv,size=74,color){
    const R=size/2-6,c=2*Math.PI*R,off=c*(1-clamp(pctv,0,1));
    return`<svg width="${size}" height="${size}" class="fade"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#232323" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color||CONFIG.colors.or}" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/><text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" fill="#e5e5e5" font-size="${size/5.2}" font-weight="700" font-family="var(--mono)">${Math.round(pctv*100)}%</text></svg>`;
  },
  /* Heat map: daily spend intensity. cfg{days:{iso:cents},from,to} */
  heat(el,cfg){
    const from=cfg.from,to=cfg.to,vals=Object.values(cfg.days);
    const max=Math.max(1,...vals);
    const cell=13,gap=3;
    const start=addDays(from,-((new Date(from+'T00:00:00').getDay()+6)%7)); // back to Monday
    const totalDays=daysBetween(start,to)+1,weeks=Math.ceil(totalDays/7);
    const W=Math.min(Math.max(el.clientWidth||600,300),weeks*(cell+gap)+60),H=7*(cell+gap)+34;
    let g=`<svg viewBox="0 0 ${weeks*(cell+gap)+46} ${H}" width="100%" height="${H}" class="fade" preserveAspectRatio="xMinYMin">`;
    const dows=['M','T','W','T','F','S','S'];
    dows.forEach((d,i)=>g+=`<text x="8" y="${22+i*(cell+gap)+cell-3}" fill="#555" font-size="8.5" font-family="var(--mono)">${d}</text>`);
    let lastM='';
    for(let i=0;i<weeks*7;i++){
      const d=addDays(start,i);
      if(d>to)break;
      const wk=Math.floor(i/7),dow=i%7;
      const mk=d.slice(5,7);
      if(dow===0&&mk!==lastM){lastM=mk;g+=`<text x="${20+wk*(cell+gap)}" y="12" fill="#666" font-size="8.5" font-family="var(--mono)">${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+mk-1]}</text>`}
      if(d<from){g+=`<rect x="${20+wk*(cell+gap)}" y="${18+dow*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="#141414"/>`;continue}
      const v=cfg.days[d]||0,t=v/max;
      const col=v===0?'#1a1a1a':`rgba(249,115,22,${(0.15+t*0.85).toFixed(2)})`;
      g+=`<rect x="${20+wk*(cell+gap)}" y="${18+dow*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${col}" data-tip="${esc(fmtD(d)+'\n'+fmt(v))}"/>`;
    }
    el.innerHTML=g+'</svg>';
  }
};

const MODAL={
  _resolve:null,_prevFocus:null,
  open({title,body,footer,wide,onMount}){
    MODAL._prevFocus=document.activeElement;
    const layer=$('#modal-layer');
    layer.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
      <div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-action="modal-close" aria-label="Close">&times;</button></div>
      <div class="modal-b">${body}</div>
      ${footer!==false?`<div class="modal-f">${footer||'<button class="btn" data-action="modal-close">Cancel</button>'}</div>`:''}
    </div>`;
    layer.classList.add('open');
    const first=$('.modal-b input,.modal-b select,.modal-b textarea,.modal-b button',layer);
    if(first)setTimeout(()=>first.focus(),30);
    if(onMount)onMount(layer);
  },
  close(){
    $('#modal-layer').classList.remove('open');$('#modal-layer').innerHTML='';
    if(MODAL._resolve){MODAL._resolve(false);MODAL._resolve=null}
    if(MODAL._prevFocus&&MODAL._prevFocus.focus)MODAL._prevFocus.focus();
  },
  confirm(title,msg,{danger=false,okLabel='Confirm',typed=null}={}){
    return new Promise(res=>{
      MODAL._resolve=res;
      MODAL.open({title,
        body:`<p style="color:var(--tx2);line-height:1.6">${msg}</p>${typed?`<label class="f" style="margin-top:14px"><span class="fl">Type "${esc(typed)}" to confirm</span><input id="typed-confirm" autocomplete="off"></label>`:''}`,
        footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="confirm-ok" data-action="modal-confirm" ${typed?'disabled':''}>${esc(okLabel)}</button>`,
        onMount(layer){
          if(typed)$('#typed-confirm',layer).addEventListener('input',e=>{$('#confirm-ok',layer).disabled=e.target.value.trim()!==typed});
        }
      });
    });
  }
};
function modalFormValues(){
  const out={};
  $$('#modal-layer [name]').forEach(el=>{
    if(el.type==='checkbox')out[el.name]=el.checked;
    else out[el.name]=el.value;
  });
  return out;
}

/* ---- printable bills register ----
   Self-contained light-theme page: summary strip, register grouped the way the
   Bills view is currently grouped, category totals, next 30 days. Opens in a
   new tab so the browser's Print / Save as PDF does the rest. */
function billsReportHtml(){
  const s=ENGINE.billsSummary();
  const act=state.bills.filter(b=>b.active!==false);
  const incWk=Math.round(ENGINE.incomeMonthly()*12/52);
  const ps=incWk?ENGINE.paySplit():null;
  const wk=v=>Math.round(v*12/52);
  const freqName=billFreqLabel;
  const gKey=b=>{const c=byId(state.categories,b.categoryId);switch(ui.billGroup){case 'category':return c?c.name:'Uncategorised';case 'frequency':return freqName(b);case 'method':return b.method||'No method';case 'account':return b.accountId?acctName(b.accountId):'No account';case 'transfer':return b.inTransfer===false?'Not in weekly transfer':'In weekly transfer';case 'none':return '';default:return c?c.group:'Uncategorised'}};
  const groups=new Map();for(const b of act.slice().sort((a,b)=>ENGINE.billWeekly(b)-ENGINE.billWeekly(a))){const k=gKey(b);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(b)}
  const gsorted=[...groups.entries()].sort((a,b)=>sum(b[1].map(ENGINE.billWeekly))-sum(a[1].map(ENGINE.billWeekly)));
  const byCat={};for(const b of act){const k=b.categoryId?catShort(b.categoryId):'Uncategorised';byCat[k]=(byCat[k]||0)+ENGINE.billAnnual(b)}
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const upcoming=ENGINE.upcomingBills(30);
  const m=(v)=>fmt(Math.round(v));
  const tile=(l,v,sub)=>`<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div>${sub?`<div class="ts">${sub}</div>`:''}</div>`;
  let body=`<h1>Bills Register</h1><div class="sub">Prepared ${fmtD(todayISO())} &middot; ${act.length} active bill${act.length===1?'':'s'}${s.excluded?` &middot; ${s.excluded} paid outside the transfer`:''}</div>
  <div class="tiles">
    ${tile('Weekly transfer',m(s.final),s.buffer||state.settings.billsRound?`base ${m(s.weekly)}${s.buffer?` + ${state.settings.billsBuffer}% buffer`:''}${state.settings.billsRound?` &middot; rounded to $${state.settings.billsRound}s`:''}`:'')}
    ${tile('Fortnightly',m(s.fortnightly))}${tile('Monthly',m(s.monthly))}${tile('Annual bills',fmt0(s.annual))}
    ${incWk?tile('Income per week',fmt(incWk),`leaves ${fmtS(incWk-Math.round(s.final))} after the transfer`):''}
  </div>
  <h2>Register${ui.billGroup!=='none'?` <span class="dim">grouped by ${({catgroup:'category group',category:'category',frequency:'frequency',method:'payment method',account:'account',transfer:'transfer'})[ui.billGroup]||'category group'}</span>`:''}</h2>
  <table><thead><tr><th>Bill</th><th>Frequency</th><th>Method</th><th>Last paid</th><th>Next due</th><th class="r">Amount</th><th class="r">Weekly</th><th class="r">Monthly</th><th class="r">Annual</th></tr></thead><tbody>`;
  for(const [g,bills] of gsorted){
    const gw=sum(bills.filter(b=>b.inTransfer!==false).map(ENGINE.billWeekly)),ga=sum(bills.map(ENGINE.billAnnual));
    if(g!=='')body+=`<tr class="g"><td colspan="6">${esc(g)} <span class="dim">${bills.length}</span></td><td class="r">${m(gw)}</td><td class="r">${m(ga/12)}</td><td class="r">${fmt0(ga)}</td></tr>`;
    for(const b of bills)body+=`<tr><td>${esc(b.name)}${b.kind==='living'?' <span class="tag">living</span>':''}${b.inTransfer===false?' <span class="tag">outside transfer</span>':''}</td><td class="mut">${esc(freqName(b))}</td><td class="mut">${esc(b.method||'')}</td><td class="mut">${(lp=>lp?fmtD(lp.date):'-')(ENGINE.billLastPaid(b))}</td><td class="mut">${fmtD(b.nextDue)}</td><td class="r">${fmt(b.amount)}</td><td class="r">${b.inTransfer===false?'-':m(ENGINE.billWeekly(b))}</td><td class="r">${m(ENGINE.billAnnual(b)/12)}</td><td class="r">${fmt0(ENGINE.billAnnual(b))}</td></tr>`;
  }
  body+=`<tr class="t"><td colspan="6">Total</td><td class="r">${m(s.weekly)}</td><td class="r">${m(s.annual/12)}</td><td class="r">${fmt0(s.annual)}</td></tr></tbody></table>`;
  body+=`<div class="two"><div><h2>Annual cost by category</h2><table><tbody>${cats.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${m(v/52)}/wk</td><td class="r">${m(v/12)}/mo</td><td class="r">${fmt0(v)}</td><td class="r mut">${(v/s.annual*100).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div>
  <div><h2>Next 30 days</h2>${upcoming.length?`<table><tbody>${upcoming.map(u=>`<tr><td>${esc(u.bill.name)}</td><td class="mut">${fmtD(u.bill.nextDue)}</td><td class="r">${fmt(u.bill.amount)}</td><td class="r mut">${u.days<0?`${-u.days}d overdue`:u.days===0?'today':`in ${u.days}d`}</td></tr>`).join('')}<tr class="t"><td colspan="2">Total due</td><td class="r">${fmt(sum(upcoming.map(u=>u.bill.amount)))}</td><td></td></tr></tbody></table>`:'<p class="mut">Nothing due.</p>'}</div></div>`;
  if(ps){

/* shared print shell for every page report: light theme, tiles, tables,

  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}table.half{max-width:520px}.foot{margin-top:26px;font-size:10.5px;color:#888;border-top:1px solid #ddd;padding-top:8px}

  </style></head><body><div class="bar"><button onclick="window.print()">Print / Save as PDF</button></div>${body}</body></html>`;
}

  },
  reports(){
    const r=ui.reportRange,ptx=personalTx().filter(t=>t.date>=r.from&&t.date<=r.to);
    const notTr=t=>{const c=byId(state.categories,t.categoryId);return !(c&&c.group==='Transfers')};
    const byGroup={},byCat={};let inc=0,exp=0;
    for(const t of ptx){if(!notTr(t))continue;if(t.amount>0){inc+=t.amount;continue}exp+=-t.amount;const c=byId(state.categories,t.categoryId);const g=c?c.group:'Uncategorised',cn=c?c.group+' > '+c.name:'Uncategorised';byGroup[g]=(byGroup[g]||0)-t.amount;byCat[cn]=(byCat[cn]||0)-t.amount}
    const months=[];for(let d=monthKey(r.from);d<=monthKey(r.to);d=monthKey(addMonths(d+'-01',1)))months.push(d);
    let b=RPT.head('Spending Report',`${fmtD(r.from)} to ${fmtD(r.to)} &middot; ${ptx.length} transactions &middot; transfers excluded`);
    const nMo=Math.max(1,months.length);
    b+=`<div class="tiles">${RPT.tile('Income',fmt0(inc),fmt0(inc/nMo)+'/mo avg')}${RPT.tile('Spending',fmt0(exp),fmt0(exp/nMo)+'/mo avg')}${RPT.tile('Net',fmtS(inc-exp))}${RPT.tile('Savings rate',inc?Math.round((inc-exp)/inc*100)+'%':'-')}</div>`;
    b+='<h2>Spending by group</h2>'+RPT.table([{h:'Group',k:'g'},{h:'Total',k:'t',r:1},{h:'Per month',k:'m',r:1},{h:'Share',k:'p',r:1,mut:1}],Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).map(([g,v])=>({g:esc(g),t:fmt0(v),m:fmt0(v/nMo),p:exp?Math.round(v/exp*100)+'%':''})),{g:'Total',t:fmt0(exp),m:fmt0(exp/nMo)});
    b+='<h2>Income vs expenses by month</h2>'+RPT.table([{h:'Month',k:'m',mut:1},{h:'Income',k:'i',r:1},{h:'Expenses',k:'e',r:1},{h:'Net',k:'n',r:1}],months.map(mk=>{const i=sum(ptx.filter(t=>monthKey(t.date)===mk&&t.amount>0&&notTr(t)).map(t=>t.amount)),e=sum(ptx.filter(t=>monthKey(t.date)===mk&&t.amount<0&&notTr(t)).map(t=>-t.amount));return{m:fmtMY(mk+'-01'),i:fmt0(i),e:fmt0(e),n:`<span class="${i-e>=0?'pos':'neg'}">${fmtS(i-e)}</span>`}}));
    b+='<h2>Top categories</h2>'+RPT.table([{h:'Category',k:'c'},{h:'Total',k:'t',r:1},{h:'Per month',k:'m',r:1}],Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([c,v])=>({c:esc(c),t:fmt0(v),m:fmt0(v/nMo)})));
    return reportShell('Spending Report',b+RPT.foot());
  },
  review(){
    const hc=ENGINE.healthCheck();
    let b=RPT.head('Health Check',`${hc.length} finding${hc.length===1?'':'s'}`);
    b+=hc.length?RPT.table([{h:'',k:'s',mut:1},{h:'Area',k:'a',mut:1},{h:'Finding',k:'f'}],hc.map(i=>({s:i.sev==='high'?'FIX':i.sev==='med'?'CHECK':'TIDY',a:esc(i.area),f:`<div class="wrap"><b>${esc(i.title)}</b><div class="mut">${i.detail}</div></div>`}))):'<p class="pos">Nothing to flag.</p>';
    if(ui.reviewText)b+='<h2>Claude\'s review</h2><div class="wrap" style="white-space:pre-wrap">'+esc(ui.reviewText)+'</div>';
    return reportShell('Health Check',b+RPT.foot());
  },
  bills(){return billsReportHtml()}
};
function dueBadge(days){
  if(days<0)return`<span class="badge rd">OVERDUE ${-days}d</span>`;
  if(days===0)return`<span class="badge rd">DUE TODAY</span>`;
  if(days<=7)return`<span class="badge am">DUE IN ${days}d</span>`;
  return`<span class="badge">DUE IN ${days}d</span>`;
}
function statCard(label,value,cls,sub){return`<div class="card"><div class="sec-label">${label}</div><div class="num big ${cls||''}" style="margin-top:6px">${value}</div>${sub?`<div class="dim" style="font-size:12px;margin-top:4px;font-family:var(--mono)">${sub}</div>`:''}</div>`}

VIEWS.dashboard=()=>{

/* ---------------- ACCOUNTS ---------------- */
function acctCmp(a,b){
  const k=ui.acctSort;
  if(k==='balance')return b.balance-a.balance;
  const last=(x,y)=>(!x&&y)?1:(x&&!y)?-1:0; // empties sort last
  if(k==='institution')return last(a.institution,b.institution)||(a.institution||'').localeCompare(b.institution||'')||a.name.localeCompare(b.name);
  if(k==='type')return acctType(a).n.localeCompare(acctType(b).n)||a.name.localeCompare(b.name);
  if(k==='group')return last(a.group,b.group)||(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name);
  return a.name.localeCompare(b.name);
}

/* ---------------- TRANSACTIONS ---------------- */
function txFiltered(){
  const f=ui.txFilter;
  const pin=f.ids?new Set(f.ids):null;
  let list=state.transactions.filter(t=>
    (!pin||pin.has(t.id))&&
    (!f.household||!isExcludedTx(t))&&
    (!(f.exclude&&f.exclude.length)||!f.exclude.includes(t.accountId))&&
    (!f.account||t.accountId===f.account)&&
    (!f.category||t.categoryId===f.category)&&
    (!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&
    (!f.tag||(t.tags||[]).some(tg=>tg.toLowerCase()===f.tag.toLowerCase()))&&
    (!f.q||(t.payee+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(f.q.toLowerCase()))
  );
  const k=ui.txSort.key,dir=ui.txSort.dir;
  list.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(k==='amount'){va=a.amount;vb=b.amount}
    if(k==='category'){va=catShort(a.categoryId);vb=catShort(b.categoryId)}

    if(va<vb)return -dir; if(va>vb)return dir;
    return a.id<b.id?-dir:dir;
  });
  return list;
}

/* ---- suggest allowances ----
   Looks at what each pot actually spends per category over 3 months, asks
   Claude (with the key) to shape that into a short list of allowances and to
   set aside one-offs; without a key, proposes one allowance per pot at its
   average. Nothing is created until the user ticks and confirms. */
function livingSpendProfile(){
  const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
  const since=monthKey(addMonths(todayISO(),-3)),upto=monthKey(addMonths(todayISO(),-1));
  const out=[];
  for(const pid of ENGINE.livingPotIds()){
    const a=byId(state.accounts,pid);if(!a)continue;
    const cats={};
    for(const t of state.transactions){
      if(t.accountId!==pid||t.amount>=0)continue;const mk=monthKey(t.date);if(mk<since||mk>upto)continue;
      const c=byId(state.categories,t.categoryId);if(c&&(c.group==='Income'||c.group==='Transfers'||billCats.has(t.categoryId)))continue;
      const k=c?c.group+' > '+c.name:'Uncategorised';const o=cats[k]=cats[k]||{total:0,count:0,max:0,months:new Set(),txIds:[]};
      o.total+=-t.amount;o.count++;o.max=Math.max(o.max,-t.amount);o.months.add(mk);o.txIds.push(t.id);
    }
    out.push({accountId:pid,account:a.name,categories:Object.entries(cats).map(([k,o])=>({category:k,perMonth:Math.round(o.total/3),perWeek:Math.round(o.total/3*12/52),count:o.count,largest:o.max,monthsSeen:o.months.size})).sort((x,y)=>y.perMonth-x.perMonth)});
  }
  return out;
}
function livingSuggestFallback(profile){
  // one allowance per category, the way bills are listed one per bill
  const out=[];
  for(const p of profile)for(const c of p.categories){
    if(c.category==='Uncategorised')continue;
    const name=c.category.split(' > ').pop();
    const oneOff=c.monthsSeen<=1||(c.count<=2&&c.largest>c.perMonth*3*0.6);
    const cat=state.categories.find(x=>x.group+' > '+x.name===c.category);
    out.push({name,categoryId:cat?cat.id:'',accountId:state.settings.spendsAccountId||p.accountId,weekly:Math.ceil(c.perWeek/500)*500,categories:[name],note:oneOff?`Seen in ${c.monthsSeen} of 3 months${c.count<=2?', '+c.count+' transaction'+(c.count===1?'':'s'):''} - looks like a one-off`:`${fmt(c.perMonth)}/mo average over 3 months on ${p.account}, ${c.count} transactions`,oneOff});
  }
  // merge duplicates across pots (same category on two accounts)
  const byName={};for(const o of out){if(byName[o.name]){byName[o.name].weekly+=o.weekly;byName[o.name].note+='; also on another pot'}else byName[o.name]=o}
  return Object.values(byName).sort((a,b)=>b.weekly-a.weekly);
}

Propose ONE allowance PER CATEGORY, listed the way a bills register lists one line per bill: name = the category name, weekly amount from the 3-month average rounded up to the nearest $5, and a one-sentence note. Mark a category oneOff:true when it looks like a one-off rather than a living pattern (seen in only one of the three months, or dominated by a single large transaction such as a car service or a big purchase) - still list it, with the reason, so the user can decide. Merge the same category appearing on two accounts into one line. Skip Uncategorised.

${JSON.stringify(profile)}`;

function livingBudgetCard(billCats){
  const mk=monthKey(todayISO()),budget=state.budgets[mk]||{},act=ENGINE.monthActualsSmoothed(mk);
  const rows=[];let bT=0,aT=0;
  for(const c of state.categories){
    if(['Income','Transfers'].includes(c.group)||billCats.has(c.id))continue;
    const bv=budget[c.id]||0,av=Math.max(0,-(act[c.id]||0));
    if(!bv&&!av)continue;bT+=bv;aT+=av;rows.push({c,bv,av});
  }
  rows.sort((x,y)=>(y.bv||y.av)-(x.bv||x.av));
  const la=ENGINE.livingAllowanceMonthly();
  const dayFrac=clamp(parseInt(todayISO().slice(8))/parseInt(new Date(new Date(mk+'-01').getFullYear(),new Date(mk+'-01').getMonth()+1,0).getDate().toString()),0,1);
  let h=`<div class="card" style="margin-bottom:14px"><h3>Living budget <span class="r dim" style="font-family:var(--mono);font-size:11px">${fmtMY(mk+'-01').toUpperCase()} &middot; ${Math.round(dayFrac*100)}% THROUGH</span></h3>
    <p class="dim" style="font-size:12px;line-height:1.6;margin-bottom:8px">The envelopes your allowances have to cover: every budget category that is not backed by a bill. Budget figures come from the Budget page${bT&&la?`; this month's living budget is <b class="num" style="color:var(--tx)">${fmt(bT)}</b> against <b class="num" style="color:var(--tx)">${fmt(la)}</b> of allowances${bT>la?` - <span style="color:var(--am)">${fmt(bT-la)} short</span>`:` - ${fmt(la-bT)} spare`}`:''}.</p>`;
  if(!rows.length)return h+`<p class="dim" style="font-size:12.5px">Nothing budgeted or spent in living categories this month. Set figures on the Budget page and they show here.</p><div class="pill-row" style="margin-top:8px"><button class="btn sm" data-action="nav" data-view="budget">Open Budget &rarr;</button></div></div>`;
  h+='<table class="compact"><thead><tr><th>Category</th><th class="r">Budget</th><th class="r">Spent</th><th class="r">Left</th><th style="width:34%"></th></tr></thead><tbody>';
  for(const {c,bv,av} of rows){
    const p=bv?av/bv:(av?1.01:0);const cls=p>1?'over':p>dayFrac+0.1?'warn':'';
    h+=`<tr><td>${esc(c.name)}<div class="dim" style="font-size:10.5px">${esc(c.group)}</div></td><td class="r num">${bv?fmt(bv):'<span class="dim">\u2014</span>'}</td><td class="r num"><span class="linkish" data-action="budget-drill" data-cat="${c.id}" data-cyc="1">${fmt(av)}</span></td><td class="r num" style="color:${bv?(bv-av>=0?'var(--gn)':'var(--rd)'):'var(--tx3)'}">${bv?fmtS(bv-av):''}</td><td><div class="pbar"><div class="${cls}" style="width:${clamp(p*100,0,100)}%"></div></div></td></tr>`;
  }
  h+=`<tr class="tot"><td>Total</td><td class="r num">${fmt(bT)}</td><td class="r num">${fmt(aT)}</td><td class="r num" style="color:${bT-aT>=0?'var(--gn)':'var(--rd)'}">${fmtS(bT-aT)}</td><td><div class="pbar"><div class="${aT>bT?'over':''}" style="width:${clamp(bT?aT/bT*100:0,0,100)}%"></div></div></td></tr></tbody></table>
    <div class="pill-row" style="margin-top:10px"><button class="btn sm" data-action="nav" data-view="budget">Edit budget &rarr;</button></div></div>`;
  return h;
}

  const cmp={weekly:(a,b)=>ENGINE.billWeekly(b)-ENGINE.billWeekly(a),
