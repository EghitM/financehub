    <label class="f"><span class="fl">Bills account</span><select data-change="bills-account" style="max-width:280px">${acctOptions(state.settings.billsAccountId)}</select></label>
    <p class="dim" style="font-size:12px;margin-bottom:10px">App build <span class="num">${BUILD}</span> - if a device shows an older build, force-reload it (close it from the app switcher and reopen, or pull down to refresh in Safari).</p>
    <label class="f"><span class="fl">Text size</span><select data-change="text-scale" style="max-width:180px">${[[100,'Normal'],[110,'Large'],[125,'Extra large'],[140,'Maximum']].map(([v,n])=>`<option value="${v}" ${(state.settings.textScale||100)===v?'selected':''}>${n}</option>`).join('')}</select></label>
  </div>`;
  h+=`<div class="card"><h3>AI Categorisation</h3>
    <p class="dim" style="font-size:12.5px;margin-bottom:12px;line-height:1.6">Paste an Anthropic API key to auto-categorise transactions with Claude. The key is stored only in this browser's IndexedDB and is sent only to api.anthropic.com. Get a key at console.anthropic.com.</p>
    <label class="f"><span class="fl">Anthropic API key</span><input type="password" name="apikey" value="${esc(state.settings.apiKey||'')}" placeholder="sk-ant-..." data-change="set-apikey" autocomplete="off" spellcheck="false"></label>
    <div class="pill-row" style="margin-top:6px"><button class="btn sm" data-action="ai-test" ${state.settings.apiKey?'':'disabled'}>Test key</button><span class="dim" style="font-size:12px;align-self:center">${state.settings.apiKey?'Key saved - use "AI categorise" in Transactions':'No key saved'}</span></div>
  </div>`;
  const bdue=BACKUP.due(),lastF=BACKUP.last('file'),lastC=BACKUP.last('cloud');
  const fmtSize=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
  h+=`<div class="card"><h3>Backup &amp; Restore ${bdue.due&&!bdue.snoozed?'<span class="badge am">DUE</span>':''}</h3>
    <p class="dim" style="font-size:12px;margin-bottom:12px;line-height:1.6">All data lives in this browser's IndexedDB. A JSON backup contains everything (accounts, transactions, bills, budgets, debts, scenarios, goals, history) with API keys and tokens stripped. Gist sync is a mirror, not a backup - a bad edit syncs everywhere - so keep a file copy on your own disk or drive. Cloud copies go to a separate private gist in your GitHub account${state.settings.backupGistId?` (<span class="num" style="user-select:all">${esc(state.settings.backupGistId)}</span>)`:''}.</p>
    <div class="grid g3" style="margin-bottom:12px">
      ${statCard('Last file backup',lastF?fmtD(lastF.date):'never',lastF&&!bdue.due?'pos':'neg',lastF?`${bdue.days} day${bdue.days===1?'':'s'} ago &middot; ${fmtSize(lastF.size)}`:'save one now')}
      ${statCard('Last cloud copy',lastC?fmtD(lastC.date):(SYNC.enabled()?'not yet':'sync off'),lastC?'pos':'',lastC?`${esc(lastC.name||'')}`:(SYNC.enabled()?'writes on first open each month':'connect sync below to enable'))}
      ${statCard('Reminder',{off:'Off',weekly:'Weekly',monthly:'Monthly'}[bdue.cad||'monthly'],'',bdue.snoozed?'snoozed until '+fmtD(state.settings.backupSnooze):'banner shows when a file backup is due')}
    </div>
    <div class="frow" style="margin-bottom:10px">
      <label class="f"><span class="fl">Remind me to save a file backup</span><select data-change="backup-cadence">${[['monthly','Every month'],['weekly','Every week'],['off','Never']].map(([v,l])=>`<option value="${v}" ${(state.settings.backupCadence||'monthly')===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="fl">Cloud copies to keep (months)</span><input type="number" min="1" max="60" data-change="backup-cloudkeep" value="${state.settings.cloudKeep||12}" ${SYNC.enabled()?'':'disabled'}></label>
      <label class="f" style="align-self:end"><span class="chk"><input type="checkbox" data-change="backup-cloudarchive" ${state.settings.cloudArchive!==false?'checked':''} ${SYNC.enabled()?'':'disabled'}> Automatic monthly copy into the sync gist</span></label>
    </div>
    <div class="pill-row">
      <button class="btn primary" data-action="backup-export">Save file backup now</button>
      ${SYNC.enabled()?`<button class="btn" data-action="backup-cloud-now">Save cloud copy now</button><button class="btn" data-action="backup-cloud-list">${ui.cloudBackups?'Refresh cloud copies':'Show cloud copies'}</button>`:''}
      <button class="btn" data-action="backup-import">Import / restore JSON</button>
      <button class="btn" data-action="all-tx-csv">Download CSV of all transactions</button>
    </div>
    ${ui.cloudBackups?(ui.cloudBackups.length?`<table style="margin-top:12px"><thead><tr><th>Cloud copy</th><th class="r">Size</th><th></th></tr></thead><tbody>${ui.cloudBackups.map((f,i)=>`<tr><td class="num">${esc(f.stamp)}${/-manual/.test(f.name)?' <span class="badge">MANUAL</span>':''}</td><td class="r num">${fmtSize(f.size)}</td><td><span class="row-act"><button class="btn sm" data-action="backup-cloud-download" data-i="${i}">Download</button><button class="btn sm" data-action="backup-cloud-restore" data-i="${i}">Restore</button></span></td></tr>`).join('')}</tbody></table>`:`<p class="dim" style="font-size:12px;margin-top:10px">No cloud copies in the gist yet.</p>`):''}
    ${BACKUP.log().length?`<details style="margin-top:12px"><summary class="dim" style="font-size:12px;cursor:pointer">Backup history (${BACKUP.log().length})</summary><table style="margin-top:6px"><tbody>${BACKUP.log().slice().reverse().slice(0,12).map(b=>`<tr><td class="mut num">${fmtD(b.date)}</td><td>${b.mode==='cloud'?'<span class="badge bl">CLOUD</span>':'<span class="badge gn">FILE</span>'}</td><td class="dim num" style="font-size:11.5px">${esc(b.name||'')}</td><td class="r num">${fmtSize(b.size||0)}</td></tr>`).join('')}</tbody></table></details>`:''}
    </div>`;
  // sync
  const syncOn=SYNC.enabled();
  h+=`<div class="card"><h3>Sync Across Devices</h3>
    <p class="dim" style="font-size:12.5px;margin-bottom:12px;line-height:1.6">Syncs your data through a <b>private GitHub Gist</b> in your own account - open the app anywhere, it pulls the latest on open and pushes changes a few seconds after you make them. Tokens and API keys never leave each device.</p>
    ${syncOn
      ?`<p class="num" style="font-size:12.5px;margin-bottom:6px">Connected &middot; rev ${state.syncMeta?.rev||0}${state.syncMeta?.ts?` &middot; last push ${fmtD(state.syncMeta.ts.slice(0,10))}`:''}</p>
       <p style="font-size:12px;margin-bottom:10px"><span class="sec-label">Gist ID (needed on your other devices)</span><br><span class="num" style="user-select:all">${esc(state.settings.gistId)}</span> <button class="btn sm" data-action="sync-copy-id">Copy</button></p>
       <div class="pill-row"><button class="btn primary sm" data-action="sync-pair">Pair another device</button><button class="btn sm" data-action="sync-now">Sync now</button><button class="btn sm" data-action="sync-disconnect">Disconnect this device</button></div>`
      :`<label class="f"><span class="fl">GitHub token (fine-grained, Gist read/write only)</span><input type="password" id="sync-token" placeholder="github_pat_..." autocomplete="off" spellcheck="false" value="${esc(state.settings.ghToken||'')}"></label>
       <label class="f"><span class="fl">Existing sync gist ID (leave blank on your FIRST device)</span><input id="sync-gist" placeholder="Only when connecting a second device" autocomplete="off" spellcheck="false" value="${esc(state.settings.gistId||'')}"></label>
       <div class="pill-row" style="margin-top:6px"><button class="btn primary sm" data-action="sync-setup">Enable sync</button><button class="btn sm" data-action="sync-find">Find my sync gist</button></div>
       <p class="dim" style="font-size:11.5px;margin-top:8px">github.com &rarr; Settings &rarr; Developer settings &rarr; Fine-grained tokens &rarr; only permission needed: Gists (read and write). Lost the gist ID? Paste the token and use Find my sync gist. Easier still: on a device that is already connected, use Pair another device and scan the code with this one.</p>`}
  </div>`;
  // categories
  h+=`<div class="card"><h3>Categories <span class="r"><button class="btn sm" data-action="cat-add">+ Add</button></span></h3>
    <div style="max-height:340px;overflow:auto" class="csv-prev"><table><tbody>`;
  for(const [g,cats] of catGroups()){
    h+=`<tr><td style="background:#141414" colspan="2"><span class="sec-label">${esc(g)}</span></td></tr>`;
    for(const c of cats)h+=`<tr><td>${esc(c.name)}</td><td class="r"><span class="row-act"><button class="iconbtn" data-action="cat-edit" data-id="${c.id}">&#9998;</button><button class="iconbtn del" data-action="cat-del" data-id="${c.id}">&#10005;</button></span></td></tr>`;
  }
  h+=`</tbody></table></div></div>`;
  // rules
  h+=`<div class="card"><h3>Keyword Rules <span class="r"><button class="btn sm" data-action="rule-add">+ Add</button></span></h3>
    <p class="dim" style="font-size:12.5px;margin-bottom:10px">Applied on CSV import and manual entry: if the description contains the keyword, the category is set automatically.</p>`;
  if(!state.rules.length)h+='<p class="dim" style="font-size:12px">No rules yet - e.g. "WOOLWORTHS" &rarr; Groceries.</p>';
  else h+='<table><tbody>'+state.rules.map(rl=>`<tr><td class="num">"${esc(rl.keyword)}"</td><td class="mut">&rarr; ${esc(catName(rl.categoryId))}</td><td class="r"><span class="row-act"><button class="iconbtn" data-action="rule-edit" data-id="${rl.id}">&#9998;</button><button class="iconbtn del" data-action="rule-del" data-id="${rl.id}">&#10005;</button></span></td></tr>`).join('')+'</tbody></table>';
  h+=`<div style="margin-top:10px"><button class="btn sm" data-action="rules-apply">Apply rules to uncategorised</button></div></div>`;
  // demo + danger
  h+=`<div class="card"><h3>Sample Data</h3><p class="dim" style="font-size:12px;margin-bottom:12px;line-height:1.6">Populate realistic sample accounts, 12 months of transactions, bills, budgets, and 4 debts to explore every view. Merges with nothing - it replaces current data.</p>
    <button class="btn" data-action="load-sample">Load sample data</button></div>`;
  h+=`<div class="card" style="border-color:var(--rd)"><h3 style="color:var(--rd)">Danger Zone</h3>
    <p class="dim" style="font-size:12px;margin-bottom:12px">Wipe every account, transaction, bill, budget, debt, scenario, and goal from this browser. This cannot be undone.</p>
    <button class="btn danger" data-action="wipe-all">Wipe all data</button></div>`;
  return h+'</div>';
};

/* ================================================================
   SECTION: EVENTS - delegated actions
   ================================================================ */
function openForm(title,body,saveAction,{wide=false,saveLabel='Save',onMount}={}){
  MODAL.open({title,body,wide,footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="${saveAction}" data-default="1">${saveLabel}</button>`,onMount});
}
const ACTIONS={
  'nav':el=>{setView(el.dataset.view);if(window.innerWidth<760)ui.navCollapsed=true},
  'toggle-nav':()=>{ui.navCollapsed=!ui.navCollapsed;$('#sidebar').classList.toggle('collapsed',ui.navCollapsed)},
  'modal-close':()=>MODAL.close(),
  'modal-confirm':()=>{const r=MODAL._resolve;MODAL._resolve=null;MODAL.close();if(r)r(true)},
  'toggle-series':el=>{const s=CH.hiddenSet(el.dataset.chart);const i=+el.dataset.idx;s.has(i)?s.delete(i):s.add(i);render()},

  /* ---- accounts ---- */
  'account-add':()=>{ui.editing=null;openForm('Add Account',accountForm(),'account-save')},
  'account-edit':el=>{ui.editing=el.dataset.id;openForm('Edit Account',accountForm(byId(state.accounts,el.dataset.id)),'account-save')},
  'account-save':()=>{
    const v=modalFormValues();
    if(!v.name.trim())return toast('Account name is required');
    const t=CONFIG.accountTypes.find(x=>x.id===v.type);
    const bal=t&&!t.asset?-Math.abs(cents(v.balance)):cents(v.balance); // debts always stored negative
    if(ui.editing){
      const a=byId(state.accounts,ui.editing);
      const balChanged=a.balance!==bal;
      Object.assign(a,{name:v.name.trim(),institution:v.institution.trim(),group:(v.group||'').trim(),type:v.type,balance:bal,rate:pct(v.rate)||0,limit:cents(v.limit),color:v.color,archived:!!v.archived,noTx:!!v.noTx,excludeReports:!!v.excludeReports,purchasePrice:cents(v.purchasePrice),purchaseDate:v.purchaseDate||''});
      if(balChanged)pushBalanceHistory(a);
      if(a.archived&&!a.closedDate)a.closedDate=todayISO();
      if(!a.archived)delete a.closedDate;
    }else{
      state.accounts.push({id:uid(),name:v.name.trim(),institution:v.institution.trim(),group:(v.group||'').trim(),type:v.type,balance:bal,rate:pct(v.rate)||0,limit:cents(v.limit),color:v.color,archived:!!v.archived,noTx:!!v.noTx,excludeReports:!!v.excludeReports,purchasePrice:cents(v.purchasePrice),purchaseDate:v.purchaseDate||'',history:[{date:todayISO(),balance:bal}]});
    }
    reconcileDebtBalances();
    MODAL.close();save();render();toast('Account saved');
  },
  'toggle-archived-accounts':()=>{ui.showArchivedAccounts=!ui.showArchivedAccounts;render()},
  'account-archive':el=>{
    const a=byId(state.accounts,el.dataset.id);ui.editing=a.id;
    const d=state.debts.find(x=>x.linkedAccountId===a.id&&!x.closed);
    const ntx=state.transactions.filter(t=>t.accountId===a.id).length;
    const usedByBills=state.bills.filter(b=>b.active!==false&&b.accountId===a.id).length;
    openForm('Archive Account \u00B7 '+a.name,
      `<div class="frow"><label class="f"><span class="fl">Closed on</span><input type="date" name="closedDate" value="${todayISO()}"></label></div>
       ${a.balance!==0?`<p style="font-size:12.5px;line-height:1.6;color:var(--am);margin-bottom:10px">&#9888; Balance is <b class="num">${fmt(Math.abs(a.balance))}</b>. A closed account normally sits at zero - update it first if the last transfer out is not recorded yet, otherwise Net Worth changes by that amount when it leaves.</p>`:''}
       ${d?`<label class="chk" style="margin-bottom:10px"><input type="checkbox" name="closeLinked" checked> Also close the linked debt "${esc(d.name)}"</label>`:''}
       ${usedByBills?`<p style="font-size:12.5px;line-height:1.6;color:var(--am);margin-bottom:10px">&#9888; ${usedByBills} active bill${usedByBills>1?'s are':' is'} paid from this account - edit those bills to point at the new account.</p>`:''}
       <p class="dim" style="font-size:12px;line-height:1.7">What happens: the account and its ${ntx} transaction${ntx===1?'':'s'} are kept; it leaves Net Worth, Pay Split and the account dropdowns; the Transactions filter can still show it. Restore brings it back.</p>`,
      'account-archive-save',{saveLabel:'Archive'});
  },
  'account-archive-save':()=>{
    const a=byId(state.accounts,ui.editing);const v=modalFormValues();
    archiveAccount(a,{date:v.closedDate||todayISO(),closeLinked:!!v.closeLinked});
    MODAL.close();save();render();toast(`${a.name} archived`);
  },
  'account-restore':el=>{
    const a=byId(state.accounts,el.dataset.id);restoreAccount(a);
    save();render();toast(`${a.name} restored`);
  },
  'account-del':async el=>{
    const a=byId(state.accounts,el.dataset.id);
    if(await MODAL.confirm('Delete Account',`Delete <b>${esc(a.name)}</b>? Its transactions stay but lose their account link.`,{danger:true,okLabel:'Delete'})){
      state.accounts=state.accounts.filter(x=>x.id!==a.id);save();render();toast('Account deleted');
    }
  },
  'account-balance':el=>{
    ui.editing=el.dataset.id;const a=byId(state.accounts,el.dataset.id);
    openForm('Update Balance \u00B7 '+a.name,`<label class="f"><span class="fl">New balance $</span><input name="balance" value="${(a.balance/100).toFixed(2)}" inputmode="decimal"></label><p class="dim" style="font-size:12.5px">Each update is timestamped into the balance history feeding sparklines and Net Worth.</p>`,'balance-save',{saveLabel:'Update'});
  },
  'balance-save':()=>{
    const a=byId(state.accounts,ui.editing);const v=modalFormValues();
    a.balance=acctType(a).asset?cents(v.balance):-Math.abs(cents(v.balance));
    pushBalanceHistory(a);
    reconcileDebtBalances();
    MODAL.close();save();render();toast('Balance updated');
  },

  /* ---- transactions ---- */
  'tx-add':()=>{ui.editing=null;openForm('Add Transaction',txForm(),'tx-save')},
  'tx-edit':el=>{ui.editing=el.dataset.id;openForm('Edit Transaction',txForm(byId(state.transactions,el.dataset.id)),'tx-save')},
  'tx-save':()=>{
    const v=modalFormValues();
    if(!v.payee.trim())return toast('Payee is required');
    const rec={date:v.date||todayISO(),accountId:v.accountId,payee:v.payee.trim(),categoryId:v.categoryId||ENGINE.applyRules(v.payee),amount:cents(v.amount),notes:v.notes.trim(),debtId:v.debtId||'',billId:v.billId||'',tags:v.tags.split(',').map(s=>s.trim()).filter(Boolean)};
    rec.hash=txHash(rec.date,rec.amount,rec.payee);
    if(ui.editing)Object.assign(byId(state.transactions,ui.editing),rec);
    else state.transactions.push({id:uid(),...rec});
    ENGINE.autoAdvanceBills();
    MODAL.close();save();render();toast('Transaction saved');
  },
  'tx-del':async el=>{
    if(await MODAL.confirm('Delete Transaction','Delete this transaction?',{danger:true,okLabel:'Delete'})){
      state.transactions=state.transactions.filter(t=>t.id!==el.dataset.id);save();render();
    }
  },
  'tx-sort':el=>{const k=el.dataset.k;if(ui.txSort.key===k)ui.txSort.dir*=-1;else ui.txSort={key:k,dir:k==='date'?-1:1};render()},
  'tx-page':el=>{ui.txPage+=+el.dataset.d;render()},
  'tx-clear-filter':()=>{ui.txFilter={account:'',category:'',from:'',to:'',q:'',tag:''};ui.txPage=0;render()},
  'tx-tag':el=>{const t=el.dataset.tag;ui.txFilter.tag=(ui.txFilter.tag===t?'':t);ui.txPage=0;setView('transactions')},
  'tx-bulk-move':()=>{
    const ids=[...ui.txSel];const from=new Set(ids.map(id=>(byId(state.transactions,id)||{}).accountId));
    openForm(`Move ${ids.length} Transactions`,`<label class="f"><span class="fl">To account</span><select name="accountId">${acctOptions('')}</select></label>
      <p class="dim" style="font-size:12px;line-height:1.6">Currently on: ${[...from].map(id=>esc(acctName(id))).join(', ')||'\u2014'}. Categories, bill and debt links are kept. Use this when a statement went into the wrong account rather than deleting and re-importing.</p>`,'tx-bulk-move-save',{saveLabel:'Move'});
  },
  'tx-bulk-move-save':()=>{
    const v=modalFormValues();if(!v.accountId)return toast('Pick the account to move them to');
    const a=byId(state.accounts,v.accountId);let n=0;
    for(const t of state.transactions)if(ui.txSel.has(t.id)&&t.accountId!==v.accountId){t.accountId=v.accountId;n++}
    ui.txSel.clear();MODAL.close();save();render();toast(`Moved ${n} transactions to ${a?a.name:'account'}`);
  },
  'tx-bulk-del':async()=>{
    if(await MODAL.confirm('Delete Transactions',`Delete ${ui.txSel.size} selected transactions?`,{danger:true,okLabel:'Delete all'})){
      state.transactions=state.transactions.filter(t=>!ui.txSel.has(t.id));ui.txSel.clear();save();render();toast('Deleted');
    }
  },
  'tx-bulk-bill':()=>{
    if(!state.bills.length)return toast('No bills set up yet');
    openForm(`Link ${ui.txSel.size} Transactions to Bill`,`<label class="f"><span class="fl">Bill</span><select name="billId"><option value="">- unlink -</option>${state.bills.filter(b2=>b2.active!==false).map(b2=>`<option value="${b2.id}">${esc(b2.name)}</option>`).join('')}</select></label><p class="dim" style="font-size:12px">Payments landing within 3 days of each other count as ONE payment event - link both halves of a split payment (e.g. rego paid two ways) and they sum.</p>`,'tx-bulk-bill-save',{saveLabel:'Link'});
  },
  'tx-bulk-bill-save':()=>{
    const v=modalFormValues();
    for(const t of state.transactions)if(ui.txSel.has(t.id))t.billId=v.billId||'';
    ui.txSel.clear();MODAL.close();ENGINE.autoAdvanceBills();save();render();toast(v.billId?'Linked to '+byId(state.bills,v.billId).name:'Unlinked');
  },
  'tx-bulk-debt':()=>{
    if(!activeDebts().length)return toast('No debts set up yet');
    openForm(`Link ${ui.txSel.size} Transactions to Debt`,`<label class="f"><span class="fl">Debt</span><select name="debtId">${debtOptions('','- unlink -')}</select></label><p class="dim" style="font-size:12px">Linked transactions appear as repayment history on the debt, with actual vs minimum tracking.</p>`,'tx-bulk-debt-save',{saveLabel:'Link'});
  },
  'tx-bulk-debt-save':()=>{
    const v=modalFormValues();
    for(const t of state.transactions)if(ui.txSel.has(t.id))t.debtId=v.debtId||'';
    ui.txSel.clear();MODAL.close();save();render();toast(v.debtId?'Linked to '+byId(state.debts,v.debtId).name:'Unlinked');
  },
  'tx-bulk-cat':()=>{
    openForm(`Re-categorise ${ui.txSel.size} Transactions`,`<label class="f"><span class="fl">New category</span><select name="categoryId">${catOptions('')}</select></label>`,'tx-bulk-cat-save',{saveLabel:'Apply'});
  },
  'tx-bulk-cat-save':()=>{
    const v=modalFormValues();
    for(const t of state.transactions)if(ui.txSel.has(t.id))t.categoryId=v.categoryId;
    ui.txSel.clear();MODAL.close();save();render();toast('Re-categorised');
  },
  'tx-export':()=>{
    const list=txFiltered();
    const rows=[['Date','Account','Payee','Category','Amount','Notes','Tags']].concat(list.map(t=>[fmtD(t.date),acctName(t.accountId),t.payee,catName(t.categoryId),(t.amount/100).toFixed(2),t.notes||'',(t.tags||[]).join('; ')]));
    saveViaFS('financehub-transactions.csv',csvBuild(rows),'CSV file','.csv','text/csv');
  },

  /* ---- recurring ---- */
  'recur-manage':()=>{
    let body=`<div class="toolbar"><button class="btn sm primary" data-action="recur-add">+ Add template</button></div>`;
    if(!state.recurring.length)body+='<p class="dim">No recurring templates. Use them for salary, rent, subscriptions - preview upcoming and post with one click.</p>';
    else body+='<table><tbody>'+state.recurring.map(rc=>`<tr><td>${esc(rc.payee)}</td><td class="mut">${esc(rc.freq)}</td><td class="r">${fmtS(rc.amount)}</td><td class="mut">next ${fmtD(rc.nextDate)}</td><td class="r"><button class="btn sm" data-action="recur-post" data-id="${rc.id}" data-date="${rc.nextDate}">Post</button> <span class="row-act" style="opacity:1"><button class="iconbtn" data-action="recur-edit" data-id="${rc.id}">&#9998;</button><button class="iconbtn del" data-action="recur-del" data-id="${rc.id}">&#10005;</button></span></td></tr>`).join('')+'</tbody></table>';
    MODAL.open({title:'Recurring Transactions',body,wide:true});
  },
  'recur-add':()=>{ui.editing=null;openForm('Add Recurring Template',recurForm(),'recur-save')},
  'recur-edit':el=>{ui.editing=el.dataset.id;openForm('Edit Recurring Template',recurForm(byId(state.recurring,el.dataset.id)),'recur-save')},

  'tx-to-bill':el=>{
    const t=byId(state.transactions,el.dataset.id);if(!t)return;
    ui.editing=null;
    // stable keyword guess: leading alpha tokens of the payee, stripped of refs
    const kwGuess=t.payee.split(/[0-9*#]/)[0].trim().split(/\s+/).slice(0,3).join(' ').toUpperCase();
    openForm('Add Bill from Transaction',billForm({
      name:t.payee.split(/[0-9*#]/)[0].trim()||t.payee,
      categoryId:t.categoryId,amount:Math.abs(t.amount),freq:'monthly',
      nextDue:advanceBill(t.date,'monthly'),accountId:t.accountId,

  'bill-edit':el=>{ui.editing=el.dataset.id;openForm('Edit Bill',billForm(byId(state.bills,el.dataset.id)),'bill-save')},
  'bill-save':()=>{
    const v=modalFormValues();
    if(!v.name.trim())return toast('Bill name is required');
    const rec={name:v.name.trim(),categoryId:v.categoryId,amount:cents(v.amount),freq:v.freq,everyN:Math.max(1,parseInt(v.everyN)||1),nextDue:v.nextDue,accountId:v.accountId,method:v.method,notes:v.notes.trim(),matchKeyword:(v.matchKeyword||'').trim(),autoAdvance:!!v.autoAdvance,inTransfer:!!v.inTransfer,debtId:v.debtId||'',active:!!v.active};
    if(rec.freq==='schedule'){
      const prev=ui.editing?((byId(state.bills,ui.editing)||{}).schedule||[]):[];
      const lines=String(v.scheduleText||'').split('\n').map(l=>l.trim()).filter(Boolean);
      const sched=[];
      for(const l of lines){
        const m=l.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\s+\$?([\d,]+(?:\.\d{1,2})?)\s*(paid|x|\u2713)?$/i)||l.match(/^(\d{4})-(\d{2})-(\d{2})\s+\$?([\d,]+(?:\.\d{1,2})?)\s*(paid|x|\u2713)?$/i);
        if(!m)return toast('Could not read instalment line: "'+l+'" - use dd/mm/yyyy amount');
        const date=m[1].length===4?`${m[1]}-${m[2]}-${m[3]}`:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
        const amount=cents(m[4].replace(/,/g,''));
        const was=prev.find(p=>p.date===date&&p.amount===amount);
        sched.push({date,amount,paid:!!m[5]||!!(was&&was.paid)});
      }
      if(!sched.length)return toast('Add at least one instalment line');
      rec.schedule=sched;
    }
    if(ui.editing){const bb=byId(state.bills,ui.editing);Object.assign(bb,rec);if(rec.freq!=='schedule')delete bb.schedule;if(rec.active&&bb.cancelled){delete bb.cancelled;delete bb.cancelledDate}if(bb.freq==='schedule')ENGINE.scheduleSync(bb)}
    else{const nb={id:uid(),...rec};if(nb.freq==='schedule')ENGINE.scheduleSync(nb);state.bills.push(nb)}
    MODAL.close();save();render();toast('Bill saved - weekly transfer updated');
  },

    const alt=ENGINE.simulate(ENGINE.buildSimDebts(),opts);

    const debts=ENGINE.buildSimDebts();
    const head=['Month','Total payment','Total interest','Total remaining'];
    debts.forEach(d=>head.push(d.name+' payment',d.name+' interest',d.name+' balance'));
    const rows=[head];
    for(const m of sim.months){
      const r=[fmtMY(m.date),(m.payment/100).toFixed(2),(m.interest/100).toFixed(2),(m.total/100).toFixed(2)];
      m.perDebt.forEach(p=>r.push((p.payment/100).toFixed(2),(p.interest/100).toFixed(2),(p.balance/100).toFixed(2)));
      rows.push(r);
    }
    saveViaFS(`payoff-${sc.name.replace(/\W+/g,'-').toLowerCase()}.csv`,csvBuild(rows),'CSV file','.csv','text/csv');
  },

/* ---- CSV import wizard ---- */
function guessMapping(){
  const w=ui.wiz,head=w.rows[0].map(c=>String(c).toLowerCase());
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const d=find('date'),desc=find('desc','narra','payee','detail','transaction'),amt=find('amount','value'),db=find('debit','withdraw'),cr=find('credit','deposit');
  w.hasHeader=d>=0||desc>=0||amt>=0||db>=0;
  if(w.hasHeader){
    if(d>=0)w.map.date=d;
    if(desc>=0)w.map.desc=desc;else w.map.desc=Math.min(1,head.length-1);
    if(db>=0&&cr>=0){w.mode='dc';w.map.debit=db;w.map.credit=cr}
    else if(amt>=0){w.mode='single';w.map.amount=amt}
  }else sniffColumns(); // headerless exports (e.g. raw CommBank CSVData)
  const sample=(w.rows[w.hasHeader?1:0]||[])[w.map.date]||'';
  if(/^\d{4}-\d{2}-\d{2}/.test(sample))w.dateFmt='ISO';
}
/* Content-based mapping for headerless bank exports.
   Raw CommBank "CSVData" = [DD/MM/YYYY, signed amount, description, running balance]. */
function sniffColumns(){
  const w=ui.wiz,sample=w.rows.slice(0,25),cols=Math.max(...sample.map(r=>r.length));
  const isDate=v=>/^\s*(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}-\d{2}-\d{2})\s*$/.test(String(v));
  const isNum=v=>/^\s*[+-]?\$?[\d,]+(\.\d+)?\s*$/.test(String(v))&&String(v).trim()!=='';
  const stats=[];
  for(let i=0;i<cols;i++){
    let dates=0,nums=0,negs=0,plus=0,txtLen=0,n=0;
    for(const r of sample){
      const v=r[i];if(v==null||String(v).trim()==='')continue;n++;
      if(isDate(v))dates++;
      else if(isNum(v)){nums++;const s=String(v).trim();if(s.startsWith('-'))negs++;if(s.startsWith('+'))plus++}
      else txtLen+=String(v).length;
    }
    stats.push({i,dates,nums,negs,plus,txtLen,n});
  }
  const dc=stats.filter(s=>s.n&&s.dates===s.n).sort((a,b)=>a.i-b.i)[0];
  if(dc)w.map.date=dc.i;
  const tc=stats.filter(s=>s.i!==w.map.date).sort((a,b)=>b.txtLen-a.txtLen)[0];
  if(tc&&tc.txtLen>0)w.map.desc=tc.i;
  // amount = numeric column with signed movement; a uniformly "+"-prefixed or
  // sign-stable trailing column is treated as a running balance and skipped
  const numCols=stats.filter(s=>s.i!==w.map.date&&s.i!==w.map.desc&&s.n&&s.nums===s.n);
  if(numCols.length){
    const scored=numCols.map(s=>({...s,score:(s.negs>0&&s.negs<s.n?2:0)+(s.plus===s.n?-2:0)+(s.i<Math.max(...numCols.map(x=>x.i))?0.5:0)}));
    scored.sort((a,b)=>b.score-a.score||a.i-b.i);
    w.mode='single';w.map.amount=scored[0].i;
  }
}
function wizParseDate(s){
  s=String(s).trim();
  const f=ui.wiz.dateFmt;
  let m;
  if(f==='ISO'&&(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return`${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    const[dd,mm]=f==='MDY'?[b,a]:[a,b];
    if(mm<1||mm>12||dd<1||dd>31)return null;
    return`${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return`${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function wizDataRows(){return ui.wiz.rows.slice(ui.wiz.hasHeader?1:0)}
function wizParseRow(r){
  const w=ui.wiz;
  const date=wizParseDate(r[w.map.date]);
  const desc=String(r[w.map.desc]??'').trim();
  let amount=null;
  if(w.mode==='dc'){
    const db=cents(r[w.map.debit]),cr=cents(r[w.map.credit]);
    if(db)amount=-Math.abs(db);else if(cr)amount=Math.abs(cr);else amount=0;
  }else amount=cents(r[w.map.amount]);
  if(!date||!desc)return null;
  return{date,desc,amount};
}

  const w=ui.wiz;
  let h=`<div style="display:flex;gap:8px;margin-bottom:16px">${[1,2,3].map(s=>`<span class="badge ${w.step===s?'or':''}">${s}. ${['Upload','Map columns','Import'][s-1]}</span>`).join('')}</div>`;
  if(w.step===1){
    h+=`<p class="dim" style="font-size:12.5px;margin-bottom:12px;line-height:1.6">Upload a CSV exported from your bank. Next you'll map its columns, pick the date format, and choose the account. Duplicates (same date + amount + description) are skipped automatically, and your keyword rules categorise as they land.</p>
    <input type="file" accept=".csv,text/csv" data-change="wiz-file">
    <div class="modal-f" style="border:none;padding:14px 0 0"><button class="btn" data-action="modal-close">Cancel</button></div>`;
    return h;
  }
  const cols=Math.max(...w.rows.map(r=>r.length));
  const colOpts=sel=>{let o='';for(let i=0;i<cols;i++){const label=w.hasHeader?String(w.rows[0][i]??'col '+(i+1)):'Column '+(i+1);o+=`<option value="${i}" ${i===sel?'selected':''}>${esc(label)}</option>`}return o};
  if(w.step===2){
    h+=`<div class="frow3">
      <label class="f"><span class="fl">Account</span><select data-change="wiz-set" data-k="accountId">${acctOptions(w.accountId)}</select></label>
      <label class="f"><span class="fl">Date format</span><select data-change="wiz-set" data-k="dateFmt">${[['DMY','DD/MM/YYYY (AU)'],['MDY','MM/DD/YYYY'],['ISO','YYYY-MM-DD']].map(([v,n])=>`<option value="${v}" ${w.dateFmt===v?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f"><span class="fl">Amount layout</span><select data-change="wiz-set" data-k="mode"><option value="single" ${w.mode==='single'?'selected':''}>Single signed amount</option><option value="dc" ${w.mode==='dc'?'selected':''}>Debit + credit columns</option></select></label>
    </div>
    <div class="frow3" style="margin-bottom:6px">
      <label class="f"><span class="fl">Date column</span><select data-change="wiz-set" data-k="date">${colOpts(w.map.date)}</select></label>
      <label class="f"><span class="fl">Description column</span><select data-change="wiz-set" data-k="desc">${colOpts(w.map.desc)}</select></label>
      ${w.mode==='single'
        ?`<label class="f"><span class="fl">Amount column</span><select data-change="wiz-set" data-k="amount">${colOpts(w.map.amount)}</select></label>`
        :`<div class="frow" style="gap:8px"><label class="f"><span class="fl">Debit col</span><select data-change="wiz-set" data-k="debit">${colOpts(w.map.debit)}</select></label><label class="f"><span class="fl">Credit col</span><select data-change="wiz-set" data-k="credit">${colOpts(w.map.credit)}</select></label></div>`}
    </div>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" data-change="wiz-set" data-k="hasHeader" ${w.hasHeader?'checked':''}> First row is a header</label>`;
    const prev=wizDataRows().slice(0,6).map(wizParseRow);
    h+=`<div class="csv-prev"><table><thead><tr><th>Parsed date</th><th>Description</th><th class="r">Amount</th><th>Rule match</th></tr></thead><tbody>`+
      prev.map(p=>p?`<tr><td class="${p.date?'':'neg'}">${p.date?fmtD(p.date):'unreadable'}</td><td>${esc(p.desc)}</td><td class="r ${p.amount>=0?'pos':''}">${fmtS(p.amount)}</td><td class="mut">${(r=>r?esc(catShort(r)):'')(ENGINE.applyRules(p.desc))}</td></tr>`:`<tr><td colspan="4" class="neg">row unreadable with current mapping</td></tr>`).join('')+
      `</tbody></table></div>
    <div class="modal-f" style="border:none;padding:14px 0 0"><button class="btn" data-action="wiz-back">&larr; Back</button><span style="flex:1"></span><button class="btn primary" data-action="wiz-next" ${!w.accountId?'disabled title="Pick an account"':''}>Preview import &rarr;</button></div>`;
    return h;
  }
  // step 3 summary
  const parsed=wizDataRows().map(wizParseRow);
  const good=parsed.filter(Boolean);
  const existing=new Set(state.transactions.map(t=>t.hash));
  const hashFor=wizHashes();
  let dupes=0,add=0;
  for(const p of good){if(existing.has(hashFor(p)))dupes++;else add++}
  const ruled=good.filter(p=>ENGINE.applyRules(p.desc)).length;
  h+=`<div class="grid g4" style="margin-bottom:14px">
    ${statCard('Rows',String(parsed.length),'','in file')}
    ${statCard('Will import',String(add),'pos','new transactions')}
    ${statCard('Duplicates',String(dupes),dupes?'acc':'','skipped by hash')}
    ${statCard('Auto-categorised',String(ruled),'','via keyword rules')}
  </div>
  <p class="dim" style="font-size:12px">Importing into <b>${esc(acctName(w.accountId))}</b>. Unreadable rows: ${parsed.length-good.length}.</p>
  <div class="modal-f" style="border:none;padding:14px 0 0"><button class="btn" data-action="wiz-back">&larr; Back</button><span style="flex:1"></span><button class="btn primary" data-action="wiz-import" ${!add?'disabled':''}>Import ${add} transactions</button></div>`;
  return h;
}
/* Nth identical (date+amount+desc) row in one file gets a suffixed hash, so two
   genuine same-day identical transactions both import while re-importing the
   same file stays fully idempotent. */
function wizHashes(){
  const seen={};
  return p=>{
    const base=txHash(p.date,p.amount,p.desc);
    const n=seen[base]=(seen[base]||0)+1;
    return n===1?base:txHash(p.date,p.amount,p.desc+'#'+n);
  };
}
function wizImport(){
  const w=ui.wiz;
  const existing=new Set(state.transactions.map(t=>t.hash));
  const hashFor=wizHashes();
  let added=0,dupes=0,bad=0;
  for(const r of wizDataRows()){
    const p=wizParseRow(r);
    if(!p){bad++;continue}
    const hsh=hashFor(p);
    if(existing.has(hsh)){dupes++;continue}
    existing.add(hsh);
    state.transactions.push({id:uid(),date:p.date,accountId:w.accountId,payee:p.desc,categoryId:ENGINE.applyRules(p.desc),amount:p.amount,notes:'',tags:[],hash:hsh});
    added++;
  }
  return{added,dupes,bad};
}

/* ================================================================
   SECTION: CLOUD SYNC (private GitHub Gist, user's own token)
   ================================================================ */
const SYNC={
  dirty:false,timer:null,busy:false,
  FILE:'financehub.json',
  enabled(){return !!(state.settings.ghToken&&state.settings.gistId)},
  headers(){return{'Authorization':'Bearer '+state.settings.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'}},
  ind(txt,color){
    const el=$('#sync-ind');if(!el)return;
    if(!state.settings.ghToken){el.style.display='none';return}
    el.style.display='block';el.textContent=txt;el.style.color=color||'var(--tx3)';
  },
  device(){return (navigator.platform||'device')+''},
  payload(){
    // tokens never leave this device - each device keeps its own keys
    const s=JSON.parse(JSON.stringify(state));
    s.settings.ghToken='';s.settings.apiKey='';
    return JSON.stringify(s);
  },
  adopt(remote){
    const keep={ghToken:state.settings.ghToken,gistId:state.settings.gistId,apiKey:state.settings.apiKey};
    state=Object.assign(emptyState(),remote);
    state.settings=Object.assign(emptyState().settings,state.settings,keep);
    reconcileDebtBalances();
    SYNC.dirty=false;persist();
  },
  async create(){
    const res=await fetch('https://api.github.com/gists',{method:'POST',headers:SYNC.headers(),
      body:JSON.stringify({description:'FinanceHub sync data (private)',public:false,files:{[SYNC.FILE]:{content:(state.syncMeta={rev:1,ts:new Date().toISOString(),device:SYNC.device()},SYNC.payload())}}})});
    if(!res.ok)throw new Error('GitHub said '+res.status+(res.status===401?' - check the token has Gist read/write scope':''));
    const data=await res.json();
    state.settings.gistId=data.id;SYNC.dirty=false;persist();
    return data.id;
  },
  async fetchRemote(){
    const res=await fetch('https://api.github.com/gists/'+state.settings.gistId,{headers:SYNC.headers()});
    if(!res.ok)throw new Error('GitHub said '+res.status);
    const data=await res.json();
    const f=data.files[SYNC.FILE];
    if(!f)throw new Error('Sync file missing in gist');
    let content=f.content;
    if(f.truncated)content=await (await fetch(f.raw_url)).text();
    const remote=JSON.parse(content);
    SYNC._lastRemoteRev=Math.max(SYNC._lastRemoteRev||0,remote.syncMeta?.rev||0);
    return remote;
  },
  async pull({silent=true}={}){
    if(!SYNC.enabled()||SYNC.busy)return;
    SYNC.busy=true;SYNC.ind('syncing...','var(--am)');
    try{
      const remote=await SYNC.fetchRemote();
      const rrev=remote.syncMeta?.rev||0,lrev=state.syncMeta?.rev||0;
      if(rrev>lrev){
        if(SYNC.dirty){SYNC.busy=false;return SYNC.conflict(remote)}
        SYNC.adopt(remote);render();
        if(!silent)toast('Pulled latest from cloud ('+(remote.syncMeta?.device||'other device')+')');
      }else if(SYNC.dirty){SYNC.busy=false;return SYNC.push()}
      SYNC.ind('synced '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),'var(--gn)');
    }catch(e){SYNC.ind('sync error','var(--rd)');console.warn('sync pull',e)}
    SYNC.busy=false;
  },
  async push(){
    if(!SYNC.enabled()||SYNC.busy)return;
    SYNC.busy=true;SYNC.ind('syncing...','var(--am)');
    try{
      // clobber guard: if another device pushed since our last pull, resolve first
      const remote=await SYNC.fetchRemote().catch(()=>null);
      if(remote&&(remote.syncMeta?.rev||0)>(state.syncMeta?.rev||0)){SYNC.busy=false;return SYNC.conflict(remote)}
      state.syncMeta={rev:Math.max(state.syncMeta?.rev||0,remote?.syncMeta?.rev||0)+1,ts:new Date().toISOString(),device:SYNC.device()};
      const res=await fetch('https://api.github.com/gists/'+state.settings.gistId,{method:'PATCH',headers:SYNC.headers(),
        body:JSON.stringify({files:{[SYNC.FILE]:{content:SYNC.payload()}}})});
      if(!res.ok)throw new Error('GitHub said '+res.status);
      SYNC.dirty=false;persist();
      SYNC.ind('synced '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),'var(--gn)');
    }catch(e){SYNC.ind('sync error - changes kept locally','var(--rd)');console.warn('sync push',e)}
    SYNC.busy=false;
  },
  conflict(remote){
    SYNC.ind('conflict','var(--rd)');
    MODAL.open({title:'Sync Conflict',
      body:`<p style="font-size:13px;line-height:1.7;color:var(--tx2)">Another device (<b>${esc(remote.syncMeta?.device||'unknown')}</b>, ${remote.syncMeta?.ts?fmtD(remote.syncMeta.ts.slice(0,10)):''}) has pushed changes AND this device has unsynced changes. Keep one - the other's recent edits are lost.</p>`,
      footer:`<button class="btn" data-action="sync-keep-local">Keep this device</button><button class="btn primary" data-action="sync-keep-cloud">Keep cloud version</button>`});
    SYNC._remote=remote;
  },
  schedule(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>SYNC.push(),2500)},
  /* ---- pairing ----
     A pair link carries the gist ID (and optionally the token) in the URL hash.
     Opening it on another device fills the Sync settings and pulls. The hash is
     scrubbed from the address bar immediately so it never sits in history. */
  pairLink(withToken){
    const p={g:state.settings.gistId};if(withToken)p.t=state.settings.ghToken;
    const base=location.protocol==='file:'?'':location.origin+location.pathname;
    return base+'#pair='+btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  },
  readPairHash(){
    const m=(location.hash||'').match(/^#pair=(.+)$/);
    if(!m)return null;
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    try{return JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){return null}
  },
  /* find the sync gist by its file name - for when a device has the token
     but the gist ID has been lost */
  async findGist(){
    const res=await fetch('https://api.github.com/gists?per_page=100',{headers:SYNC.headers()});
    if(!res.ok)throw new Error('GitHub said '+res.status+(res.status===401?' - check the token has Gist read/write scope':''));
    const list=await res.json();
    const hits=list.filter(g=>g.files&&g.files[SYNC.FILE]).sort((a,b)=>a.updated_at<b.updated_at?1:-1);
    return hits.map(g=>({id:g.id,updated:g.updated_at,desc:g.description}));
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&SYNC.enabled())SYNC.pull();
  if(document.visibilityState==='hidden'&&SYNC.enabled()&&SYNC.dirty)SYNC.push();
});

/* ================================================================
   SECTION: BACKUPS (monthly file backup + dated copies in the sync gist)
   ================================================================
   A backup is a full JSON export with tokens stripped - same shape the
   Restore button reads. Two lanes:
   - FILE: you save it to your own disk/drive (the safety net that does not
     depend on GitHub). The app nags on the cadence you set until one is done.
   - CLOUD: when gist sync is on, a dated copy financehub-backup-YYYY-MM.json
     is written to a SECOND private gist (backupGistId, created on first use)
     automatically on first open each month, keeping the last N months.
     Separate gist on purpose: GET /gists/:id returns every file's content
     inline, so copies inside the sync gist would bloat every sync pull. */
const BACKUP={
  RX:/^financehub-backup-(\d{4}-\d{2}(?:-\d{2})?)(?:-manual)?\.json$/,
  log(){return Array.isArray(state.backupLog)?state.backupLog:(state.backupLog=[])},
  payload(){const s=JSON.parse(JSON.stringify(state));s.settings.apiKey='';s.settings.ghToken='';return JSON.stringify(s,null,1)},
  last(mode){const l=BACKUP.log().filter(b=>!mode||b.mode===mode);return l.length?l[l.length-1]:null},
  record(mode,size,extra){BACKUP.log().push(Object.assign({date:todayISO(),ts:new Date().toISOString(),mode,size},extra||{}));state.backupLog=BACKUP.log().slice(-60)},
  /* is a FILE backup due under the cadence? cloud copies never satisfy this -
     a copy inside the thing that could break is not a backup of it */
  due(){
    const cad=state.settings.backupCadence||'monthly';
    if(cad==='off')return{due:false};
    const last=BACKUP.last('file');
    const days=last?daysBetween(last.date,todayISO()):null;
    let due=false;
    if(cad==='weekly')due=!last||days>=7;
    else due=!last||monthKey(last.date)!==monthKey(todayISO());
    const snoozed=state.settings.backupSnooze&&state.settings.backupSnooze>todayISO();
    return{due,days,last,snoozed,cad};
  },
  async exportFile(){
    const data=BACKUP.payload();
    const ok=await saveViaFS(`financehub-backup-${todayISO()}.json`,data,'JSON backup','.json','application/json');
    if(ok){BACKUP.record('file',data.length);state.settings.backupSnooze='';save();render();toast('Backup saved (API keys and tokens are not included)')}
    return ok;
  },
  cloudName(mk,manual){return `financehub-backup-${mk}${manual?'-manual':''}.json`},
  async cloudList(){
    if(!state.settings.backupGistId)return [];
    const res=await fetch('https://api.github.com/gists/'+state.settings.backupGistId,{headers:SYNC.headers()});
    if(res.status===404){state.settings.backupGistId='';save();return []}
    if(!res.ok)throw new Error('GitHub said '+res.status);
    const data=await res.json();
    return Object.values(data.files).filter(f=>BACKUP.RX.test(f.filename))
      .map(f=>({name:f.filename,size:f.size,raw:f.raw_url,stamp:f.filename.match(BACKUP.RX)[1]}))
      .sort((a,b)=>a.name<b.name?1:-1);
  },
  /* write a dated copy into the gist; prunes copies beyond cloudKeep months.
     force=true writes a -manual copy for today even if this month is done */
  async cloudArchive(force){
    if(!SYNC.enabled())return false;
    const mk=force?todayISO():monthKey(todayISO());
    if(!force&&BACKUP.log().some(b=>b.mode==='cloud'&&b.key===monthKey(todayISO())))return false;
    const name=BACKUP.cloudName(mk,!!force);
    const files={[name]:{content:BACKUP.payload()}};
    try{
      const keep=Math.max(1,state.settings.cloudKeep||12);
      const existing=await BACKUP.cloudList().catch(()=>[]);
      const auto=existing.filter(f=>!/-manual\.json$/.test(f.name)&&f.name!==name);
      auto.slice(force?keep:keep-1).forEach(f=>{files[f.name]=null});   // oldest beyond the keep window (new auto copy takes a slot)
    }catch(e){}
    let res;
    if(state.settings.backupGistId){
      res=await fetch('https://api.github.com/gists/'+state.settings.backupGistId,{method:'PATCH',headers:SYNC.headers(),body:JSON.stringify({files})});
      if(res.status===404)state.settings.backupGistId='';
    }
    if(!state.settings.backupGistId){
      Object.keys(files).forEach(k=>{if(files[k]===null)delete files[k]});
      res=await fetch('https://api.github.com/gists',{method:'POST',headers:SYNC.headers(),body:JSON.stringify({description:'FinanceHub monthly backups (private)',public:false,files})});
      if(res.ok)state.settings.backupGistId=(await res.json()).id;
    }
    if(!res.ok)throw new Error('GitHub said '+res.status);
    BACKUP.record('cloud',files[name].content.length,{key:force?todayISO():monthKey(todayISO()),name});
    save();return true;
  },
  async autoCloud(){
    if(!SYNC.enabled()||state.settings.cloudArchive===false)return;
    try{if(await BACKUP.cloudArchive(false)){render();toast('Monthly cloud backup saved to your gist')}}
    catch(e){console.warn('cloud backup',e)}
  },
  async fetchCloud(f){
    const res=await fetch(f.raw,{headers:{'Authorization':'Bearer '+state.settings.ghToken}});
    if(!res.ok)throw new Error('GitHub said '+res.status);
    return await res.text();
  }
};
function backupBanner(){
  const d=BACKUP.due();
  if(!d.due||d.snoozed)return '';
  const cloud=BACKUP.last('cloud');
  const when=d.last?`last file backup ${fmtD(d.last.date)} (${d.days} day${d.days===1?'':'s'} ago)`:'no file backup has ever been saved';
  return `<div class="card" style="margin-bottom:14px;border-color:var(--am);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:220px"><div style="font-family:var(--head);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--am)">${d.cad==='weekly'?'Weekly':'Monthly'} backup due</div>
    <div class="dim" style="font-size:12.5px;margin-top:2px">${when}.${cloud&&monthKey(cloud.date)===monthKey(todayISO())?' A cloud copy for this month is already in your gist - a file on your own disk is still the safety net.':''}</div></div>
    <button class="btn primary sm" data-action="backup-export">Back up now</button>
    <button class="btn sm" data-action="backup-snooze" title="Hide for 7 days">Remind me next week</button>
  </div>`;
}

/* ================================================================
   SECTION: AI CATEGORISATION (user-supplied Anthropic API key)
   ================================================================ */
function applyTextScale(){document.body.style.zoom=(state.settings.textScale||100)/100}
async function aiCall(messages,maxTokens){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':state.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens||4000,messages})
  });
  if(!res.ok){
    let msg='API error '+res.status;
    try{const j=await res.json();msg+=': '+(j.error?.message||'')}catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function aiCatalogue(){
  return state.categories.filter(c=>c.group!=='Transfers'||true).map(c=>`${c.id} | ${c.group} > ${c.name}`).join('\n');
}
async function aiCategoriseBatch(payees){
  const prompt=`You are categorising Australian bank transaction descriptions for a personal finance app.

CATEGORIES (id | name):
${aiCatalogue()}

TRANSACTION DESCRIPTIONS (JSON array):
${JSON.stringify(payees)}

For every description, pick the single best category id. Also extract a short stable KEYWORD - the distinctive merchant substring exactly as it appears in the description (e.g. "WOOLWORTHS", "SYNERGY", "APPLE.COM/BILL"), excluding card numbers, dates, suffixes and locations. If no category fits, use null for c.

Respond with ONLY a JSON array, no markdown, no commentary:
[{"p":"<description exactly as given>","c":"<category id or null>","k":"<KEYWORD or null>"}]`;
  const raw=await aiCall([{role:'user',content:prompt}],8000);
  const clean=raw.replace(/```json|```/g,'').trim();
  const arr=JSON.parse(clean);
  if(!Array.isArray(arr))throw new Error('Unexpected response shape');
  return arr;
}
async function aiRun(makeRules,txList){
  // txList: explicit target set (bulk-selected, may include already-categorised
  // rows to redo); default = every uncategorised transaction
  const uncat=txList||state.transactions.filter(t=>!t.categoryId);
  const payees=[...new Set(uncat.map(t=>t.payee))];
  const chunks=[];for(let i=0;i<payees.length;i+=60)chunks.push(payees.slice(i,i+60));
  ui.ai={running:true,done:0,total:chunks.length,applied:0,rules:0,skipped:0};
  const validCat=new Set(state.categories.map(c=>c.id));
  const map={};
  for(const chunk of chunks){
    const st=$('#ai-status');if(st)st.textContent=`Batch ${ui.ai.done+1} of ${ui.ai.total} - ${chunk.length} payees...`;
    const arr=await aiCategoriseBatch(chunk);
    for(const row of arr)if(row&&row.p&&row.c&&validCat.has(row.c))map[row.p]={c:row.c,k:row.k};
    ui.ai.done++;
  }
  for(const t of uncat){
    const m=map[t.payee];
    if(m){t.categoryId=m.c;ui.ai.applied++}else ui.ai.skipped++;
  }
  ui.aiTargetIds=null;
  if(makeRules){
    const existing=new Set(state.rules.map(r=>r.keyword.toUpperCase()));
    const seen=new Set();
    for(const p in map){
      const m=map[p];
      const kw=(m.k||'').trim();
      if(kw.length<3||existing.has(kw.toUpperCase())||seen.has(kw.toUpperCase()))continue;
      seen.add(kw.toUpperCase());
      state.rules.push({id:uid(),keyword:kw,categoryId:m.c});ui.ai.rules++;
    }
  }
  ui.ai.running=false;
  save();
}
async function aiExtractStatement(file){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file)});
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const media=isPdf?'application/pdf':(file.type||'image/jpeg');
  const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:media,data:b64}};
  const prompt=`Extract EVERY transaction from this bank/card statement.

Rules:
- Output ONLY a JSON array, no markdown fences, no commentary
- One object per transaction: {"d":"YYYY-MM-DD","p":"description exactly as printed","a":"signed dollar amount as string, negative for debits/withdrawals/purchases, positive for credits/deposits"}
- Statement dates are Australian DD/MM format unless clearly stated otherwise; resolve years from the statement period
- Skip running balances, opening/closing balance lines, subtotals, and page headers
- Do not invent or merge rows; if a row is illegible, skip it`;
  const raw=await aiCall([{role:'user',content:[block,{type:'text',text:prompt}]}],16000);
  const clean=raw.replace(/```json|```/g,'').trim();
  let arr;
  try{arr=JSON.parse(clean)}catch(e){throw new Error('Claude returned unreadable output - try a clearer scan or a shorter statement')}
  if(!Array.isArray(arr))throw new Error('Unexpected response shape');
  const rows=[];
  for(const r of arr){
    if(!r||!r.d||!r.p)continue;
    const date=/^\d{4}-\d{2}-\d{2}$/.test(r.d)?r.d:null;
    const amount=cents(r.a);
    if(!date||!amount)continue;
    rows.push({date,desc:String(r.p).trim(),amount});
  }
  return rows;
}
/* classify each extracted row:
   'new'  - nothing like it exists
   'dupe' - exact hash match (date+amount+description) - always skipped
   'near' - same date + same amount but DIFFERENT description, ON THE SAME
            ACCOUNT: almost always the same payment rendered differently by
            the statement vs a CSV export. Skipped by default, importable via
            checkbox. Each existing transaction can absorb only one near-match
            per batch, so two genuinely separate identical-amount purchases
            still both import. A transaction lives on one account, so a same-
            day same-amount entry on a DIFFERENT account is not a duplicate
            (e.g. $1,000 landing in Revolut vs $1,000 landing in Savings). */
function aiClassify(rows,accountId){
  const existing=new Set(state.transactions.map(t=>t.hash));
  const hashFor=wizHashes();
  const byDayAmt={};
  for(const t of state.transactions){if(accountId&&t.accountId!==accountId)continue;const k=t.date+'|'+t.amount;(byDayAmt[k]=byDayAmt[k]||[]).push(t)}
  const consumed=new Set();
  return rows.map(p=>{
    if(existing.has(hashFor(p)))return{...p,cls:'dupe'};
    const cands=(byDayAmt[p.date+'|'+p.amount]||[]).filter(t=>!consumed.has(t.id));
    if(cands.length){consumed.add(cands[0].id);return{...p,cls:'near',like:cands[0].payee}}
    return{...p,cls:'new'};
  });
}
function aiImportPreview(rows,accountId){
  const cl=aiClassify(rows,accountId);
  return{add:cl.filter(r=>r.cls==='new').length,dupes:cl.filter(r=>r.cls==='dupe').length,near:cl.filter(r=>r.cls==='near').length,ruled:rows.filter(p=>ENGINE.applyRules(p.desc)).length,rows:cl};
}

  const mk=monthKey(todayISO()),pk=monthKey(addMonths(todayISO(),-1));
  const bud={};
  bud[cat('Income','Salary')]=900000;bud[cat('Groceries','Supermarket')]=110000;bud[cat('Transport','Fuel')]=36000;
  bud[cat('Dining','Restaurants')]=40000;bud[cat('Dining','Coffee')]=8000;bud[cat('Housing','Maintenance')]=30000;
  bud[cat('Utilities','Electricity')]=41250;bud[cat('Insurance','Health Insurance')]=43850;bud[cat('Subscriptions','Streaming')]=4198;
  bud[cat('Kids','Activities')]=15000;bud[cat('Medical','Pharmacy')]=8000;
  s.budgets[mk]={...bud};s.budgets[pk]={...bud};
  state=s;
  ui.payoffSel=[s.scenarios[0].id,s.scenarios[1].id];
}

(async function init(){
  try{await DB.open()}catch(e){console.warn('IndexedDB unavailable - running in-memory only',e);setTimeout(()=>toast('Storage unavailable (private browsing?) - data will NOT persist. Export a JSON backup before closing.'),800)}
  const saved=await DB.load();
  if(saved)state=Object.assign(emptyState(),saved);
  // migrate/repair
  state.settings=Object.assign(emptyState().settings,state.settings);
  state.settings.alloc=Object.assign({debt:70,goals:20,keep:10},state.settings.alloc||{});
  if(!state.settings.spendMode)state.settings.spendMode='auto';
  if(!state.settings.spendMonths)state.settings.spendMonths=3;
  state.consol=Object.assign({debtIds:[],rate:9,years:5,fees:0},state.consol||{});
  if(!Array.isArray(state.incomes))state.incomes=[];
  if(!Array.isArray(state.backupLog))state.backupLog=[];
  if(!Array.isArray(state.categories)||!state.categories.length)state.categories=defaultCategories();
  applyTextScale();
  // pair link from another device: fill sync settings, then the normal pull runs
  const pair=SYNC.readPairHash();
  if(pair&&pair.g){
    state.settings.gistId=pair.g;if(pair.t)state.settings.ghToken=pair.t;persist();
    setTimeout(()=>{state.view='settings';render();toast(pair.t?'Paired - pulling your data from the sync gist':'Paired - paste your GitHub token in Sync settings to connect')},300);
  }
  reconcileDebtBalances();
  ENGINE.syncDebtBills();
  const adv=ENGINE.autoAdvanceBills();
  if(adv)setTimeout(()=>toast(adv+' bill'+(adv>1?'s':'')+' auto-advanced from matched payments'),600);
  // migrate: liability balances entered as positive become negative (owing)
  for(const a of state.accounts){
    if(!acctType(a).asset){
      if(a.balance>0)a.balance=-a.balance;
      (a.history||[]).forEach(hh=>{if(hh.balance>0)hh.balance=-hh.balance});
    }
  }
  // auto monthly snapshot
  if(state.accounts.length)takeSnapshot(false);
  // first run welcome
  const bs=$('#build-stamp');if(bs)bs.textContent=BUILD;
  render();
  if(SYNC.enabled()){SYNC.pull({silent:false});setTimeout(()=>BACKUP.autoCloud(),6000)}else SYNC.ind('','');
  if(state.settings.firstRun&&!state.accounts.length){
    state.settings.firstRun=false;persist();
    if(!pair)MODAL.open({title:'Welcome to FinanceHub',
      body:`<p style="color:var(--tx2);line-height:1.7;font-size:13.5px">Everything runs locally in this browser - no accounts, no cloud. Start by adding your accounts and bills, or load the sample dataset to explore the Payoff Planner, weekly bills engine, and reports with realistic data.</p>`,
      footer:`<button class="btn" data-action="modal-close">Start empty</button><button class="btn primary" data-action="load-sample">Load sample data</button>`});
  }
  // persist migrations locally only - marking the store dirty here would race
  // the pull above and turn every "other device pushed" open into a conflict
  persist();
})();
