async function aiRun(makeRules,txList){
  // txList: explicit target set (bulk-selected, may include already-categorised
  // rows to redo); default = every uncategorised transaction
  const uncat=txList||state.transactions.filter(t=>!t.categoryId);
  const payees=[...new Set(uncat.map(t=>t.payee))];
  const chunks=[];for(let i=0;i<payees.length;i+=60)chunks.push(payees.slice(i,i+60));
  ui.ai={running:true,done:0,total:chunks.length,applied:0,rules:0,skipped:0};
  const validCat=new Set(state.categories.map(c=>c.id));
  const map={};
  for(const chunk of chunks){
    const st=$('#ai-status');if(st)st.textContent=`Batch ${ui.ai.done+1} of ${ui.ai.total} - ${chunk.length} payees...`;
    const arr=await aiCategoriseBatch(chunk);
    for(const row of arr)if(row&&row.p&&row.c&&validCat.has(row.c))map[row.p]={c:row.c,k:row.k};
    ui.ai.done++;
  }
  for(const t of uncat){
    const m=map[t.payee];
    if(m){t.categoryId=m.c;ui.ai.applied++}else ui.ai.skipped++;
  }
  ui.aiTargetIds=null;
  if(makeRules){
    const existing=new Set(state.rules.map(r=>r.keyword.toUpperCase()));
    const seen=new Set();
    for(const p in map){
      const m=map[p];
      const kw=(m.k||'').trim();
      if(kw.length<3||existing.has(kw.toUpperCase())||seen.has(kw.toUpperCase()))continue;
      seen.add(kw.toUpperCase());
      state.rules.push({id:uid(),keyword:kw,categoryId:m.c});ui.ai.rules++;
    }
  }
  ui.ai.running=false;
  save();
}
/* ---- receipt reader ----
   One image (snip, photo, PDF) -> {payee,date,amount,category,notes}. Fills
   the open Add Transaction form; nothing is saved until the user presses Save,
   so a misread is just a field to correct. */
async function aiReadReceipt(file){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Could not read image'));r.readAsDataURL(file)});
  const isPdf=file.type==='application/pdf';
  const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:file.type||'image/png',data:b64}};
  const cats=state.categories.map(c=>`${c.group} > ${c.name}`).join('; ');
  const prompt=`This is a receipt, invoice or payment confirmation. Extract ONE transaction.
Output ONLY a JSON object, no markdown fences: {"payee":"merchant name, short, as a bank statement would show it","date":"YYYY-MM-DD","total":"final amount paid as a positive number string","category":"one of the categories below, exactly as written, or empty","items":"up to 6 line items joined by ', ' or empty","refund":false}
Categories: ${cats}
Rules: dates are Australian DD/MM unless the receipt says otherwise; if no date, use today ${todayISO()}. Use the grand total actually paid (after discounts, including GST/surcharge). If it is a refund or credit set refund true.`;
  const raw=await aiCall([{role:'user',content:[block,{type:'text',text:prompt}]}],600);
  const clean=raw.replace(/```json|```/g,'').trim();
  const j=JSON.parse(clean.slice(clean.indexOf('{'),clean.lastIndexOf('}')+1));
  const total=parseFloat(String(j.total||'').replace(/[^0-9.]/g,''))||0;
  let categoryId='';
  if(j.category){const [g,nm]=String(j.category).split('>').map(x=>x.trim());const c=state.categories.find(c=>c.name.toLowerCase()===(nm||g||'').toLowerCase()&&(!nm||c.group.toLowerCase()===g.toLowerCase()))||state.categories.find(c=>c.name.toLowerCase()===(nm||g||'').toLowerCase());if(c)categoryId=c.id}
  return{payee:String(j.payee||'').trim(),date:/^\d{4}-\d{2}-\d{2}$/.test(j.date||'')?j.date:todayISO(),amount:(j.refund?1:-1)*Math.round(total*100),categoryId,notes:String(j.items||'').trim()};
}

async function aiExtractStatement(file){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file)});
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const media=isPdf?'application/pdf':(file.type||'image/jpeg');
  const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:media,data:b64}};
  const prompt=`Extract EVERY transaction from this bank/card statement.

Rules:
- Output ONLY a JSON array, no markdown fences, no commentary
- One object per transaction: {"d":"YYYY-MM-DD","p":"description exactly as printed","a":"signed dollar amount as string, negative for debits/withdrawals/purchases, positive for credits/deposits"}
- Statement dates are Australian DD/MM format unless clearly stated otherwise; resolve years from the statement period
- Skip running balances, opening/closing balance lines, subtotals, and page headers
- Do not invent or merge rows; if a row is illegible, skip it`;
  const raw=await aiCall([{role:'user',content:[block,{type:'text',text:prompt}]}],16000);
  const clean=raw.replace(/```json|```/g,'').trim();
  let arr;
  try{arr=JSON.parse(clean)}catch(e){throw new Error('Claude returned unreadable output - try a clearer scan or a shorter statement')}
  if(!Array.isArray(arr))throw new Error('Unexpected response shape');
  const rows=[];
  for(const r of arr){
    if(!r||!r.d||!r.p)continue;
    const date=/^\d{4}-\d{2}-\d{2}$/.test(r.d)?r.d:null;
    const amount=cents(r.a);
    if(!date||!amount)continue;
    rows.push({date,desc:String(r.p).trim(),amount});
  }
  return rows;
}
/* classify each extracted row:
   'new'  - nothing like it exists
   'dupe' - exact hash match (date+amount+description) - always skipped
   'near' - same date + same amount but DIFFERENT description, ON THE SAME
            ACCOUNT: almost always the same payment rendered differently by
            the statement vs a CSV export. Skipped by default, importable via
            checkbox. Each existing transaction can absorb only one near-match
            per batch, so two genuinely separate identical-amount purchases
            still both import. A transaction lives on one account, so a same-
            day same-amount entry on a DIFFERENT account is not a duplicate
            (e.g. $1,000 landing in Revolut vs $1,000 landing in Savings). */
function aiClassify(rows,accountId){
  const existing=new Set(state.transactions.map(t=>t.hash));
  const hashFor=wizHashes();
  const byDayAmt={};
  for(const t of state.transactions){if(accountId&&t.accountId!==accountId)continue;const k=t.date+'|'+t.amount;(byDayAmt[k]=byDayAmt[k]||[]).push(t)}
  const consumed=new Set();
  return rows.map(p=>{
    if(existing.has(hashFor(p)))return{...p,cls:'dupe'};
    const cands=(byDayAmt[p.date+'|'+p.amount]||[]).filter(t=>!consumed.has(t.id));
    if(cands.length){consumed.add(cands[0].id);return{...p,cls:'near',like:cands[0].payee}}
    return{...p,cls:'new'};
  });
}
function aiImportPreview(rows,accountId){
  const cl=aiClassify(rows,accountId);
  return{add:cl.filter(r=>r.cls==='new').length,dupes:cl.filter(r=>r.cls==='dupe').length,near:cl.filter(r=>r.cls==='near').length,ruled:rows.filter(p=>ENGINE.applyRules(p.desc)).length,rows:cl};
}

(async function init(){
  try{await DB.open()}catch(e){console.warn('IndexedDB unavailable - running in-memory only',e);setTimeout(()=>toast('Storage unavailable (private browsing?) - data will NOT persist. Export a JSON backup before closing.'),800)}
  const saved=await DB.load();
  if(saved)state=Object.assign(emptyState(),saved);
  // migrate/repair
  state.settings=Object.assign(emptyState().settings,state.settings);
  state.settings.alloc=Object.assign({debt:70,goals:20,keep:10},state.settings.alloc||{});
  if(!state.settings.spendMode)state.settings.spendMode='auto';
  if(!state.settings.spendMonths)state.settings.spendMonths=3;
  state.consol=Object.assign({debtIds:[],rate:9,years:5,fees:0},state.consol||{});
  if(!Array.isArray(state.incomes))state.incomes=[];
  if(!Array.isArray(state.backupLog))state.backupLog=[];
  if(!Array.isArray(state.categories)||!state.categories.length)state.categories=defaultCategories();
  applyTextScale();
  // pair link from another device: fill sync settings, then the normal pull runs
  const pair=SYNC.readPairHash();
  if(pair&&pair.g){
    state.settings.gistId=pair.g;if(pair.t)state.settings.ghToken=pair.t;persist();
    setTimeout(()=>{state.view='settings';render();toast(pair.t?'Paired - pulling your data from the sync gist':'Paired - paste your GitHub token in Sync settings to connect')},300);
  }
  reconcileDebtBalances();
  ENGINE.syncDebtBills();
  const adv=ENGINE.autoAdvanceBills();
  if(adv)setTimeout(()=>toast(adv+' bill'+(adv>1?'s':'')+' auto-advanced from matched payments'),600);
  // migrate: liability balances entered as positive become negative (owing)
  for(const a of state.accounts){
    if(!acctType(a).asset){
      if(a.balance>0)a.balance=-a.balance;
      (a.history||[]).forEach(hh=>{if(hh.balance>0)hh.balance=-hh.balance});
    }
  }
  // auto monthly snapshot
  if(state.accounts.length)takeSnapshot(false);
  // first run welcome
  const bs=$('#build-stamp');if(bs)bs.textContent=BUILD;
  render();
  if(SYNC.enabled()){SYNC.pull({silent:false});setTimeout(()=>BACKUP.autoCloud(),6000)}else SYNC.ind('','');
  if(state.settings.firstRun&&!state.accounts.length){
    state.settings.firstRun=false;persist();
    if(!pair)MODAL.open({title:'Welcome to FinanceHub',
      body:`<p style="color:var(--tx2);line-height:1.7;font-size:13.5px">Everything runs locally in this browser - no accounts, no cloud. Start by adding your accounts and bills, or load the sample dataset to explore the Payoff Planner, weekly bills engine, and reports with realistic data.</p>`,
      footer:`<button class="btn" data-action="modal-close">Start empty</button><button class="btn primary" data-action="load-sample">Load sample data</button>`});
  }
  // persist migrations locally only - marking the store dirty here would race
  // the pull above and turn every "other device pushed" open into a conflict
  persist();
})();
