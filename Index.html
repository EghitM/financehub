<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinanceHub">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0d'/%3E%3Ctext x='16' y='23' font-size='20' font-family='monospace' fill='%23f97316' text-anchor='middle' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"FinanceHub","short_name":"FinanceHub","display":"standalone","background_color":"%230d0d0d","theme_color":"%230d0d0d","start_url":"."}'>
<title>FINANCEHUB</title>
<style>
/* ============ DESIGN SYSTEM - dark industrial ============ */
:root{
  --bg:#0d0d0d; --s1:#161616; --s2:#1c1c1c; --s3:#232323; --bd:#2a2a2a; --bd2:#3a3a3a;
  --or:#f97316; --or-d:#c2590f; --gn:#22c55e; --rd:#ef4444; --bl:#3b82f6; --am:#f59e0b;
  --tx:#e5e5e5; --tx2:#9a9a9a; --tx3:#666;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --head:'Rajdhani','Segoe UI',sans-serif;
  --r:4px; --sh:0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;font-size:14.5px;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:var(--r)}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
h1,h2,h3,h4{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em}
button{font-family:inherit}
a{color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh}
#sidebar{width:210px;min-width:210px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:margin-left .2s}
#sidebar.collapsed{margin-left:-210px}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--bd)}
.logo h1{font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--tx)}
.logo h1 span{color:var(--or)}
.logo .sub{font-size:11px;color:var(--tx3);letter-spacing:.2em;text-transform:uppercase;font-family:var(--mono)}
nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--tx2);font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--s2);color:var(--tx)}
.nav-item.active{background:var(--s2);color:var(--or);border-left-color:var(--or)}
.nav-item .ico{width:18px;text-align:center;font-family:var(--mono);font-size:13px}
.nav-foot{padding:12px 16px;border-top:1px solid var(--bd);font-family:var(--mono);font-size:11px;color:var(--tx3)}
#main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--s1);border-bottom:1px solid var(--bd);min-height:58px}
#topbar h2{font-size:19px;color:var(--tx);letter-spacing:.1em}
#topbar .totals{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.tb-stat{text-align:right}
.tb-stat .l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.15em}
.tb-stat .v{font-family:var(--mono);font-size:15px;font-weight:600}
#burger{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-family:var(--mono)}
#burger:hover{color:var(--or);border-color:var(--or)}
#main{flex:1;overflow-y:auto;padding:22px}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card.pad0{padding:0}
.card h3{font-size:12px;color:var(--tx2);letter-spacing:.18em;margin-bottom:12px;font-weight:600}
.card h3 .r{float:right}
.sec-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.2em;font-family:var(--head);font-weight:600}
.num{font-family:var(--mono)}
.pos{color:var(--gn)}.neg{color:var(--rd)}.acc{color:var(--or)}.mut{color:var(--tx2)}.dim{color:var(--tx3)}
.big{font-size:26px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-size:13px;font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.btn:hover{border-color:var(--or);color:var(--or)}
.btn.primary{background:var(--or);border-color:var(--or);color:#0d0d0d}
.btn.primary:hover{background:#fb8b3c;color:#0d0d0d}
.btn.danger{border-color:var(--rd);color:var(--rd)}
.btn.danger:hover{background:var(--rd);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--or)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:1px 7px;border-radius:var(--r);font-size:11px;font-family:var(--mono);border:1px solid var(--bd2);color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.badge.or{border-color:var(--or);color:var(--or)}
.badge.gn{border-color:var(--gn);color:var(--gn)}
.badge.rd{border-color:var(--rd);color:var(--rd)}
.badge.bl{border-color:var(--bl);color:var(--bl)}
.badge.or{border-color:var(--or);color:var(--or)}
.badge.tagbtn{cursor:pointer}
.badge.tagbtn:hover{border-color:var(--or);color:var(--or)}
.badge.am{border-color:var(--am);color:var(--am)}
.group-head{display:flex;align-items:center;gap:10px;padding:8px 2px 6px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
input,select,textarea{background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:var(--r);padding:7px 10px;font-size:13px;font-family:var(--mono);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
input[type=checkbox]{width:auto;accent-color:var(--or)}
input[type=color]{padding:2px;height:34px}
label.f{display:block;margin-bottom:10px}
label.f .fl{display:block;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px;font-family:var(--head);font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer}

/* tables */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{font-family:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--or)}
td{padding:7px 10px;border-bottom:1px solid #1f1f1f;vertical-align:middle}
tr:hover td{background:#191919}
tr.tot td{border-top:1px solid var(--bd2);font-weight:700;color:var(--tx)}
td.r,th.r{text-align:right}
.row-act{opacity:0;display:inline-flex;gap:4px}
tr:hover .row-act{opacity:1}
.iconbtn{background:none;border:none;color:var(--tx3);cursor:pointer;font-family:var(--mono);font-size:13px;padding:2px 5px;border-radius:var(--r)}
.iconbtn:hover{color:var(--or);background:var(--s3)}
.iconbtn.del:hover{color:var(--rd)}

/* progress */
.pbar{height:8px;background:var(--s3);border-radius:var(--r);overflow:hidden}
.pbar>div{height:100%;background:var(--gn);transition:width .4s}
.pbar>div.warn{background:var(--am)}.pbar>div.over{background:var(--rd)}

/* hero */
.hero{background:linear-gradient(135deg,#1c1c1c,#161616);border:1px solid var(--bd2);border-radius:var(--r);padding:22px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.hero .main-fig .l{font-size:12px;color:var(--tx2);letter-spacing:.25em;text-transform:uppercase;font-family:var(--head);font-weight:700}
.hero .main-fig .v{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--or);line-height:1.05}
.hero .alt{border-left:1px solid var(--bd2);padding-left:22px}
.hero .alt .l{font-size:9px;color:var(--tx3);letter-spacing:.2em;text-transform:uppercase}
.hero .alt .v{font-family:var(--mono);font-size:19px;font-weight:600}

/* modal */
#modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:5vh 16px}
#modal-layer.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);width:100%;max-width:560px;box-shadow:var(--sh);margin-bottom:5vh}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.modal-h h3{font-size:14px;letter-spacing:.15em;color:var(--tx)}
.modal-h .x{margin-left:auto;background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer;font-family:var(--mono)}
.modal-h .x:hover{color:var(--rd)}
.modal-b{padding:18px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--bd)}

/* misc */
.empty{padding:44px 20px;text-align:center;color:var(--tx3)}
.empty .big-i{font-size:30px;font-family:var(--mono);color:var(--bd2);margin-bottom:10px}
.empty p{margin-bottom:14px;font-size:13px}
.spark{display:block}
.acct-card{position:relative;overflow:hidden}
.acct-card .tag{position:absolute;top:0;left:0;width:4px;height:100%}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.chart-wrap{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-family:var(--mono);color:var(--tx2);cursor:pointer;user-select:none}
.legend .li.off{opacity:.35;text-decoration:line-through}
.legend .sw{width:10px;height:10px;border-radius:2px}
#tooltip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--bd2);border-radius:var(--r);padding:7px 10px;font-family:var(--mono);font-size:12.5px;z-index:200;display:none;box-shadow:var(--sh);white-space:pre-line;line-height:1.5;max-width:280px}
#toast{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--s2);border:1px solid var(--or);border-left:3px solid var(--or);border-radius:var(--r);padding:10px 16px;font-family:var(--mono);font-size:12.5px;box-shadow:var(--sh);animation:tin .25s}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
svg path.anim{transition:opacity .6s;}
svg .fade{animation:fin .7s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.milestone{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #1f1f1f;font-size:12.5px}
.milestone .d{font-family:var(--mono);color:var(--or);min-width:76px}
.gantt-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.gantt-row .gl{width:130px;min-width:130px;font-size:12.5px;font-family:var(--mono);color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-track{flex:1;height:18px;background:var(--s2);border-radius:var(--r);position:relative}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:var(--r);opacity:.85}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tab{padding:8px 16px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);border-bottom:2px solid transparent}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--or);border-bottom-color:var(--or)}
.ring-wrap{display:flex;gap:16px;align-items:center}
.wizard-step{display:none}.wizard-step.active{display:block}
.csv-prev{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:var(--r)}
.flash{animation:flash 1s}
@keyframes flash{0%{background:rgba(249,115,22,.25)}100%{background:transparent}}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
#backdrop{display:none}
@media(max-width:760px){
  #sidebar{position:fixed;z-index:50;height:100%;transition:margin-left .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top)}
  #sidebar:not(.collapsed)~#backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow,.frow3{grid-template-columns:1fr}
  .hero{gap:14px;padding:16px}
  .hero .main-fig{width:100%}
  .hero .main-fig .v{font-size:30px}
  .hero .alt{border-left:none;border-top:1px solid var(--bd2);padding:8px 0 0;min-width:46%;flex:1 1 46%}
  #main{padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  #topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:40}
  #topbar .totals{display:none}
  #topbar h2{font-size:16px}
  /* touch targets */
  .btn{min-height:42px;padding:10px 14px}
  .btn.sm{min-height:36px}
  .iconbtn{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  #nav .nav-item{padding:13px 18px;font-size:14px}
  input,select,textarea{font-size:16px!important;min-height:42px} /* 16px stops iOS focus zoom */
  .chk input{width:20px;height:20px}
  /* wide tables scroll inside cards */
  .card{overflow-x:auto}
  .card table{min-width:520px}
  .card table.fit{min-width:0}
  /* modals become full sheets */
  #modal-layer{padding:0;align-items:stretch}
  .modal{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:none;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .modal-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .toolbar{gap:8px}
  #toasts{bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px}
  #toasts .toast{width:100%}
}
@supports(-webkit-touch-callout:none){ /* iOS momentum + no rubber-band on app shell */
  #main{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><h1>FINANCE<span>HUB</span></h1><div class="sub">Personal Finance Manager</div><div class="dim" style="font-family:var(--mono);font-size:9.5px;margin-top:3px">build <span id="build-stamp"></span></div><div id="sync-ind" class="dim" style="font-family:var(--mono);font-size:10px;margin-top:6px;display:none"></div></div>
    <nav id="nav"></nav>
    <div class="nav-foot">AUD &middot; LOCAL DATA<br>INDEXEDDB v1</div>
  </aside>
  <div id="backdrop" data-action="toggle-nav"></div>
  <div id="main-wrap">
    <div id="topbar">
      <button id="burger" data-action="toggle-nav" aria-label="Toggle navigation">&#9776;</button>
      <h2 id="view-title">Dashboard</h2>
      <div class="totals" id="topbar-totals"></div>
    </div>
    <div id="main"></div>
  </div>
</div>
<div id="modal-layer"></div>
<div id="tooltip"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================================================================
   SECTION: CONFIG
   ================================================================ */
const BUILD='2026-08-13.1';
const CONFIG = {
  dbName:'financehub', dbStore:'app', dbKey:'state',
  colors:{or:'#f97316',gn:'#22c55e',rd:'#ef4444',bl:'#3b82f6',am:'#f59e0b',tx2:'#9a9a9a'},
  series:['#f97316','#3b82f6','#f59e0b','#22c55e','#a855f7','#14b8a6','#ef4444','#eab308','#6366f1','#f472b6'],
  accountTypes:[
    {id:'transaction',n:'Transaction',asset:true},{id:'savings',n:'Savings',asset:true},
    {id:'offset',n:'Offset',asset:true},{id:'term',n:'Term Deposit',asset:true},
    {id:'credit',n:'Credit Card',asset:false,limit:true},{id:'ploan',n:'Personal Loan',asset:false},
    {id:'carloan',n:'Car Loan',asset:false},{id:'mortgage',n:'Mortgage',asset:false},
    {id:'hecs',n:'HECS/HELP',asset:false},{id:'invest',n:'Investment',asset:true},{id:'property',n:'Property',asset:true},{id:'vehicle',n:'Vehicle',asset:true},{id:'equipment',n:'Equipment',asset:true},
    {id:'cash',n:'Cash',asset:true},{id:'other',n:'Other',asset:true}
  ],
  billFreqs:[
    {id:'weekly',n:'Weekly',wk:a=>a},{id:'fortnightly',n:'Fortnightly',wk:a=>a/2},
    {id:'monthly',n:'Monthly',wk:a=>a*12/52},{id:'quarterly',n:'Quarterly',wk:a=>a*4/52},
    {id:'halfyearly',n:'Half-yearly',wk:a=>a*2/52},{id:'annually',n:'Annually',wk:a=>a/52},
    {id:'customN',n:'Every N weeks',wk:(a,n)=>a/(n||1)}
  ],
  recFreqs:[['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['quarterly','Quarterly'],['annually','Annually']],
  payFreqs:[['weekly','Weekly',52],['fortnightly','Fortnightly',26],['monthly','Monthly',12]],
  views:[
    ['dashboard','Dashboard','\u25A0'],['accounts','Accounts','\u25A4'],['transactions','Transactions','\u21C6'],
    ['bills','Bills','\u2261'],['budget','Budget','\u25D1'],['debts','Debts','\u25BC'],
    ['paysplit','Pay Split','\u2696'],['payoff','Payoff Planner','\u2197'],['goals','Savings Goals','\u25CE'],['networth','Net Worth','\u03A3'],
    ['reports','Reports','\u2237'],['settings','Settings','\u2699']
  ]
};

/* ================================================================
   SECTION: UTILITIES (money in integer cents, dates ISO)
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const audFmt=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
const fmt=c=>audFmt.format((c||0)/100);
const fmtS=c=>(c<0?'-':'')+audFmt.format(Math.abs(c||0)/100); // explicit sign handling
const fmt0=c=>'$'+new Intl.NumberFormat('en-AU').format(Math.round((c||0)/100));
const cents=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isNaN(n)?0:Math.round(n*100)};
const pct=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=iso=>{if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-');return`${d}/${m}/${y}`};
const fmtMY=iso=>{const[y,m]=iso.slice(0,7).split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y};
const monthKey=iso=>iso.slice(0,7);
const monthsBetweenKeys=(from,to)=>{const[a,b]=from.split('-').map(Number),[c,d]=to.split('-').map(Number);return (c-a)*12+(d-b)};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addMonths=(iso,n)=>{const d=new Date(iso+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const advanceBill=(iso,freq,n)=>({weekly:d=>addDays(d,7),fortnightly:d=>addDays(d,14),monthly:d=>addMonths(d,1),quarterly:d=>addMonths(d,3),halfyearly:d=>addMonths(d,6),annually:d=>addMonths(d,12),customN:d=>addDays(d,7*(n||1))}[freq]||(d=>addMonths(d,1)))(iso);
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const sum=arr=>arr.reduce((a,b)=>a+b,0);
const byId=(arr,id)=>arr.find(x=>x.id===id);
function toast(msg){const d=document.createElement('div');d.className='toast-item';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),320)},3200)}
function txHash(date,amount,desc){let s=date+'|'+amount+'|'+String(desc).toUpperCase().replace(/\s+/g,' ').trim(),h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}

/* ---- RFC 4180 CSV ---- */
function csvParse(text){
  const rows=[];let row=[],field='',inQ=false,i=0;
  text=text.replace(/^\uFEFF/,'');
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue} inQ=false;i++;continue }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue}
    if(c===','){row.push(field);field='';i++;continue}
    if(c==='\r'){ if(text[i+1]==='\n')i++; row.push(field);rows.push(row);row=[];field='';i++;continue}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==''));
}
function csvField(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvBuild(rows){return rows.map(r=>r.map(csvField).join(',')).join('\r\n')}
function downloadFile(name,content,type='text/plain'){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},400);
}

const DB={
  _db:null,
  open(){return new Promise((res,rej)=>{
    const rq=indexedDB.open(CONFIG.dbName,1);
    rq.onupgradeneeded=e=>{e.target.result.createObjectStore(CONFIG.dbStore)};
    rq.onsuccess=e=>{DB._db=e.target.result;res()};
    rq.onerror=()=>rej(rq.error);
  })},
  load(){return new Promise(res=>{
    if(!DB._db)return res(null);
    const tx=DB._db.transaction(CONFIG.dbStore,'readonly');
    const rq=tx.objectStore(CONFIG.dbStore).get(CONFIG.dbKey);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
  })},
  put(data){return new Promise(res=>{
    if(!DB._db)return res(false);
    const tx=DB._db.transaction(CONFIG.dbStore,'readwrite');
    tx.objectStore(CONFIG.dbStore).put(data,CONFIG.dbKey);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  })}
};

/* ================================================================
   SECTION: ENGINE - pure financial calculation functions
   ================================================================ */
const ENGINE={
  /* ---- Bills: exact annualised weekly cost (cents) ---- */
  billWeekly(b){
    const f=CONFIG.billFreqs.find(x=>x.id===b.freq)||CONFIG.billFreqs[2];
    return f.wk(b.amount,b.everyN);
  },
  billAnnual(b){return ENGINE.billWeekly(b)*52},
  billMonthly(b){return ENGINE.billWeekly(b)*52/12},
  billsSummary(){
    // only bills paid FROM the bills account participate in the transfer.
    // Bills flagged out (mortgage/debt repayments paid from everyday, already
    // costed as debt minimums) stay in the register without inflating it.
    const act=state.bills.filter(b=>b.active!==false&&b.inTransfer!==false);
    const excluded=state.bills.filter(b=>b.active!==false&&b.inTransfer===false).length;
    const wk=sum(act.map(ENGINE.billWeekly));
    const buf=wk*(state.settings.billsBuffer||0)/100;
    let final=wk+buf;
    const r=state.settings.billsRound*100;
    if(r>0)final=Math.ceil(final/r)*r;
    return {weekly:wk,buffer:buf,final,fortnightly:final*2,monthly:final*52/12,annual:wk*52,count:act.length,excluded};
  },
  /* Bills account: project 12 weeks -> weekly transfer in, bills out on due dates.
     Also computes min opening float needed so a zero-start never dips negative. */
  billsProjection(weeks=12){
    const s=ENGINE.billsSummary();
    const acct=byId(state.accounts,state.settings.billsAccountId);
    const opening=acct?acct.balance:0;
    const start=todayISO();
    const events=[]; // due bills in horizon
    for(const b of state.bills.filter(b=>b.active!==false&&b.inTransfer!==false)){
      let due=b.nextDue||start;
      let guard=0;
      while(daysBetween(start,due)<0&&guard++<400)due=advanceBill(due,b.freq,b.everyN); // catch up overdue for projection
      guard=0;
      while(daysBetween(start,due)<weeks*7&&guard++<400){
        events.push({day:daysBetween(start,due),name:b.name,amount:b.amount});
        due=advanceBill(due,b.freq,b.everyN);
      }
    }
    const rows=[];let bal=opening,zeroBal=0,minZero=0;
    for(let w=0;w<weeks;w++){
      bal+=s.final; zeroBal+=s.final;
      const wkEvents=events.filter(e=>e.day>=w*7&&e.day<(w+1)*7);
      const out=sum(wkEvents.map(e=>e.amount));
      bal-=out; zeroBal-=out; minZero=Math.min(minZero,zeroBal);
      rows.push({week:w+1,date:addDays(start,(w+1)*7-1),in:s.final,out,bal,events:wkEvents});
    }
    return {rows,opening,minFloat:Math.max(0,-minZero),shortfalls:rows.filter(r=>r.bal<0)};
  },
  upcomingBills(days=30){
    const start=todayISO(),out=[];
    for(const b of state.bills.filter(b=>b.active!==false)){
      if(!b.nextDue)continue;
      const d=daysBetween(start,b.nextDue);
      if(d<=days)out.push({bill:b,days:d});
    }
    return out.sort((a,b)=>a.days-b.days);
  },
  /* ---- Budget ---- */
  monthActuals(mk){
    const out={};
    for(const t of state.transactions){
      if(monthKey(t.date)!==mk)continue;
      out[t.categoryId||'_u']=(out[t.categoryId||'_u']||0)+t.amount;
    }
    return out;
  },
  /* Bill-backed categories are billed in lumps (quarterly water, annual rego)
     but budgeted at true monthly cost. Comparing a lump to one month's budget
     always reads as a blowout, so each payment in such a category is amortised
     across its bill's cycle from the month it landed. Others are untouched. */
  billCycleMonths(b){
    const m={weekly:1,fortnightly:1,monthly:1,quarterly:3,halfyearly:6,annually:12}[b.freq];
    if(m)return m;
    if(b.freq==='customN')return Math.max(1,Math.round((b.everyN||1)*7/30.44));
    return 1;
  },
  monthActualsSmoothed(mk){
    const cycle={};
    for(const b of state.bills.filter(b=>b.active!==false)){
      if(!b.categoryId)continue;
      cycle[b.categoryId]=Math.max(cycle[b.categoryId]||1,ENGINE.billCycleMonths(b));
    }
    const out={};
    for(const t of state.transactions){
      const cid=t.categoryId||'_u';
      const n=cycle[cid]||1;
      if(n<=1){if(monthKey(t.date)===mk)out[cid]=(out[cid]||0)+t.amount;continue}
      const idx=monthsBetweenKeys(monthKey(t.date),mk);
      if(idx>=0&&idx<n)out[cid]=(out[cid]||0)+t.amount/n;
    }
    for(const k in out)out[k]=Math.round(out[k]);
    return out;
  },
  billBackedCats(){
    const m={};
    for(const b of state.bills.filter(b=>b.active!==false)){
      if(b.categoryId)m[b.categoryId]=(m[b.categoryId]||0)+ENGINE.billMonthly(b);
    }
    return m;
  },
  /* ---- Debts: normalise minimum repayment to monthly cents ---- */
  minMonthly(d){
    const f={weekly:52/12,fortnightly:26/12,monthly:1}[d.minFreq||'monthly']||1;
    return d.minAmount*f;
  },
  offsetBal(d){
    if(!d.offsetAccountId)return 0;
    const a=byId(state.accounts,d.offsetAccountId);
    return a?Math.max(0,a.balance):0;
  },
  /* ---- PAYOFF SIMULATOR (pure, monthly periods, integer cents) ----
     debts: [{id,name,balance,rate,minMonthly,fees,interestFreeUntil,offset}]
     opts: {order:[ids priority first], extraMonthly, lumps:[{month,amount}], escalation(%/yr), startDate}
     Returns per-month series, totals, milestones, per-debt payoff month.   */
  simulate(debts,opts){
    const N=debts.length;
    const bal=debts.map(d=>Math.max(0,d.balance));
    const startDate=opts.startDate||todayISO().slice(0,7)+'-01';
    const order=opts.order&&opts.order.length?opts.order.slice():debts.map(d=>d.id);
    const prio=id=>{const i=order.indexOf(id);return i<0?999:i};
    const idx=Object.fromEntries(debts.map((d,i)=>[d.id,i]));
    const paidOff=debts.map(()=>false);
    const months=[];const milestones=[];
    let totalInterest=0,month=0,extra=opts.extraMonthly||0;
    const lumpsByMonth={};(opts.lumps||[]).forEach(l=>{lumpsByMonth[l.month]=(lumpsByMonth[l.month]||0)+l.amount});
    const MAXM=1200;
    while(bal.some(b=>b>0)&&month<MAXM){
      const date=addMonths(startDate,month);
      if(month>0&&month%12===0&&opts.escalation)extra=Math.round(extra*(1+opts.escalation/100));
      const rec={date,perDebt:new Array(N),total:0,interest:0,principal:0,payment:0};
      // 1. interest
      for(let i=0;i<N;i++){
        if(bal[i]<=0){rec.perDebt[i]={balance:0,interest:0,principal:0,payment:0};continue}
        const d=debts[i];
        let intBase=bal[i];
        if(d.offset)intBase=Math.max(0,intBase-d.offset);
        let interest=0;
        const free=d.interestFreeUntil&&date<=d.interestFreeUntil;
        if(!free&&d.rate>0)interest=Math.round(intBase*(d.rate/100/12));
        const fees=d.fees||0;
        bal[i]+=interest+fees;
        totalInterest+=interest+fees;
        rec.interest+=interest+fees;
        rec.perDebt[i]={balance:0,interest:interest+fees,principal:0,payment:0};
      }
      // 2. minimums
      let pool=0;
      for(let i=0;i<N;i++){
        if(bal[i]<=0)continue;
        const pay=Math.min(bal[i],Math.round(debts[i].minMonthly));
        bal[i]-=pay;rec.perDebt[i].payment+=pay;rec.perDebt[i].principal+=pay-0;rec.payment+=pay;
      }
      // 3. freed minimums of already-paid-off debts roll into pool
      for(let i=0;i<N;i++)if(paidOff[i])pool+=Math.round(debts[i].minMonthly);
      // 4. extra + lumps + rolled minimums to priority debts
      pool+=extra+(lumpsByMonth[month]||0);
      const alive=()=>debts.map((d,i)=>i).filter(i=>bal[i]>0).sort((a,b)=>prio(debts[a].id)-prio(debts[b].id));
      let targets=alive();
      while(pool>0&&targets.length){
        const i=targets[0];
        const pay=Math.min(bal[i],pool);
        bal[i]-=pay;pool-=pay;rec.perDebt[i].payment+=pay;rec.payment+=pay;
        targets=alive();
      }
      // 5. record + milestones
      for(let i=0;i<N;i++){
        rec.perDebt[i].balance=bal[i];
        rec.perDebt[i].principal=rec.perDebt[i].payment-  (bal[i]<=0&&!paidOff[i]?0:0);
        if(bal[i]<=0&&!paidOff[i]){
          paidOff[i]=true;
          const rolls=Math.round(debts[i].minMonthly);
          milestones.push({date,text:`${debts[i].name} paid off`+(bal.some(b=>b>0)&&rolls>0?`, ${fmt0(rolls)}/mo rolls into next debt`:''),debtId:debts[i].id});
        }
      }
      rec.total=sum(bal.map(b=>Math.max(0,b)));
      months.push(rec);
      month++;
    }
    const payoffMonth={};debts.forEach((d,i)=>{
      const m=months.findIndex(r=>r.perDebt[i].balance<=0);
      payoffMonth[d.id]=m<0?months.length:m;
    });
    return {months,totalInterest,debtFreeDate:months.length?months[months.length-1].date:startDate,
            totalMonths:months.length,payoffMonth,milestones,capped:month>=MAXM,idx};
  },
  buildSimDebts(){
    return state.debts.map(d=>({
      id:d.id,name:d.name,balance:d.balance,rate:d.rate||0,
      minMonthly:ENGINE.minMonthly(d),fees:d.fees||0,
      interestFreeUntil:d.interestFreeUntil||'',offset:ENGINE.offsetBal(d)
    }));
  },
  freqMonthly(amount,freq){return Math.round(amount*({weekly:52,fortnightly:26,monthly:12,annually:1}[freq]||12)/12)},
  incomeMonthly(){return sum(state.incomes.map(i=>ENGINE.freqMonthly(i.amount,i.freq)))},
  billsMonthly(){return Math.round(ENGINE.billsSummary().final*52/12)},
  minimumsMonthly(){return sum(state.debts.map(d=>Math.round(ENGINE.minMonthly(d))))},
  budgetSpendMonthly(){
    if(state.settings.spendMode==='manual')return{amount:state.settings.spendManual||0,src:'manual'};
    if(state.settings.spendMode==='budget'){
      const t=ENGINE.budgetSpendFromBudget();
      return{amount:t,src:'budget'};
    }
    if(state.settings.spendMode==='actuals')return{amount:ENGINE.budgetSpendFromActuals(),src:'actuals'};
    return ENGINE.budgetSpendAuto();
  },
  budgetSpendFromBudget(){
    const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
    const bud=state.budgets[monthKey(todayISO())];
    let t=0;
    for(const cid in (bud||{})){
      const c=byId(state.categories,cid);
      if(!c||c.group==='Income'||c.group==='Transfers'||billCats.has(cid))continue;
      t+=bud[cid];
    }
    return t;
  },
  budgetSpendFromActuals(){
    const billCats=new Set(Object.keys(ENGINE.billBackedCats()));
    const n=clamp(state.settings.spendMonths||3,1,12);
    let t=0;
    for(let m=1;m<=n;m++){
      const mk=monthKey(addMonths(todayISO(),-m));
      for(const tx of state.transactions){
        if(tx.amount>=0||monthKey(tx.date)!==mk)continue;
        const acct=byId(state.accounts,tx.accountId);
        if(acct&&!acctType(acct).asset)continue;
        const c=byId(state.categories,tx.categoryId);
        if(!c||c.group==='Income'||c.group==='Transfers'||billCats.has(tx.categoryId))continue;
        t+=-tx.amount;
      }
    }
    return Math.round(t/n);
  },
  budgetSpendAuto(){
    const b=ENGINE.budgetSpendFromBudget();
    if(b>0)return{amount:b,src:'budget'};
    return{amount:ENGINE.budgetSpendFromActuals(),src:'actuals'};
  },
  /* A debt ticked "fund from the weekly bills transfer" owns an auto-managed
     bill: amount, frequency and account are derived from the debt and kept in
     step with it. An existing hand-made bill already linked to the debt is
     adopted rather than duplicated. Unticking removes only the auto-managed
     bill - a hand-made one is left alone. */
  syncDebtBills(){
    let changed=false;
    for(const d of state.debts){
      let bill=state.bills.find(b=>b.autoFrom===d.id)||state.bills.find(b=>b.debtId===d.id);
      if(d.viaBills){
        const derived={name:d.name+' repayment',amount:d.minAmount||0,freq:d.minFreq||'monthly',
          everyN:1,debtId:d.id,inTransfer:true,autoFrom:d.id,active:true,
          accountId:state.settings.billsAccountId||''};
        if(d.categoryId)derived.categoryId=d.categoryId;
        if(bill){
          const before=JSON.stringify([bill.name,bill.amount,bill.freq,bill.debtId,bill.inTransfer,bill.autoFrom,bill.active]);
          Object.assign(bill,derived);
          if(!bill.nextDue)bill.nextDue=addDays(todayISO(),7);
          if(JSON.stringify([bill.name,bill.amount,bill.freq,bill.debtId,bill.inTransfer,bill.autoFrom,bill.active])!==before)changed=true;
        }else{
          state.bills.push({id:uid(),categoryId:d.categoryId||'',method:'',notes:'',matchKeyword:d.matchKeyword||'',
            autoAdvance:true,nextDue:addDays(todayISO(),7),...derived});
          changed=true;
        }
      }else if(bill&&bill.autoFrom===d.id){
        state.bills=state.bills.filter(b=>b.id!==bill.id);changed=true;
      }
    }
    const ids=new Set(state.debts.map(d=>d.id));
    const n=state.bills.length;
    state.bills=state.bills.filter(b=>!b.autoFrom||ids.has(b.autoFrom));
    if(state.bills.length!==n)changed=true;
    return changed;
  },
  paySplit(){
    const income=ENGINE.incomeMonthly();
    const bills=ENGINE.billsMonthly();
    // a debt whose repayment is routed through the bills account (bill linked
    // via "Funds debt repayment of", still in the transfer) is already inside
    // the bills line - excluding its minimum here prevents the double count
    const funding={};
    for(const b of state.bills)if(b.active!==false&&b.inTransfer!==false&&b.debtId&&!funding[b.debtId])funding[b.debtId]=b;
    let mins=0,minsCovered=0;const minsWarns=[];
    for(const d of state.debts){
      const m=Math.round(ENGINE.minMonthly(d));
      const b=funding[d.id];
      if(b){
        minsCovered+=m;
        const bm=Math.round(ENGINE.billWeekly(b)*52/12);
        if(bm<m*0.95)minsWarns.push({name:d.name,billM:bm,minM:m});
      }else mins+=m;
    }
    const spend=ENGINE.budgetSpendMonthly();
    const surplus=income-bills-mins-spend.amount;
    return{income,bills,mins,minsCovered,minsWarns,spend:spend.amount,spendSrc:spend.src,surplus};
  },
  surplusMonthly(){return ENGINE.paySplit().surplus},
  allocAmounts(){
    const s=Math.max(0,ENGINE.surplusMonthly());
    const a=state.settings.alloc||{debt:70,goals:20,keep:10};
    return{debt:Math.round(s*a.debt/100),goals:Math.round(s*a.goals/100),keep:Math.round(s*a.keep/100),surplus:s};
  },
  billPayments(b){
    // comma-separated keywords ("TRANSPORT WA, BPAY REGO") - any match counts.
    // Manually linked transactions (t.billId) count regardless of description.
    const kws=(b.matchKeyword||'').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    return state.transactions.filter(t=>t.amount<0&&(t.billId===b.id||kws.some(k=>t.payee.toUpperCase().includes(k)))).sort((a,b2)=>a.date<b2.date?1:-1);
  },
  /* payments within 3 days of each other are ONE payment event - a rego paid
     as two part-payments by different methods sums to a single event */
  billPaymentEvents(b){
    // clustering rules: manual links always participate; keyword matches under
    // 10% of the bill are incidental noise and never join; >=90% is a full
    // payment standing alone; 10-90% are part-payments that merge with
    // neighbours within 3 days (a rego paid two ways sums to one event)
    const pays=ENGINE.billPayments(b); // desc by date
    const events=[];
    for(const p of pays){
      const manual=p.billId===b.id;
      const a=Math.abs(p.amount);
      if(!manual&&b.amount&&a<b.amount*0.1)continue;   // noise
      const partial=manual||!b.amount||a<b.amount*0.9; // can this merge?
      const ev=events[events.length-1];
      if(partial&&ev&&ev.open&&Math.abs(daysBetween(p.date,ev.date))<=3){ev.total+=a;ev.txs.push(p);if(manual)ev.manual=true}
      else events.push({date:p.date,total:a,txs:[p],manual,open:partial});
    }
    events.forEach(e=>delete e.open);
    return events;
  },
  billDrift(b){
    // events feed the drift average. Plausibility filter (50%-200% of the
    // registered amount) keeps incidental keyword matches out, but manually
    // linked events are always trusted.
    const evs=ENGINE.billPaymentEvents(b).filter(e=>e.manual||(e.total>=b.amount*0.5&&e.total<=b.amount*2)).slice(0,3);
    if(evs.length<2)return null;
    const avg=Math.round(sum(evs.map(e=>e.total))/evs.length);
    const pc=b.amount?((avg-b.amount)/b.amount*100):0;
    return{avg,pc,n:evs.length,last:evs[0]};
  },
  autoAdvanceBills(){
    // a matched payment near the due date marks the bill paid automatically.
    // Guards: keyword + auto-advance enabled, amount within 30% of the
    // registered amount, dated within [due-10d, due+14d], each transaction
    // consumed at most once, max 12 advances per bill per pass.
    let advanced=0;
    for(const b of state.bills){
      if(b.active===false||!b.autoAdvance||!(b.matchKeyword||'').trim())continue;
      b.consumedTx=b.consumedTx||[];
      const used=new Set(b.consumedTx);
      for(let i=0;i<12;i++){
        const lo=addDays(b.nextDue,-10),hi=addDays(b.nextDue,14);
        if(lo>todayISO())break; // due window entirely in the future
        const m=ENGINE.billPaymentEvents(b).find(e=>e.txs.every(t=>!used.has(t.id))&&e.date>=lo&&e.date<=hi&&(e.manual||Math.abs(e.total-b.amount)<=Math.round(b.amount*0.3)));
        if(!m)break;
        for(const t of m.txs){used.add(t.id);b.consumedTx.push(t.id)}
        if(b.consumedTx.length>50)b.consumedTx=b.consumedTx.slice(-50);
        b.nextDue=advanceBill(b.nextDue,b.freq,b.everyN);
        advanced++;
      }
    }
    return advanced;
  },
  debtBalance(d){
    if(d.linkedAccountId){
      const a=byId(state.accounts,d.linkedAccountId);
      if(a)return Math.abs(a.balance);
    }
    return d.balance;
  },
  debtPayments(d){
    const kw=(d.matchKeyword||'').trim().toUpperCase();
    const isLiab=t=>{const a=byId(state.accounts,t.accountId);return a&&!acctType(a).asset};
    const onLoanAcct=t=>!!d.linkedAccountId&&t.accountId===d.linkedAccountId;
    const isPayment=t=>{
      if(!(t.debtId===d.id||(kw&&t.payee.toUpperCase().includes(kw))))return false;
      // credits count as repayments ONLY on this debt's explicitly linked loan
      // account (set in the debt form). Credits on any other liability account
      // (e.g. a matching description on a credit card) are ignored. Debits on
      // liability accounts (interest, fees) never count. Otherwise: outgoing
      // debits from spending accounts are repayments.
      if(onLoanAcct(t))return t.amount>0;
      if(isLiab(t))return false;
      return t.amount<0;
    };
    let list=state.transactions.filter(isPayment);
    // both-sides dedupe: when the SAME repayment is imported twice (debit out
    // of the everyday account AND credit onto the linked loan account), keep
    // the spending-side debit and drop the loan-side credit. Pairing = equal
    // absolute amount within 5 days, each debit consuming at most one credit.
    const debits=list.filter(t=>!isLiab(t));
    const credits=list.filter(t=>onLoanAcct(t));
    const used=new Set();
    for(const db of debits){
      const m=credits.find(cr=>!used.has(cr.id)&&Math.abs(cr.amount)===Math.abs(db.amount)&&Math.abs(daysBetween(db.date,cr.date))<=5);
      if(m)used.add(m.id);
    }
    list=list.filter(t=>!used.has(t.id));
    return list.sort((a,b)=>a.date<b.date?1:-1);
  },
  debtPayStats(d){
    const pays=ENGINE.debtPayments(d);
    const cut=addMonths(todayISO(),-3);
    const recent=pays.filter(p=>p.date>=cut);
    const avgMo=recent.length?Math.round(sum(recent.map(p=>Math.abs(p.amount)))/3):0;
    const minMo=Math.round(ENGINE.minMonthly(d));
    return{pays,count:pays.length,total:sum(pays.map(p=>Math.abs(p.amount))),last:pays[0]||null,avgMo,minMo};
  },
  scenarioOpts(sc){
    const perYear={weekly:52,fortnightly:26,monthly:12}[sc.extraFreq||'monthly']||12;
    const start=todayISO().slice(0,7)+'-01';
    return {
      order:ENGINE.orderFor(sc),
      extraMonthly:sc.extraMode==='surplus'?ENGINE.allocAmounts().debt:Math.round((sc.extra||0)*perYear/12),
      lumps:(sc.lumps||[]).map(l=>({month:Math.max(0,Math.round(daysBetween(start,l.date)/30.44)),amount:l.amount})),
      escalation:sc.escalation||0,startDate:start
    };
  },
  orderFor(sc){
    const ds=state.debts.slice();
    if(sc.strategy==='avalanche')ds.sort((a,b)=>(b.rate||0)-(a.rate||0));
    else if(sc.strategy==='snowball')ds.sort((a,b)=>a.balance-b.balance);
    else if(sc.order&&sc.order.length)return sc.order.filter(id=>byId(state.debts,id)).concat(ds.map(d=>d.id).filter(id=>!sc.order.includes(id)));
    return ds.map(d=>d.id);
  },
  baseline(){return ENGINE.simulate(ENGINE.buildSimDebts(),{order:state.debts.map(d=>d.id),extraMonthly:0,lumps:[],startDate:todayISO().slice(0,7)+'-01'})},
  amortPayment(P,ratePct,years){
    const r=ratePct/100/12,n=Math.max(1,Math.round(years*12));
    return r>0?Math.round(P*r/(1-Math.pow(1+r,-n))):Math.round(P/n);
  },
  consolidate(cfg){
    const sel=state.debts.filter(d=>cfg.debtIds.includes(d.id)&&d.balance>0);
    if(sel.length<2)return null;
    const others=ENGINE.buildSimDebts().filter(sd=>!cfg.debtIds.includes(sd.id));
    const P=sum(sel.map(d=>d.balance))+(cfg.fees||0);
    const pay=ENGINE.amortPayment(P,cfg.rate,cfg.years);
    const newDebt={id:'__consol',name:'Consolidated loan',balance:P,rate:cfg.rate,minMonthly:pay,fees:0,interestFreeUntil:'',offset:0};
    const start=todayISO().slice(0,7)+'-01';
    const setB=[newDebt,...others];
    const orderB=setB.slice().sort((a,b)=>b.rate-a.rate).map(d=>d.id);
    const A=ENGINE.baseline();
    const B=ENGINE.simulate(setB.map(d=>({...d})),{order:orderB,extraMonthly:0,lumps:[],startDate:start});
    const curMins=sum(ENGINE.buildSimDebts().map(d=>Math.round(d.minMonthly)));
    const newMins=pay+sum(others.map(d=>Math.round(d.minMonthly)));
    const extraC=Math.max(0,curMins-newMins);
    const C=ENGINE.simulate(setB.map(d=>({...d})),{order:orderB,extraMonthly:extraC,lumps:[],startDate:start});
    return{sel,P,pay,curMins,newMins,extraC,A,B,C};
  },
  /* ---- Net worth ---- */
  netWorthSeries(){
    // combine monthly snapshots with per-account history
    const map=new Map(); // monthKey -> {assets, liab}
    for(const s of state.snapshots)map.set(monthKey(s.date),{assets:s.assets,liab:s.liabilities,date:s.date});
    // current
    const cur=ENGINE.netWorthNow();
    map.set(monthKey(todayISO()),{assets:cur.assets,liab:cur.liab,date:todayISO()});
    return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([mk,v])=>({mk,...v,net:v.assets-v.liab}));
  },
  netWorthNow(){
    let assets=0,liab=0;
    for(const a of activeAccounts()){
      if(isAsset(a))assets+=Math.max(0,a.balance);else liab+=Math.abs(a.balance);
    }
    return {assets,liab,net:assets-liab};
  },
  /* ---- Goals ---- */
  goalStats(g){
    const a=byId(state.accounts,g.accountId);
    const current=a?a.balance:(g.starting||0);
    const remaining=Math.max(0,g.target-current);
    const days=Math.max(1,daysBetween(todayISO(),g.targetDate||todayISO()));
    const perMonth=remaining/(days/30.44);
    const perFn=remaining/(days/14);
    // avg contribution from linked account history (last 90 days)
    let projDate=null;
    if(a&&a.history&&a.history.length>1){
      const hist=a.history.slice(-10);
      const first=hist[0],last=hist[hist.length-1];
      const dd=Math.max(1,daysBetween(first.date,last.date));
      const rate=(last.balance-first.balance)/dd; // cents/day
      if(rate>0&&remaining>0)projDate=addDays(todayISO(),Math.ceil(remaining/rate));
      else if(remaining<=0)projDate=todayISO();
    }
    return {current,remaining,perMonth,perFn,projDate,pct:g.target>0?clamp(current/g.target,0,1):0};
  },
  /* ---- Recurring transactions ---- */
  recurUpcoming(days=30){
    const out=[],start=todayISO();
    for(const r of state.recurring){
      let d=r.nextDate,guard=0;
      while(d&&daysBetween(start,d)<=days&&guard++<40){
        out.push({rec:r,date:d,overdue:daysBetween(start,d)<0});
        d=advanceBill(d,r.freq);
      }
    }
    return out.sort((a,b)=>a.date<b.date?-1:1);
  },
  applyRules(desc){
    const D=String(desc).toUpperCase();
    for(const r of state.rules){if(r.keyword&&D.includes(r.keyword.toUpperCase()))return r.categoryId}
    return '';
  }
};

/* ================================================================
   SECTION: CHARTS - hand-rolled SVG (no libraries)
   ================================================================ */
let chartQueue=[];
function chart(id,fn){chartQueue.push({id,fn});return`<div class="chart-slot chart-wrap" data-chart-id="${id}"></div>`}
function drawCharts(){
  for(const {id,fn} of chartQueue){
    const el=$(`[data-chart-id="${id}"]`);
    if(el)try{fn(el)}catch(e){console.warn('chart fail',id,e);el.innerHTML='<div class="dim" style="padding:20px;font-family:var(--mono);font-size:12px">chart unavailable</div>'}
  }
}
const CH={
  ticks(min,max,n=5){
    if(min===max){max=min+1}
    const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
    const norm=step0/mag;let step=mag*(norm<1.5?1:norm<3?2:norm<7?5:10);
    const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
    for(let v=lo;v<=hi+step/2;v+=step)out.push(v);
    return out;
  },
  money(v){
    const a=Math.abs(v);
    if(a>=100000000)return (v<0?'-':'')+'$'+(a/100000000).toFixed(1)+'M';
    if(a>=100000)return (v<0?'-':'')+'$'+Math.round(a/100000)+'k';
    return fmt0(v);
  },
  hiddenSet(id){if(!ui.chartHidden[id])ui.chartHidden[id]=new Set();return ui.chartHidden[id]},
  legend(chartId,items){
    const hid=CH.hiddenSet(chartId);
    return '<div class="legend">'+items.map((it,i)=>
      `<span class="li ${hid.has(i)?'off':''}" data-action="toggle-series" data-chart="${chartId}" data-idx="${i}"><span class="sw" style="background:${it.color}"></span>${esc(it.name)}</span>`).join('')+'</div>';
  },
  /* Generic xy line/area chart. cfg:{series:[{name,color,data:[y cents|null],dash?}],labels:[x],height,fillFirst,stacked:false,legendId} */
  line(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||220,P={l:56,r:10,t:12,b:26};
    const hid=cfg.legendId?CH.hiddenSet(cfg.legendId):new Set();
    const series=cfg.series.filter((s,i)=>!hid.has(i));
    const all=series.flatMap(s=>s.data.filter(v=>v!=null));
    if(!all.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    let min=Math.min(0,...all),max=Math.max(...all);
    const tks=CH.ticks(min,max,5);min=tks[0];max=tks[tks.length-1];
    const n=Math.max(...series.map(s=>s.data.length));
    const x=i=>P.l+(n<2?0.5:(i/(n-1)))*(W-P.l-P.r);
    const y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222" stroke-width="1"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" font-family="var(--mono)" text-anchor="end">${CH.money(t)}</text>`;
    if(min<0&&max>0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#3a3a3a"/>`;
    const lbls=cfg.labels||[],lstep=Math.ceil(lbls.length/Math.max(2,Math.floor((W-P.l)/62)));
    lbls.forEach((L,i)=>{if(i%lstep===0)g+=`<text x="${x(i)}" y="${H-8}" fill="#666" font-size="9.5" font-family="var(--mono)" text-anchor="middle">${esc(L)}</text>`});
    series.forEach((s,si)=>{
      const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
      if(!pts.length)return;
      const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      if(cfg.fillFirst&&si===0)g+=`<path d="${path} L ${pts[pts.length-1][0]} ${y(Math.max(min,0))} L ${pts[0][0]} ${y(Math.max(min,0))} Z" fill="${s.color}" opacity="0.10"/>`;
      g+=`<path class="anim" d="${path}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      s.data.forEach((v,i)=>{if(v==null)return;
        g+=`<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent" data-tip="${esc((lbls[i]?lbls[i]+'\n':'')+s.name+': '+fmt(v))}"/><circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${s.color}"/>`;
      });
    });
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series):'');
  },
  /* Stacked area: cfg{series:[{name,color,data[]}],labels,overlays:[{name,color,data,dash}],height,legendId} */
  stackedArea(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||260,P={l:60,r:10,t:12,b:26};
    const hid=cfg.legendId?CH.hiddenSet(cfg.legendId):new Set();
    const series=cfg.series.filter((s,i)=>!hid.has(i));
    const n=Math.max(0,...series.map(s=>s.data.length),...(cfg.overlays||[]).map(o=>o.data.length));
    if(!n){el.innerHTML='<div class="empty">No data yet</div>';return}
    const stackTops=[];let base=new Array(n).fill(0);
    for(const s of series){const top=s.data.map((v,i)=>(base[i]||0)+(v||0));stackTops.push({s,lo:base.slice(),hi:top});base=top}
    const overlayMax=Math.max(0,...(cfg.overlays||[]).flatMap(o=>o.data.filter(v=>v!=null)));
    const max=Math.max(overlayMax,...base,1);
    const tks=CH.ticks(0,max,5),top=tks[tks.length-1];
    const x=i=>P.l+(n<2?0.5:(i/(n-1)))*(W-P.l-P.r);
    const y=v=>P.t+(1-v/top)*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" text-anchor="end" font-family="var(--mono)">${CH.money(t)}</text>`;
    const lbls=cfg.labels||[],lstep=Math.ceil(lbls.length/Math.max(2,Math.floor((W-P.l)/62)));
    lbls.forEach((L,i)=>{if(i%lstep===0)g+=`<text x="${x(i)}" y="${H-8}" fill="#666" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${esc(L)}</text>`});
    for(const st of stackTops){
      const up=st.hi.map((v,i)=>[x(i),y(v)]),down=st.lo.map((v,i)=>[x(i),y(v)]).reverse();
      const d='M'+up.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+' L '+down.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+' Z';
      g+=`<path class="anim" d="${d}" fill="${st.s.color}" opacity="0.55" stroke="${st.s.color}" stroke-width="1"><title>${esc(st.s.name)}</title></path>`;
    }
    for(const o of cfg.overlays||[]){
      const pts=o.data.map((v,i)=>v==null?null:[x(i),y(Math.min(v,top))]).filter(Boolean);
      if(pts.length)g+=`<path class="anim" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${o.color}" stroke-width="2" ${o.dash?'stroke-dasharray="5 4"':''}/>`;
    }
    // hover columns
    for(let i=0;i<n;i++){
      const tot=base[i]||0;
      let tip=(lbls[i]||'')+'\nTotal: '+fmt(tot);
      series.forEach(s=>{if(s.data[i])tip+='\n'+s.name+': '+fmt(s.data[i])});
      g+=`<rect x="${x(i)-((W-P.l-P.r)/Math.max(1,n-1))/2}" y="${P.t}" width="${(W-P.l-P.r)/Math.max(1,n-1)}" height="${H-P.t-P.b}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series.concat(cfg.overlays||[])):'');
  },
  /* Bars: cfg{groups:[{label,values:[cents]}],series:[{name,color}],stacked,height,line:{name,color,data,rightPct},legendId} */
  bars(el,cfg){
    const W=Math.max(280,el.clientWidth||500),H=cfg.height||240,P={l:60,r:cfg.line?46:10,t:12,b:26};
    const groups=cfg.groups||[];
    if(!groups.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    let min=0,max=1;
    for(const gr of groups){
      if(cfg.stacked){const pos=sum(gr.values.filter(v=>v>0)),neg=sum(gr.values.filter(v=>v<0));max=Math.max(max,pos);min=Math.min(min,neg)}
      else{max=Math.max(max,...gr.values);min=Math.min(min,...gr.values,0)}
    }
    const tks=CH.ticks(min,max,5);min=tks[0];max=tks[tks.length-1];
    const x0=i=>P.l+i*((W-P.l-P.r)/groups.length);
    const bw=(W-P.l-P.r)/groups.length;
    const y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fade">`;
    for(const t of tks)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222"/><text x="${P.l-6}" y="${y(t)+3.5}" fill="#666" font-size="10" text-anchor="end" font-family="var(--mono)">${CH.money(t)}</text>`;
    const lstep=Math.ceil(groups.length/Math.max(2,Math.floor((W-P.l)/58)));
    groups.forEach((gr,i)=>{
      if(i%lstep===0)g+=`<text x="${x0(i)+bw/2}" y="${H-8}" fill="#666" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${esc(gr.label)}</text>`;
      const nS=gr.values.length;
      if(cfg.stacked){
        let up=0,dn=0;
        gr.values.forEach((v,si)=>{
          if(!v)return;const col=cfg.series[si].color;
          let yA,hA;
          if(v>0){yA=y(up+v);hA=y(up)-y(up+v);up+=v}else{yA=y(dn);hA=y(dn+v)-y(dn);dn+=v}
          g+=`<rect class="anim" x="${x0(i)+bw*0.12}" y="${yA}" width="${bw*0.76}" height="${Math.max(0.5,hA)}" fill="${col}" opacity="0.85" data-tip="${esc(gr.label+'\n'+cfg.series[si].name+': '+fmt(v))}"/>`;
        });
      }else{
        const sw=bw*0.76/nS;
        gr.values.forEach((v,si)=>{
          const col=cfg.series[si].color,yy=Math.min(y(0),y(v)),hh=Math.abs(y(v)-y(0));
          g+=`<rect class="anim" x="${x0(i)+bw*0.12+si*sw}" y="${yy}" width="${sw*0.9}" height="${Math.max(0.5,hh)}" fill="${col}" opacity="0.9" data-tip="${esc(gr.label+'\n'+cfg.series[si].name+': '+fmt(v))}"/>`;
        });
      }
    });
    if(min<0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#3a3a3a"/>`;
    if(cfg.line){
      const yr=v=>P.t+(1-v/100)*(H-P.t-P.b);
      const pts=cfg.line.data.map((v,i)=>v==null?null:[x0(i)+bw/2,yr(clamp(v,-10,100))]).filter(Boolean);
      if(pts.length)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${cfg.line.color}" stroke-width="2" stroke-dasharray="4 3"/>`;
      cfg.line.data.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${x0(i)+bw/2}" cy="${yr(clamp(v,-10,100))}" r="6" fill="transparent" data-tip="${esc(groups[i].label+'\n'+cfg.line.name+': '+v.toFixed(1)+'%')}"/><circle cx="${x0(i)+bw/2}" cy="${yr(clamp(v,-10,100))}" r="2" fill="${cfg.line.color}"/>`});
      for(const p of [0,25,50,75,100])g+=`<text x="${W-P.r+6}" y="${yr(p)+3.5}" fill="#555" font-size="9" font-family="var(--mono)">${p}%</text>`;
    }
    el.innerHTML=g+'</svg>'+(cfg.legendId?CH.legend(cfg.legendId,cfg.series.concat(cfg.line?[cfg.line]:[])):'');
  },
  /* Donut: cfg{items:[{name,value,color}],size,centerLabel,centerValue} */
  donut(el,cfg){
    const items=(cfg.items||[]).filter(i=>i.value>0);
    if(!items.length){el.innerHTML='<div class="empty">No data yet</div>';return}
    const size=cfg.size||190,R=size/2-6,r=R*0.62,cx=size/2,cy=size/2,total=sum(items.map(i=>i.value));
    let a0=-Math.PI/2,g=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="fade" style="flex:none">`;
    for(const it of items){
      const frac=it.value/total,a1=a0+frac*Math.PI*2;
      const large=frac>0.5?1:0;
      const p=(ang,rad)=>[cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad];
      const [x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);
      g+=`<path class="anim" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r} ${r} 0 ${large} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${it.color}" opacity="0.88" stroke="#0d0d0d" stroke-width="1.5" data-tip="${esc(it.name+'\n'+fmt(it.value)+' ('+(frac*100).toFixed(1)+'%)')}"/>`;
      a0=a1;
    }
    if(cfg.centerLabel)g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#9a9a9a" font-size="9" font-family="Rajdhani,'Segoe UI'" letter-spacing="2" text-transform="uppercase">${esc(cfg.centerLabel)}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" fill="#e5e5e5" font-size="13" font-weight="700" font-family="var(--mono)">${esc(cfg.centerValue||'')}</text>`;
    g+='</svg>';
    const leg='<div>'+items.map(it=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;font-family:var(--mono);font-size:12.5px"><span class="sw" style="width:10px;height:10px;border-radius:2px;background:${it.color};flex:none"></span><span style="color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</span><span style="margin-left:auto">${fmt0(it.value)}</span></div>`).join('')+'</div>';
    el.innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${g}<div style="flex:1;min-width:170px">${leg}</div></div>`;
  },
  spark(points,w=110,h=30,color){
    if(!points||!points.length)return`<svg width="${w}" height="${h}" class="spark"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="#2a2a2a"/></svg>`;
    if(points.length===1)return`<svg width="${w}" height="${h}" class="spark"><line x1="1" x2="${w-1}" y1="${h/2}" y2="${h/2}" stroke="${color||CONFIG.colors.or}" stroke-width="1.5"/><circle cx="${w-3}" cy="${h/2}" r="2.5" fill="${color||CONFIG.colors.or}"/></svg>`;
    const min=Math.min(...points),max=Math.max(...points);
    const x=i=>(i/(points.length-1))*(w-2)+1;
    const y=v=>1+(1-(v-min)/(max-min||1))*(h-2);
    const d=points.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    return`<svg width="${w}" height="${h}" class="spark"><path d="${d}" fill="none" stroke="${color||CONFIG.colors.or}" stroke-width="1.5"/></svg>`;
  },
  ring(pctv,size=74,color){
    const R=size/2-6,c=2*Math.PI*R,off=c*(1-clamp(pctv,0,1));
    return`<svg width="${size}" height="${size}" class="fade"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#232323" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color||CONFIG.colors.or}" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/><text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" fill="#e5e5e5" font-size="${size/5.2}" font-weight="700" font-family="var(--mono)">${Math.round(pctv*100)}%</text></svg>`;
  },
  /* Heat map: daily spend intensity. cfg{days:{iso:cents},from,to} */
  heat(el,cfg){
    const from=cfg.from,to=cfg.to,vals=Object.values(cfg.days);
    const max=Math.max(1,...vals);
    const cell=13,gap=3;
    const start=addDays(from,-((new Date(from+'T00:00:00').getDay()+6)%7)); // back to Monday
    const totalDays=daysBetween(start,to)+1,weeks=Math.ceil(totalDays/7);
    const W=Math.min(Math.max(el.clientWidth||600,300),weeks*(cell+gap)+60),H=7*(cell+gap)+34;
    let g=`<svg viewBox="0 0 ${weeks*(cell+gap)+46} ${H}" width="100%" height="${H}" class="fade" preserveAspectRatio="xMinYMin">`;
    const dows=['M','T','W','T','F','S','S'];
    dows.forEach((d,i)=>g+=`<text x="8" y="${22+i*(cell+gap)+cell-3}" fill="#555" font-size="8.5" font-family="var(--mono)">${d}</text>`);
    let lastM='';
    for(let i=0;i<weeks*7;i++){
      const d=addDays(start,i);
      if(d>to)break;
      const wk=Math.floor(i/7),dow=i%7;
      const mk=d.slice(5,7);
      if(dow===0&&mk!==lastM){lastM=mk;g+=`<text x="${20+wk*(cell+gap)}" y="12" fill="#666" font-size="8.5" font-family="var(--mono)">${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+mk-1]}</text>`}
      if(d<from){g+=`<rect x="${20+wk*(cell+gap)}" y="${18+dow*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="#141414"/>`;continue}
      const v=cfg.days[d]||0,t=v/max;
      const col=v===0?'#1a1a1a':`rgba(249,115,22,${(0.15+t*0.85).toFixed(2)})`;
      g+=`<rect x="${20+wk*(cell+gap)}" y="${18+dow*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${col}" data-tip="${esc(fmtD(d)+'\n'+fmt(v))}"/>`;
    }
    el.innerHTML=g+'</svg>';
  }
};

const MODAL={
  _resolve:null,_prevFocus:null,
  open({title,body,footer,wide,onMount}){
    MODAL._prevFocus=document.activeElement;
    const layer=$('#modal-layer');
    layer.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
      <div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-action="modal-close" aria-label="Close">&times;</button></div>
      <div class="modal-b">${body}</div>
      ${footer!==false?`<div class="modal-f">${footer||'<button class="btn" data-action="modal-close">Cancel</button>'}</div>`:''}
    </div>`;
    layer.classList.add('open');
    const first=$('.modal-b input,.modal-b select,.modal-b textarea,.modal-b button',layer);
    if(first)setTimeout(()=>first.focus(),30);
    if(onMount)onMount(layer);
  },
  close(){
    $('#modal-layer').classList.remove('open');$('#modal-layer').innerHTML='';
    if(MODAL._resolve){MODAL._resolve(false);MODAL._resolve=null}
    if(MODAL._prevFocus&&MODAL._prevFocus.focus)MODAL._prevFocus.focus();
  },
  confirm(title,msg,{danger=false,okLabel='Confirm',typed=null}={}){
    return new Promise(res=>{
      MODAL._resolve=res;
      MODAL.open({title,
        body:`<p style="color:var(--tx2);line-height:1.6">${msg}</p>${typed?`<label class="f" style="margin-top:14px"><span class="fl">Type "${esc(typed)}" to confirm</span><input id="typed-confirm" autocomplete="off"></label>`:''}`,
        footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="confirm-ok" data-action="modal-confirm" ${typed?'disabled':''}>${esc(okLabel)}</button>`,
        onMount(layer){
          if(typed)$('#typed-confirm',layer).addEventListener('input',e=>{$('#confirm-ok',layer).disabled=e.target.value.trim()!==typed});
        }
      });
    });
  }
};
function modalFormValues(){
  const out={};
  $$('#modal-layer [name]').forEach(el=>{
    if(el.type==='checkbox')out[el.name]=el.checked;
    else out[el.name]=el.value;
  });
  return out;
}

/* ---- shared small components ---- */
function emptyBox(icon,msg,btn){return`<div class="empty"><div class="big-i">${icon}</div><p>${msg}</p>${btn||''}</div>`}
function dueBadge(days){
  if(days<0)return`<span class="badge rd">OVERDUE ${-days}d</span>`;
  if(days===0)return`<span class="badge rd">DUE TODAY</span>`;
  if(days<=7)return`<span class="badge am">DUE IN ${days}d</span>`;
  return`<span class="badge">DUE IN ${days}d</span>`;
}
function statCard(label,value,cls,sub){return`<div class="card"><div class="sec-label">${label}</div><div class="num big ${cls||''}" style="margin-top:6px">${value}</div>${sub?`<div class="dim" style="font-size:12px;margin-top:4px;font-family:var(--mono)">${sub}</div>`:''}</div>`}

const VIEWS={};

/* ---------------- DASHBOARD ---------------- */
VIEWS.dashboard=()=>{
  const nw=ENGINE.netWorthNow(),bs=ENGINE.billsSummary();
  const mk=monthKey(todayISO()),act=ENGINE.monthActuals(mk);
  let inc=0,exp=0;
  for(const t of state.transactions){if(monthKey(t.date)!==mk)continue;if(t.amount>0)inc+=t.amount;else exp+=-t.amount}
  const upcoming=ENGINE.upcomingBills(14);
  const bl=state.debts.length?ENGINE.baseline():null;
  // net worth mini series
  const nws=ENGINE.netWorthSeries();
  let h=`<div class="grid g4" style="margin-bottom:14px">
    ${statCard('Net Worth',fmtS(nw.net),nw.net>=0?'pos':'neg','Assets '+fmt0(nw.assets)+' / Debt '+fmt0(nw.liab))}
    <div class="card" style="border-color:var(--or)"><div class="sec-label acc">Weekly Bills Transfer</div><div class="num big acc" style="margin-top:6px">${fmt(bs.final)}</div><div class="dim" style="font-size:12px;margin-top:4px;font-family:var(--mono)">${bs.count} active bills &middot; <span data-action="nav" data-view="bills" style="cursor:pointer;color:var(--or)">open bills &rarr;</span></div></div>
    ${statCard('This Month In',fmt(inc),'pos',fmtMY(mk+'-01'))}
    ${statCard('This Month Out',fmt(exp),exp>inc?'neg':'','Surplus '+fmtS(inc-exp))}
  </div>`;
  h+=`<div class="grid g2">`;
  h+=`<div class="card"><h3>Net Worth Trend</h3>${nws.length>1?chart('dash-nw',el=>CH.line(el,{labels:nws.map(s=>fmtMY(s.mk+'-01')),series:[{name:'Net worth',color:CONFIG.colors.or,data:nws.map(s=>s.net)}],fillFirst:true,height:200})):emptyBox('\u03A3','Add accounts and take snapshots to build your net worth history.')}</div>`;
  h+=`<div class="card"><h3>Upcoming Bills <span class="r dim" style="font-family:var(--mono);font-size:11px">NEXT 14 DAYS</span></h3>`;
  if(!upcoming.length)h+=emptyBox('\u2261','No bills due in the next fortnight.');
  else{h+='<table><tbody>'+upcoming.slice(0,8).map(u=>`<tr><td>${esc(u.bill.name)}</td><td class="mut">${fmtD(u.bill.nextDue)}</td><td class="r">${fmt(u.bill.amount)}</td><td class="r">${dueBadge(u.days)}</td></tr>`).join('')+'</tbody></table>'}
  h+=`</div>`;
  // debt snapshot
  if(state.debts.length&&bl){
    const totDebt=sum(state.debts.map(d=>d.balance));
    h+=`<div class="card"><h3>Debt Position</h3>
      <div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px">
        <div><div class="sec-label">Total Debt</div><div class="num big neg">${fmt(totDebt)}</div></div>
        <div><div class="sec-label">Debt-free (minimums)</div><div class="num big">${fmtMY(bl.debtFreeDate)}</div></div>
        <div><div class="sec-label">Interest at minimums</div><div class="num big am" style="color:var(--am)">${fmt0(bl.totalInterest)}</div></div>
      </div>
      <div class="dim" style="font-size:12px">Run scenarios in the <span data-action="nav" data-view="payoff" style="color:var(--or);cursor:pointer">Payoff Planner</span> to beat these numbers.</div></div>`;
  } else h+=`<div class="card"><h3>Debt Position</h3>${emptyBox('\u25BC','No debts registered - lucky you, or add them to unlock the Payoff Planner.',`<button class="btn sm" data-action="nav" data-view="debts">Open Debts</button>`)}</div>`;
  // recent transactions
  const recent=state.transactions.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,8);
  h+=`<div class="card"><h3>Recent Transactions</h3>`;
  if(!recent.length)h+=emptyBox('\u21C6','No transactions yet - add some or import a bank CSV.',`<button class="btn sm" data-action="nav" data-view="transactions">Open Transactions</button>`);
  else h+='<table><tbody>'+recent.map(t=>`<tr><td class="mut">${fmtD(t.date)}</td><td>${esc(t.payee)}</td><td class="mut">${esc(catShort(t.categoryId))}</td><td class="r ${t.amount>=0?'pos':''}">${fmtS(t.amount)}</td></tr>`).join('')+'</tbody></table>';
  h+='</div></div>';
  return h;
};

/* ---------------- ACCOUNTS ---------------- */
function acctCmp(a,b){
  const k=ui.acctSort;
  if(k==='balance')return b.balance-a.balance;
  const last=(x,y)=>(!x&&y)?1:(x&&!y)?-1:0; // empties sort last
  if(k==='institution')return last(a.institution,b.institution)||(a.institution||'').localeCompare(b.institution||'')||a.name.localeCompare(b.name);
  if(k==='type')return acctType(a).n.localeCompare(acctType(b).n)||a.name.localeCompare(b.name);
  if(k==='group')return last(a.group,b.group)||(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name);
  return a.name.localeCompare(b.name);
}
VIEWS.accounts=()=>{
  const list=state.accounts.slice().sort((a,b)=>((a.archived?1:0)-(b.archived?1:0))||acctCmp(a,b));
  let h=`<div class="toolbar"><button class="btn primary" data-action="account-add">+ Add Account</button>
    <span class="sec-label" style="margin-left:8px">Group</span>
    <select data-change="acct-group" style="width:130px">${[['institution','Institution'],['custom','Custom group'],['type','Account type'],['assetliab','Assets / Debts'],['none','No grouping']].map(([v,n])=>`<option value="${v}" ${ui.acctGroup===v?'selected':''}>${n}</option>`).join('')}</select>
    <span class="sec-label">Sort</span>
    <select data-change="acct-sort" style="width:120px">${[['name','Name'],['balance','Balance'],['institution','Institution'],['type','Type'],['group','Custom group']].map(([v,n])=>`<option value="${v}" ${ui.acctSort===v?'selected':''}>${n}</option>`).join('')}</select>
    <span class="spacer"></span><span class="dim" style="font-family:var(--mono);font-size:12px">${activeAccounts().length} active</span></div>`;
  if(!list.length)return h+emptyBox('\u25A4','No accounts yet. Add your everyday, savings, and loan accounts to get started.','<button class="btn" data-action="account-add">Add your first account</button>');
  const groupKey=a=>ui.acctGroup==='institution'?(a.institution||'No institution')
    :ui.acctGroup==='custom'?(a.group||'Ungrouped')
    :ui.acctGroup==='type'?acctType(a).n
    :ui.acctGroup==='assetliab'?(acctType(a).asset?'Assets':'Debts')
    :'';
  const groups=new Map();
  for(const a of list){const k=groupKey(a);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a)}
  for(const [g,accts] of groups){
    if(g!==''){
      const net=sum(accts.filter(a=>!a.archived).map(a=>a.balance));
      h+=`<div class="group-head"><span class="sec-label" style="font-size:12px;color:var(--tx2)">${esc(g)}</span><span class="dim" style="font-family:var(--mono);font-size:12.5px">${accts.length} account${accts.length>1?'s':''}</span><span class="spacer"></span><span class="num" style="font-size:14px;font-weight:700;color:${net<0?'var(--rd)':'var(--gn)'}">${fmtS(net)}</span></div>`;
    }
    h+='<div class="grid g3" style="margin-bottom:16px">';
    for(const a of accts){
    const t=acctType(a);
    const histPts=(a.history||[]).slice(-24).map(x=>x.balance);
    h+=`<div class="card acct-card ${a.archived?'':''}" style="${a.archived?'opacity:.5':''}">
      <div class="tag" style="background:${a.color||'#3a3a3a'}"></div>
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase">${esc(a.name)}</div>
          <div class="dim" style="font-size:12.5px;font-family:var(--mono)">${esc(a.institution||'')}${a.group?` <span class="badge" style="font-size:9.5px;margin-left:4px">${esc(a.group)}</span>`:''}</div>
          ${a.purchasePrice?(()=>{const ch=a.balance-a.purchasePrice;const pc=a.purchasePrice?(ch/a.purchasePrice*100):0;return`<div class="num" style="font-size:11.5px;margin-top:2px;color:${ch>=0?'var(--gn)':'var(--rd)'}">paid ${fmt0(a.purchasePrice)} &middot; ${ch>=0?'+':'-'}${fmt0(Math.abs(ch))} (${pc>=0?'+':''}${pc.toFixed(1)}%)</div>`})():''}
        </div>
        <span class="badge ${t.asset?'gn':'rd'}">${t.n}</span>
      </div>
      <div class="num" style="font-size:24px;font-weight:700;margin:10px 0 2px;${!t.asset&&a.balance!==0?'color:var(--rd)':''}">${fmt(Math.abs(a.balance))}</div>
      <div class="dim" style="font-size:12.5px;font-family:var(--mono)">${a.rate?a.rate+'% p.a.':''}${a.limit?(a.rate?' &middot; ':'')+'limit '+fmt0(a.limit):''}${a.archived?' &middot; ARCHIVED':''}</div>
      <div style="display:flex;align-items:flex-end;gap:8px;margin-top:10px">
        ${CH.spark(histPts,120,28,t.asset?CONFIG.colors.gn:CONFIG.colors.rd)}
        <span class="spacer" style="flex:1"></span>
        <button class="iconbtn" data-action="account-balance" data-id="${a.id}" title="Update balance">$&#8644;</button>
        <button class="iconbtn" data-action="account-edit" data-id="${a.id}" title="Edit">&#9998;</button>
        <button class="iconbtn del" data-action="account-del" data-id="${a.id}" title="Delete">&#10005;</button>
      </div>
    </div>`;
    }
    h+='</div>';

/* ---------------- TRANSACTIONS ---------------- */
function txFiltered(){
  const f=ui.txFilter;
  let list=state.transactions.filter(t=>
    (!f.account||t.accountId===f.account)&&
    (!f.category||t.categoryId===f.category)&&
    (!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&
    (!f.tag||(t.tags||[]).some(tg=>tg.toLowerCase()===f.tag.toLowerCase()))&&
    (!f.q||(t.payee+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(f.q.toLowerCase()))
  );
  const k=ui.txSort.key,dir=ui.txSort.dir;
  list.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(k==='amount'){va=a.amount;vb=b.amount}
    if(k==='category'){va=catShort(a.categoryId);vb=catShort(b.categoryId)}
    if(k==='account'){va=acctName(a.accountId);vb=acctName(b.accountId)}
    if(va<vb)return -dir; if(va>vb)return dir;
    return a.id<b.id?-dir:dir;
  });
  return list;
}
VIEWS.transactions=()=>{

  // or explicit link), so covered rows are visible at a glance
  const billByTx={},debtByTx={};
  for(const b of state.bills){
    if(b.active===false||!(b.matchKeyword||'').trim())continue;
    for(const p of ENGINE.billPayments(b))if(!billByTx[p.id])billByTx[p.id]=b.name;

  }
  // running balance when filtered to one account (compute over date-asc order)
  let running=null;
  if(f.account){
    const acct=byId(state.accounts,f.account);
    running=new Map();

    // reconstruct backwards from current balance
    let bal=acct?acct.balance:0;

    <select data-change="tx-filter" data-k="category" style="width:190px"><option value="">All categories</option>${[...catGroups()].map(([g,cats])=>`<optgroup label="${esc(g)}">`+cats.map(c=>`<option value="${c.id}" ${f.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')+'</optgroup>').join('')}</select>
    <input type="date" data-change="tx-filter" data-k="from" value="${f.from}" style="width:140px" title="From">

      return tags.length?`<select data-change="tx-filter" data-k="tag" style="width:130px"><option value="">All tags</option>${tags.map(tg=>`<option value="${esc(tg)}" ${f.tag===tg?'selected':''}>${esc(tg)}</option>`).join('')}</select>`:''})()}
    ${(f.account||f.category||f.from||f.to||f.q)?'<button class="btn sm ghost" data-action="tx-clear-filter">clear</button>':''}
  </div>`;
  if(upcoming.length){
    h+=`<div class="card" style="margin-bottom:14px;padding:10px 14px"><span class="sec-label">Upcoming recurring (30d): </span>`+
      upcoming.slice(0,5).map(u=>`<span class="badge ${u.overdue?'rd':''}" style="margin:2px 4px">${esc(u.rec.payee)} ${fmtD(u.date)} <span class="acc" data-action="recur-post" data-id="${u.rec.id}" data-date="${u.date}" style="cursor:pointer">post&nbsp;&rarr;</span></span>`).join('')+`</div>`;
  }
  if(!state.transactions.length)return h+emptyBox('\u21C6','No transactions yet. Add them manually or import your bank CSV - keyword rules will auto-categorise as you go.','<button class="btn" data-action="csv-import">Import a bank CSV</button>');
  if(!list.length)return h+emptyBox('\u2205','Nothing matches the current filters.','<button class="btn sm" data-action="tx-clear-filter">Clear filters</button>');
  const th=(k,label,cls)=>`<th class="sortable ${cls||''}" data-action="tx-sort" data-k="${k}">${label} ${ui.txSort.key===k?(ui.txSort.dir>0?'\u25B4':'\u25BE'):''}</th>`;
  const allSel=pageList.length&&pageList.every(t=>ui.txSel.has(t.id));
  h+=`<div class="card pad0"><table>
    <thead><tr><th style="width:30px"><input type="checkbox" data-change="tx-sel-all" ${allSel?'checked':''}></th>
    ${th('date','Date')}${th('payee','Payee')}${th('account','Account')}${th('category','Category')}${th('amount','Amount','r')}${running?'<th class="r">Balance</th>':''}<th></th></tr></thead><tbody>`;
  for(const t of pageList){
